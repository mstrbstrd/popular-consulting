name: Apply crystal tropical Tidal Weave palette

on:
  push:
    branches:
      - agent/tidal-water-palette
    paths:
      - .github/workflows/apply-tidal-water-palette-v2.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/tidal-water-palette
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Add the water-first palette option
        run: python scripts/apply_tidal_water_palette.py

      - name: Refine water into crystal tropical caustics
        run: python scripts/refine_tidal_tropical_water.py

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test -- --watchAll=false --runInBand
        env:
          CI: true

      - name: Build production bundle
        run: npm run build
        env:
          CI: true

      - name: Commit the finished palette option
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/components/DitherCanvasPage.js \
            src/components/DitherCanvasPage.css \
            src/components/DitherCanvasPage.test.js \
            src/components/CreatorOSFieldCanvas.js \
            src/components/CreatorOSFieldCanvas.css \
            src/components/CreatorOSFieldCanvas.test.js \
            src/components/CreatorOSFieldShader.js
          git rm \
            .github/workflows/apply-tidal-water-palette.yml \
            .github/workflows/apply-tidal-water-palette-v2.yml \
            scripts/apply_tidal_water_palette.py \
            scripts/refine_tidal_tropical_water.py
          git commit -m "Add crystal tropical Tidal Weave palette"
          git push origin HEAD:agent/tidal-water-palette
