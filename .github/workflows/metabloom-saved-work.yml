name: Metabloom saved work and threads Redis
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: metabloom-saved-work-${{ github.ref }}
  cancel-in-progress: true
jobs:
  redis-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint:saved-work
      - name: Verify account identity, saved work and chat thread API contracts
        run: |
          node --test server/auth-tests/metabloom-account-identity.test.mjs
          npm run test:saved-work
      - name: Install disposable Redis test runtime
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes redis-server
          redis-server --version
      - name: Verify durable ownership, thread and revision races, deletion and restart persistence
        shell: bash
        run: node --test --test-reporter=tap scripts/metabloom-saved-work-redis.test.cjs scripts/metabloom-threads-redis.test.cjs | tee metabloom-saved-work-redis.tap
        env:
          METABLOOM_SAVED_WORK_TEST_ALLOW_DISPOSABLE: '1'
          METABLOOM_SAVED_WORK_TEST_REQUIRE_REDIS: '1'
      - name: Preserve integration results without database archives
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metabloom-saved-work-redis-${{ github.sha }}
          path: metabloom-saved-work-redis.tap
          retention-days: 7
