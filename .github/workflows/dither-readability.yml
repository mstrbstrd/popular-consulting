name: Dither readability

on:
  pull_request:
    paths:
      - 'src/components/Dither*'
      - 'src/components/CreatorOS*.css'
      - 'src/components/CreatorOSField*.js'
      - 'src/components/ChiralWeave*'
      - 'src/index.css'
      - 'public/dither-typography.css'
      - 'scripts/generate-route-html.mjs'
      - 'scripts/verify-dither-readability.mjs'
      - 'scripts/verify-chiral-weave.mjs'
      - '.github/workflows/dither-readability.yml'
  push:
    branches: [main]
    paths:
      - 'src/components/Dither*'
      - 'src/components/CreatorOS*.css'
      - 'src/components/CreatorOSField*.js'
      - 'src/components/ChiralWeave*'
      - 'src/index.css'
      - 'public/dither-typography.css'
      - 'scripts/generate-route-html.mjs'
      - 'scripts/verify-dither-readability.mjs'
      - 'scripts/verify-chiral-weave.mjs'
      - '.github/workflows/dither-readability.yml'

permissions:
  contents: read

concurrency:
  group: dither-readability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-font-readability:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check actual webfonts, title fit, and light/dark copy
        env:
          VISUAL_CAPTURE_BROWSER: /usr/bin/google-chrome
        run: |
          test -x "$VISUAL_CAPTURE_BROWSER"
          node scripts/verify-dither-readability.mjs
      - name: Preserve screenshot and numerical evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dither-readability-evidence
          path: |
            dither-readability-evidence/*.json
            dither-readability-evidence/*.png
          if-no-files-found: ignore
          retention-days: 7
  chiral-geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Compile field and verify spatial reflection
        env:
          VISUAL_CAPTURE_BROWSER: /usr/bin/google-chrome
        run: |
          test -x "$VISUAL_CAPTURE_BROWSER"
          node scripts/verify-chiral-weave.mjs
      - name: Preserve shader evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chiral-weave-evidence
          path: |
            chiral-weave-evidence/*.json
            chiral-weave-evidence/*.png
          if-no-files-found: ignore
          retention-days: 7
