name: Popcan selection review
on:
  push:
    branches: [feat/popcan-select-move]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: git archive --format=zip --output=popcan-selection-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: popcan-selection-source
          path: popcan-selection-source.zip
          retention-days: 1
