name: Popcan selection review
on:
  push:
    branches: [feat/popcan-select-move]
permissions:
  contents: write
concurrency:
  group: popcan-select-review
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Apply checksum-verified selection implementation
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib
          from pathlib import Path
          text = ''.join(Path(f'.github/popcan-select-{i}.b64').read_text().strip() for i in range(4))
          text = text.replace('T2lWeajWRdUTTuu9rgdu', 'T2lWeajWRdUTjdTuu9rgdu')
          patch = gzip.decompress(base64.b64decode(text, validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'd043e335dedfe1bd5b44010b20c4e30d6937de1bd1d8bba942ca986e96fefc84', 'Patch content mismatch'
          Path('/tmp/popcan-selection.patch').write_bytes(patch)
          PY
          git apply --check /tmp/popcan-selection.patch
          git apply /tmp/popcan-selection.patch
          python3 .github/popcan-select-amend.py
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test -- --watchAll=false --runInBand
        env:
          CI: true
      - run: npm run build
        env:
          CI: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify existing drawing, text and navigation behavior
        run: node scripts/verify-popcan-browser.mjs
        env:
          CI: true
          VISUAL_CAPTURE_BROWSER: /usr/bin/google-chrome
          POPCAN_VERIFY_OUTPUT: ${{ runner.temp }}/popcan-select-evidence/regression
      - name: Verify object selection, movement and persisted layers
        run: node scripts/verify-popcan-selection.mjs
        env:
          CI: true
          VISUAL_CAPTURE_BROWSER: /usr/bin/google-chrome
          POPCAN_VERIFY_OUTPUT: ${{ runner.temp }}/popcan-select-evidence/selection
      - name: Publish verified implementation on the feature branch
        run: |
          git rm .github/popcan-select-0.b64 .github/popcan-select-1.b64 .github/popcan-select-2.b64 .github/popcan-select-3.b64 .github/popcan-select-amend.py .github/workflows/popcan-select-review.yml
          git add src/components/PopcanPage.js src/components/PopcanPage.css src/components/PopcanIntegration.test.js src/components/popcan/PopcanIcon.js src/components/popcan/popcanEngine.js src/components/popcan/popcanObjects.js src/components/popcan/popcanObjects.test.js scripts/verify-popcan-browser.mjs scripts/verify-popcan-selection.mjs docs/popcan.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: select and move individual Popcan objects with persistent layers'
          git push origin HEAD:feat/popcan-select-move
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: popcan-select-evidence
          path: ${{ runner.temp }}/popcan-select-evidence
          retention-days: 3
