name: Fix Metabloom mount identity

on:
  push:
    branches:
      - fix/metabloom-event-correlation-20260903

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/metabloom-event-correlation-20260903

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply mount identity fix
        run: python scripts/fix_metabloom_mount_identity.py

      - name: Check whitespace
        run: git diff --check

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --watchAll=false --runInBand
        env:
          CI: true

      - name: Build production bundle
        run: npm run build
        env:
          CI: true

      - name: Commit verified source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/fix_metabloom_mount_identity.py
          git rm .github/workflows/fix-metabloom-mount-identity.yml
          git add src/components/OrbSection.js \
            src/components/OrbSection.test.js \
            docs/architecture/metabloom-chat-interface.md
          git diff --cached --check
          git commit -m "Scope Metabloom request IDs to each mount"
          git push origin "HEAD:${GITHUB_REF_NAME}"
