name: Apply and verify Metabloom imperative state fix

on:
  push:
    branches:
      - codex/metabloom-emotive-runtime

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out refinement branch
        uses: actions/checkout@v4
        with:
          ref: codex/metabloom-emotive-runtime

      - name: Reconstruct and apply state fix
        shell: bash
        run: |
          base64 --decode scripts/metabloom-imperative-state.patch.gz.b64 \
            | gzip --decompress \
            > "$RUNNER_TEMP/metabloom-imperative-state.patch"
          echo "cab08fe2d28c802bc300db7ab4cfc5f3fa4425d67c48a9c4692e9bb9f7c66f6d  $RUNNER_TEMP/metabloom-imperative-state.patch" \
            | sha256sum --check
          git apply --index "$RUNNER_TEMP/metabloom-imperative-state.patch"
          git diff --cached --check

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Run complete test suite
        run: npm test -- --watchAll=false --runInBand
        env:
          CI: true

      - name: Build production bundle
        run: npm run build
        env:
          CI: true

      - name: Commit verified source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/metabloom-imperative-state.patch.gz.b64
          git rm .github/workflows/fix-metabloom-imperative-state.yml
          git add -A
          git diff --cached --check
          git commit -m "Synchronize Metabloom agent state"
          git push origin "HEAD:${GITHUB_REF_NAME}"
