name: Navier Stokes Workbench
on:
  push:
    branches: [feat/navier-stokes-study]
permissions:
  contents: read
jobs:
  workbench:
    if: github.repository == 'mstrbstrd/popular-consulting'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply reviewed source edits
        if: hashFiles('scripts/apply-navier-stokes.cjs') != ''
        run: node scripts/apply-navier-stokes.cjs
      - name: Save reviewed integration on isolated branch
        run: |
          git add src/components public/dither-typography.css CLAUDE.md scripts/verify-chiral-weave.mjs
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat: integrate finite-energy Navier-Stokes dither study'
            git push origin HEAD:feat/navier-stokes-study
          fi
      - name: Export reviewed source
        run: |
          mkdir -p /tmp/ns-source
          git ls-files -z src public scripts docs package.json package-lock.json CLAUDE.md CONTRIBUTING.md .github/workflows | tar --null -T - -czf /tmp/ns-source/source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: navier-stokes-source
          path: /tmp/ns-source/source.tar.gz
          retention-days: 2
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Focused tests
        run: CI=true npm test -- --watchAll=false --runInBand --testPathPattern='NavierStokes|DitherCanvas|CreatorOSField|ChiralWeave'
      - name: Complete regression suite
        id: complete-suite
        continue-on-error: true
        run: CI=true npm test -- --watchAll=false --runInBand
      - name: Production build
        run: npm run build
      - name: Install browser verifier
        run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.51.1
      - name: Browser validation
        env:
          VISUAL_CAPTURE_BROWSER: /usr/bin/google-chrome
        run: |
          node scripts/verify-navier-stokes-shader.mjs
          node scripts/verify-navier-stokes.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: navier-stokes-evidence
          path: navier-stokes-evidence
          if-no-files-found: ignore
          retention-days: 7
