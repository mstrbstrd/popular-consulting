name: Popcan page review
on:
  push:
    branches: [fix/popcan-page-canvas]
permissions:
  contents: write
concurrency:
  group: popcan-page-review
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Apply reviewed layout patch
        run: |
          python3 - <<'PY'
          import base64, hashlib, zlib
          from pathlib import Path
          encoded = Path('.github/popcan-page.patch.b64').read_text().strip()
          encoded = encoded.replace('QbrDpppY4', 'QbrDppY4')
          patch = zlib.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'f2709e4f0d3c3a5ac67dc3fa63b783637ab2ca909592285d0688c1f3289ceaaf'
          Path('/tmp/popcan-page.patch').write_bytes(patch)
          PY
          git apply --check /tmp/popcan-page.patch
          git apply /tmp/popcan-page.patch
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test -- --watchAll=false --runInBand
        env:
          CI: true
      - run: npm run build
        env:
          CI: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify drawing coverage, persistence, zoom, pan and rotation
        run: node scripts/verify-popcan-browser.mjs
        env:
          CI: true
          VISUAL_CAPTURE_BROWSER: /usr/bin/google-chrome
          POPCAN_VERIFY_OUTPUT: ${{ runner.temp }}/popcan-page-evidence
      - name: Publish only verified changes on the review branch
        run: |
          git rm .github/popcan-page.patch.b64 .github/workflows/popcan-page-review.yml
          git add src/components/PopcanPage.js src/components/PopcanPage.css src/components/PopcanIntegration.test.js scripts/verify-popcan-browser.mjs docs/popcan.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: make Popcan canvas the full-page drawing background'
          git push origin HEAD:fix/popcan-page-canvas
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: popcan-page-evidence
          path: ${{ runner.temp }}/popcan-page-evidence
          retention-days: 3
