name: Lift Tidal Weave intersections

on:
  push:
    branches:
      - agent/lift-tidal-intersections
    paths:
      - .github/workflows/apply-tidal-intersection-light.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/lift-tidal-intersections
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Keep intersecting caustics bright
        shell: python
        run: |
          from pathlib import Path

          shader_path = Path("src/components/CreatorOSFieldShader.js")
          shader = shader_path.read_text(encoding="utf-8")

          old = '''float outlineWeight = outlineA + outlineB;
          vec3 spectralOutlineTint = (
            outlineTintA * outlineA
              + outlineTintB * outlineB
          ) / max(outlineWeight, 0.0001);
          float spectralOutline = sat(max(outlineA, outlineB));
          float spectralOutlineStrength = mix(0.92, 0.90, u_light);
          waterTint = mix(
            waterTint,
            spectralOutlineTint,
            spectralOutline * spectralOutlineStrength
          );'''

          new = '''float outlineWeight = outlineA + outlineB;
          vec3 spectralOutlineTint = (
            outlineTintA * outlineA
              + outlineTintB * outlineB
          ) / max(outlineWeight, 0.0001);

          // Two pale spectral edges should combine like refracted light, not
          // like stacked pigment. Lift only their overlap onto the existing
          // crystal-light value while retaining a subtle spectral separation.
          float outlineOverlap = smoothstep(
            0.08,
            0.46,
            outlineA * outlineB
          );
          float outlineLuma = dot(
            spectralOutlineTint,
            vec3(0.2126, 0.7152, 0.0722)
          );
          vec3 intersectionSpectralTint = refractedLight
            + (spectralOutlineTint - vec3(outlineLuma)) * 0.24;
          intersectionSpectralTint = max(
            intersectionSpectralTint,
            refractedLight * 0.96
          );
          spectralOutlineTint = mix(
            spectralOutlineTint,
            intersectionSpectralTint,
            outlineOverlap
          );

          float spectralOutline = sat(max(outlineA, outlineB));
          float spectralOutlineStrength = mix(0.92, 0.90, u_light);
          waterTint = mix(
            waterTint,
            spectralOutlineTint,
            spectralOutline * spectralOutlineStrength
          );'''

          if shader.count(old) != 1:
              raise SystemExit("Expected exactly one Tidal Weave outline blend block.")

          shader_path.write_text(shader.replace(old, new), encoding="utf-8")

          test_path = Path(
              "src/components/TidalWeaveIntersectionBrightness.test.js"
          )
          test_path.write_text(
              '''import { CREATOROS_FIELD_FRAGMENT_SHADER } from "./CreatorOSFieldShader";

          describe("Tidal Weave intersection brightness", () => {
            const tidalStart = CREATOROS_FIELD_FRAGMENT_SHADER.indexOf(
              "vec4 sceneTidalWeave",
            );
            const tidalEnd = CREATOROS_FIELD_FRAGMENT_SHADER.indexOf(
              "vec4 sceneMoireHalo",
            );
            const tidalScene = CREATOROS_FIELD_FRAGMENT_SHADER.slice(
              tidalStart,
              tidalEnd,
            );

            test("lifts overlapping spectral edges without changing line motion", () => {
              expect(tidalStart).toBeGreaterThanOrEqual(0);
              expect(tidalEnd).toBeGreaterThan(tidalStart);
              expect(tidalScene).toContain("float outlineOverlap = smoothstep(");
              expect(tidalScene).toContain("outlineA * outlineB");
              expect(tidalScene).toContain("float outlineLuma = dot(");
              expect(tidalScene).toContain(
                "vec3 intersectionSpectralTint = refractedLight",
              );
              expect(tidalScene).toContain(
                "(spectralOutlineTint - vec3(outlineLuma)) * 0.24",
              );
              expect(tidalScene).toContain("refractedLight * 0.96");
              expect(tidalScene).toContain("intersectionSpectralTint,");
              expect(tidalScene).toContain("outlineOverlap");
              expect(tidalScene).toContain(
                "float bandA = exp(-abs(sin(phaseA * PI * 2.65)) * 4.3)",
              );
              expect(tidalScene).toContain(
                "float bandB = exp(-abs(sin(phaseB * PI * 2.82)) * 4.5)",
              );
              expect(tidalScene).toContain(
                "return fluidMaterial(field, tint, 0.34, 0.22, 0.94)",
              );
            });
          });
          ''',
              encoding="utf-8",
          )

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test -- --watchAll=false --runInBand
        env:
          CI: true

      - name: Build production bundle
        run: npm run build
        env:
          CI: true

      - name: Commit and push the refinement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/components/CreatorOSFieldShader.js \
            src/components/TidalWeaveIntersectionBrightness.test.js
          git rm .github/workflows/apply-tidal-intersection-light.yml
          git commit -m "Keep Tidal Weave intersections bright"
          git push origin HEAD:agent/lift-tidal-intersections
