name: Popcan selection production verification
on:
  push:
    branches: [verify/popcan-select-production]
permissions:
  contents: write
  statuses: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Correct legacy browser event simulation without changing the app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/verify-popcan-browser.mjs')
          s = p.read_text()
          old = "const click = (label) => evaluate(`document.querySelector('button[aria-label=${JSON.stringify(label)}]').click()`);"
          assert old in s
          s = s.replace(old, "const click = async (label) => { await evaluate(`document.querySelector('button[aria-label=${JSON.stringify(label)}]').click()`); await sleep(40); };")
          old = 'y:y+(ey-y)*i/8,buttons }'
          assert old in s
          s = s.replace(old, 'y:y+(ey-y)*i/8,button,buttons }')
          s = s.replace("el.tagName==='SELECT'?'change':'input'", "el.tagName==='SELECT'||el.type==='color'?'change':'input'")
          p.write_text(s)
          PY
          git diff --check
      - name: Wait for the production feature deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 40); do
            status=$(gh api repos/mstrbstrd/popular-consulting/commits/4746a85f120fa6a0ef152f78cbf14354d3da05b3/status --jq '.statuses | map(select(.context == "Vercel")) | first | .state')
            case "$status" in
              success) exit 0 ;;
              failure|error) echo 'Production deployment failed'; exit 1 ;;
            esac
            sleep 5
          done
          echo 'Production deployment did not become ready'; exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify live object selection and local persistence
        run: node scripts/verify-popcan-selection.mjs
        env:
          CI: true
          VISUAL_CAPTURE_BROWSER: /usr/bin/google-chrome
          POPCAN_VERIFY_ORIGIN: https://popular-consulting.com
          POPCAN_VERIFY_OUTPUT: ${{ runner.temp }}/popcan-selection-production/selection
      - name: Verify live drawing, text, zoom and pan regressions
        run: node scripts/verify-popcan-browser.mjs
        env:
          CI: true
          VISUAL_CAPTURE_BROWSER: /usr/bin/google-chrome
          POPCAN_VERIFY_ORIGIN: https://popular-consulting.com
          POPCAN_VERIFY_OUTPUT: ${{ runner.temp }}/popcan-selection-production/regression
      - name: Preserve the validated test correction and remove temporary workflow
        run: |
          git rm .github/workflows/popcan-select-production.yml
          git add scripts/verify-popcan-browser.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test: keep legacy Popcan drag simulation consistent with selection checks'
          git push origin HEAD:verify/popcan-select-production
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: popcan-selection-production
          path: ${{ runner.temp }}/popcan-selection-production
          retention-days: 3
