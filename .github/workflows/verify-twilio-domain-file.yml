name: Verify public Twilio domain file
on:
  push:
    branches: [verify/twilio-domain-file-34970e9]
    paths: [.github/workflows/verify-twilio-domain-file.yml]
permissions: {}
jobs:
  public-file:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check public response without credentials or redirects
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import urllib.request

          url = 'https://popular-consulting.com/a76d736340efaba981ff7774c76b4f88.html'
          expected = b'twilio-domain-verification=a76d736340efaba981ff7774c76b4f88'

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          opener = urllib.request.build_opener(NoRedirect)
          request = urllib.request.Request(url, headers={'User-Agent': 'Orb-domain-verification-check/1.0'})
          with opener.open(request, timeout=30) as response:
              body = response.read(4096)
              result = {
                  'url': url,
                  'status': response.status,
                  'content_type': response.headers.get('Content-Type'),
                  'bytes': len(body),
                  'exact_match': body == expected,
                  'sha256': hashlib.sha256(body).hexdigest(),
                  'credentials_used': False,
                  'redirects_followed': False,
              }
              print(json.dumps(result, indent=2))
              assert response.status == 200, 'Expected HTTP 200'
              assert body == expected, 'Live file does not exactly match the upload'
          PY
