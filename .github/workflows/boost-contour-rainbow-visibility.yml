name: Boost Contour Drift rainbow visibility

on:
  push:
    branches:
      - agent/contour-rainbow-boost
    paths:
      - .github/workflows/boost-contour-rainbow-visibility.yml

permissions:
  contents: write

jobs:
  refine-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/contour-rainbow-boost
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Increase the contour edge spectrum by twenty percent
        shell: python
        run: |
          from pathlib import Path

          def replace_once(source, old, new, label):
              count = source.count(old)
              if count != 1:
                  raise SystemExit(
                      f"{label}: expected exactly one target, found {count}."
                  )
              return source.replace(old, new)

          shader_path = Path("src/components/CreatorOSFieldShader.js")
          shader = shader_path.read_text(encoding="utf-8")

          shader = replace_once(
              shader,
              "  float contourChroma = mix(0.22, 0.16, u_light);",
              "  float contourChroma = mix(0.264, 0.192, u_light);",
              "Contour edge chroma",
          )
          shader = replace_once(
              shader,
              "    contourEdge * 0.92\n  );",
              "    sat(contourEdge * 1.104)\n  );",
              "Contour edge pre-material strength",
          )
          shader = replace_once(
              shader,
              "    max(material.rgb, spectralContourEdge * 0.92),\n    terrainPaletteWeight * contourEdge * 0.72",
              "    max(material.rgb, spectralContourEdge * 0.96),\n    terrainPaletteWeight * contourEdge * 0.864",
              "Contour edge post-material strength",
          )
          shader_path.write_text(shader, encoding="utf-8")

          test_path = Path(
              "src/components/ContourDriftFunctionalTopography.test.js"
          )
          test_source = test_path.read_text(encoding="utf-8")
          test_source = replace_once(
              test_source,
              '    expect(scene).toContain("contourEdge * 0.92");',
              '''    expect(scene).toContain("mix(0.264, 0.192, u_light)");
              expect(scene).toContain("sat(contourEdge * 1.104)");
              expect(scene).toContain("spectralContourEdge * 0.96");
              expect(scene).toContain(
                "terrainPaletteWeight * contourEdge * 0.864",
              );''',
              "Contour edge regression expectations",
          )
          test_path.write_text(test_source, encoding="utf-8")

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test -- --watchAll=false --runInBand
        env:
          CI: true

      - name: Build production bundle
        run: npm run build
        env:
          CI: true

      - name: Commit and push the focused refinement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/components/CreatorOSFieldShader.js \
            src/components/ContourDriftFunctionalTopography.test.js
          git rm .github/workflows/boost-contour-rainbow-visibility.yml
          git commit -m "Boost Contour Drift rainbow visibility"
          git push origin HEAD:agent/contour-rainbow-boost
