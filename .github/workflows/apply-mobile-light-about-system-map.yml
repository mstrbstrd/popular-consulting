name: Apply mobile light and About system map

on:
  push:
    branches:
      - feat/mobile-light-about-system-map-20260901

permissions:
  contents: write

concurrency:
  group: apply-mobile-light-about-system-map-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feat/mobile-light-about-system-map-20260901

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply guarded source changes
        run: python scripts/apply_mobile_light_about_system_map.py

      - name: Check patch whitespace
        run: git diff --check

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run dark evidence self-tests
        run: |
          npm run visual:dark-evidence:self-test
          node scripts/dark-evidence-hosted-diagnostic.mjs --self-test
          node scripts/run-physical-dark-qualification.mjs --self-test
          node scripts/verify-physical-dark-qualification.mjs --self-test
          node scripts/aggregate-dark-evidence.mjs --self-test

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --watchAll=false --runInBand
        env:
          CI: true

      - name: Build
        run: npm run build
        env:
          CI: true

      - name: Commit verified changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/apply_mobile_light_about_system_map.py
          git rm .github/workflows/apply-mobile-light-about-system-map.yml
          git add \
            src/utils/mobileGraphicsCapability.js \
            src/utils/mobileGraphicsCapability.test.js \
            src/components/BlackHoleBackground.js \
            src/components/ProductionThemeCanvas.js \
            src/components/ParallaxBackground.js \
            src/components/MobileLightTheme.test.js \
            src/components/BusinessSystemsVisual.js \
            src/components/BusinessSystemsVisual.css \
            src/components/BusinessSystemsVisual.test.js
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No verified source changes were produced."
            exit 1
          fi
          git commit -m "Improve capable mobile light mode and About animation"
          git push origin "HEAD:${GITHUB_REF_NAME}"
