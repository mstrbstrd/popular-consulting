name: Apply dither scroll sensitivity refinement v2

on:
  push:
    branches:
      - agent/reduce-dither-scroll-sensitivity
    paths:
      - .github/workflows/apply-dither-scroll-sensitivity-v2.yml

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/reduce-dither-scroll-sensitivity
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply scroll pacing refinement
        run: python scripts/apply_dither_scroll_sensitivity.py

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test -- --watchAll=false --runInBand
        env:
          CI: true

      - name: Build production bundle
        run: npm run build
        env:
          CI: true

      - name: Commit the scroll pacing refinement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/components/DitherCanvasPage.js \
            src/components/DitherCanvasPage.test.js \
            src/components/DitherScrollNarrative.css \
            src/components/DitherScrollNarrative.test.js
          git rm \
            .github/workflows/apply-dither-scroll-sensitivity.yml \
            .github/workflows/apply-dither-scroll-sensitivity-v2.yml \
            scripts/apply_dither_scroll_sensitivity.py
          git commit -m "Reduce dither scroll sensitivity"
          git push origin HEAD:agent/reduce-dither-scroll-sensitivity
