name: Apply exact Morphogen rendering restoration

on:
  push:
    branches:
      - agent/restore-exact-morphogen-rendering
    paths:
      - .github/workflows/apply-exact-morphogen-rendering.yml

permissions:
  contents: write

jobs:
  restore-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/restore-exact-morphogen-rendering
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Restore exact original Morphogen rendering path
        run: python scripts/restore_exact_morphogen_rendering.py

      - name: Verify patch whitespace
        run: git diff --check

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test -- --watchAll=false --runInBand
        env:
          CI: true

      - name: Build production bundle
        run: npm run build
        env:
          CI: true

      - name: Commit and push exact restoration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/components/CreatorOSFieldShader.js \
            src/components/CreatorOSFieldCanvas.js \
            src/components/CreatorOSFieldCanvas.test.js \
            src/components/MorphogenPaintMode.test.js
          git rm -f \
            .github/workflows/apply-exact-morphogen-rendering.yml \
            scripts/restore_exact_morphogen_rendering.py
          git commit -m "Restore exact Morphogen organism rendering"
          git push origin HEAD:agent/restore-exact-morphogen-rendering
