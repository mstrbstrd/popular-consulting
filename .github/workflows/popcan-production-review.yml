name: Popcan production verification
on:
  push:
    branches: [feat/popcan-studio]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1ae72aa3a6dae08e2af2fa4fd6c8ed5232bc5ee5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wait for the new public route
        run: |
          for i in $(seq 1 24); do
            if curl --fail --silent --show-error --max-time 10 'https://popular-consulting.com/popcan' | grep -q 'Popular Canvas | Popcan'; then exit 0; fi
            sleep 5
          done
          exit 1
      - name: Test live route drawing, local draft reload and touch
        run: node scripts/verify-popcan-browser.mjs
        env:
          CI: true
          VISUAL_CAPTURE_BROWSER: /usr/bin/google-chrome
          POPCAN_VERIFY_ORIGIN: https://popular-consulting.com
          POPCAN_VERIFY_OUTPUT: ${{ runner.temp }}/popcan-production
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: popcan-production
          path: ${{ runner.temp }}/popcan-production
          retention-days: 3
