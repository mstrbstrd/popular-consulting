name: Verify Second Surface alpha composition

on:
  push:
    branches:
      - fix/second-surface-premultiplied-alpha-default-label-20260901

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/second-surface-premultiplied-alpha-default-label-20260901
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply guarded alpha fix
        run: python scripts/fix_second_surface_alpha.py
      - name: Check whitespace
        run: git diff --check
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test -- --watchAll=false --runInBand
        env:
          CI: true
      - name: Build
        run: npm run build
        env:
          CI: true
      - name: Commit verified source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/fix_second_surface_alpha.py
          git rm .github/workflows/fix-second-surface-alpha.yml
          git add src/components/DitherCanvasPage.js src/components/DitherCanvasPage.test.js src/components/DitherCanvasRuntimeContract.test.js src/components/RuptureCanvas.js src/components/RuptureShader.js
          git diff --cached --check
          git commit -m "Fix Second Surface transparent underlays"
          git push origin "HEAD:${GITHUB_REF_NAME}"
