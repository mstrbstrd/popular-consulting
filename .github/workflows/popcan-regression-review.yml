name: Popcan regression review
on:
  push:
    branches: [fix/popcan-drawing-regressions]
permissions:
  contents: write
concurrency:
  group: popcan-regression-review
  cancel-in-progress: true
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Apply the exact source already tested in run 36603309493
        run: |
          python3 - <<'PY'
          import base64, hashlib, lzma
          from pathlib import Path
          encoded = ''.join(Path(f'.github/popcan-fix-{i}.b64').read_text().strip() for i in range(1,5))
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'c15d2fbfcf76132e6f0726984e8691e744664b8f44fadd1f06fc61e6c6f0c26d'
          assert hashlib.sha256(Path('.github/workflows/popcan-regressions.yml').read_bytes()).hexdigest() == 'f9537174de24768110508fe2ff0ab333957accf44e372ffd7a2a27fa3e2d2097'
          Path('/tmp/popcan-fix.patch').write_bytes(patch)
          PY
          git apply --check --exclude=.github/workflows/popcan-regressions.yml /tmp/popcan-fix.patch
          git apply --exclude=.github/workflows/popcan-regressions.yml /tmp/popcan-fix.patch
      - name: Commit source and remove temporary delivery files
        run: |
          git rm .github/popcan-fix-{1,2,3,4}.b64 .github/probe-popcan-regressions.mjs .github/workflows/popcan-regression-review.yml
          git add src scripts docs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: preserve consecutive gestures and draw across a theme-aware sparse workspace'
          git push origin HEAD:fix/popcan-drawing-regressions
