name: Popcan regression review
on:
  push:
    branches: [fix/popcan-drawing-regressions]
permissions:
  contents: write
concurrency:
  group: popcan-regression-review
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Apply checksum-verified drawing fixes
        run: |
          python3 - <<'PY'
          import base64, hashlib, lzma
          from pathlib import Path
          encoded = ''.join(Path(f'.github/popcan-fix-{i}.b64').read_text().strip() for i in range(1,5))
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'c15d2fbfcf76132e6f0726984e8691e744664b8f44fadd1f06fc61e6c6f0c26d'
          Path('/tmp/popcan-fix.patch').write_bytes(patch)
          PY
          git apply --check /tmp/popcan-fix.patch
          git apply /tmp/popcan-fix.patch
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test -- --watchAll=false --runInBand
        env:
          CI: true
      - run: npm run build
        env:
          CI: true
      - name: Verify drawing text and navigation
        run: node scripts/verify-popcan-browser.mjs
        env:
          CI: true
          VISUAL_CAPTURE_BROWSER: /usr/bin/google-chrome
          POPCAN_VERIFY_OUTPUT: ${{ runner.temp }}/popcan-regression/drawing
      - name: Verify independent objects and persistence
        run: node scripts/verify-popcan-selection.mjs
        env:
          CI: true
          VISUAL_CAPTURE_BROWSER: /usr/bin/google-chrome
          POPCAN_VERIFY_OUTPUT: ${{ runner.temp }}/popcan-regression/selection
      - name: Verify consecutive gestures theme and minimum-zoom drawing
        run: node scripts/verify-popcan-regressions.mjs
        env:
          CI: true
          VISUAL_CAPTURE_BROWSER: /usr/bin/google-chrome
          POPCAN_VERIFY_OUTPUT: ${{ runner.temp }}/popcan-regression/fixes
      - name: Commit only validated source on the review branch
        run: |
          git rm .github/popcan-fix-{1,2,3,4}.b64 .github/probe-popcan-regressions.mjs .github/workflows/popcan-regression-review.yml
          git add src scripts docs .github/workflows/popcan-regressions.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: preserve consecutive gestures and draw across a theme-aware sparse workspace'
          git push origin HEAD:fix/popcan-drawing-regressions
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: popcan-regression-evidence
          path: ${{ runner.temp }}/popcan-regression
          retention-days: 3
