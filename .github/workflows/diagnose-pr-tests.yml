name: Diagnose PR tests

on:
  push:
    branches:
      - agent/dual-audience-copy
    paths:
      - ".github/workflows/diagnose-pr-tests.yml"

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/dual-audience-copy
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Run tests and capture output
        shell: bash
        run: |
          set +e
          npm ci --no-audit --no-fund > /tmp/pr-test-diagnostic.txt 2>&1
          INSTALL_STATUS=$?
          if [ "$INSTALL_STATUS" -eq 0 ]; then
            CI=true npm test -- --watchAll=false --runInBand >> /tmp/pr-test-diagnostic.txt 2>&1
            TEST_STATUS=$?
          else
            TEST_STATUS=$INSTALL_STATUS
          fi
          echo >> /tmp/pr-test-diagnostic.txt
          echo "status=$TEST_STATUS" >> /tmp/pr-test-diagnostic.txt
          exit 0

      - name: Commit diagnostic
        run: |
          cp /tmp/pr-test-diagnostic.txt scripts/pr-test-diagnostic.txt
          git config user.name "openai-agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/pr-test-diagnostic.txt
          git commit -m "Record PR test diagnostic [skip ci]"
          git push origin HEAD:agent/dual-audience-copy
