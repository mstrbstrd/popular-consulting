name: Orb relay source snapshot
on:
  push:
    branches: [feat/orb-sms-relay]
    paths: [.github/workflows/orb-sms-source.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: git archive --format=tar HEAD > source.tar
      - uses: actions/upload-artifact@v4
        with:
          name: orb-relay-source
          path: source.tar
          retention-days: 1
