name: Add Tidal Weave tropical water surface

on:
  push:
    branches:
      - agent/tidal-water-palette
    paths:
      - .github/workflows/add-tidal-water-surface.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/tidal-water-palette
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Add the water surface color treatment
        run: python scripts/add_tidal_water_surface.py

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test -- --watchAll=false --runInBand
        env:
          CI: true

      - name: Build production bundle
        run: npm run build
        env:
          CI: true

      - name: Commit the water surface refinement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/components/CreatorOSFieldCanvas.css \
            src/components/CreatorOSFieldCanvas.test.js
          git rm \
            .github/workflows/add-tidal-water-surface.yml \
            scripts/add_tidal_water_surface.py
          git commit -m "Add tropical water surface beneath Tidal Weave"
          git push origin HEAD:agent/tidal-water-palette
