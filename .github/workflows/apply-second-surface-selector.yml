name: Verify Second Surface selector

on:
  push:
    branches:
      - feature/second-surface-theme-selector-20260901

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/second-surface-theme-selector-20260901
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply guarded implementation
        run: |
          sed -i 's/content.count(old) != 1/content.count(old) < 1/' scripts/apply_second_surface_selector.py
          python scripts/apply_second_surface_selector.py
      - name: Check whitespace
        run: git diff --check
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test -- --watchAll=false --runInBand
        env:
          CI: true
      - name: Build
        run: npm run build
        env:
          CI: true
      - name: Commit verified source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/apply_second_surface_selector.py
          git rm .github/workflows/apply-second-surface-selector.yml
          git add src/components/DitherCanvasPage.js src/components/DitherCanvasPage.css src/components/DitherCanvasPage.test.js src/components/DitherCanvasRuntimeContract.test.js src/components/RuptureCanvas.js src/components/RuptureShader.js
          git diff --cached --check
          git commit -m "Let Second Surface reveal any field study"
          git push origin "HEAD:${GITHUB_REF_NAME}"
