name: Apply final Metabloom emote protocol

on:
  push:
    branches:
      - codex/metabloom-emote-protocol

permissions:
  contents: write

concurrency:
  group: pr117-finalize
  cancel-in-progress: false

jobs:
  apply-verify-and-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out protocol branch
        uses: actions/checkout@v4
        with:
          ref: codex/metabloom-emote-protocol

      - name: Reconstruct and apply final source
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode scripts/pr117-final.patch.gz.b64 \
            | gzip --decompress \
            > "$RUNNER_TEMP/pr117-final.patch"
          echo "46a80578eff3bb5420f76a79afe78535dbc4f9de5ef738a24fcd3428f2ac2dd7  $RUNNER_TEMP/pr117-final.patch" \
            | sha256sum --check
          git apply --index "$RUNNER_TEMP/pr117-final.patch"
          git diff --cached --check

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Run complete test suite
        run: npm test -- --watchAll=false --runInBand
        env:
          CI: true

      - name: Build production bundle
        run: npm run build
        env:
          CI: true

      - name: Commit verified clean source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f scripts/pr117-final.patch.gz.b64
          git rm -f .github/workflows/apply-pr117-final.yml
          git add -A
          git diff --cached --check
          git commit -m "Finalize Metabloom emote response protocol"
          git push origin "HEAD:${GITHUB_REF_NAME}"
