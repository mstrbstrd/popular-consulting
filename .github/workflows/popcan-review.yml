name: Popcan review
on:
  push:
    branches: [feat/popcan-studio]
permissions:
  contents: write
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Make browser startup diagnostic and CI-safe
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/verify-popcan-browser.mjs')
          s = p.read_text()
          s = s.replace("process.getuid?.() === 0 ? ['--no-sandbox'] : []", "process.getuid?.() === 0 || process.env.CI ? ['--no-sandbox'] : []")
          s = s.replace("{ stdio: 'ignore' });", "{ stdio: ['ignore', 'ignore', 'pipe'] });\n  child.stderr.on('data', (chunk) => fs.appendFileSync(path.join(output, 'browser.log'), chunk));")
          s = s.replace('i < 100 && !fs.existsSync(portFile)', 'i < 300 && !fs.existsSync(portFile)')
          p.write_text(s)
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
        env:
          CI: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test real drawing, persistence and touch
        run: node scripts/verify-popcan-browser.mjs
        env:
          CI: true
          VISUAL_CAPTURE_BROWSER: /usr/bin/google-chrome
          POPCAN_VERIFY_OUTPUT: ${{ runner.temp }}/popcan-functional
      - name: Commit browser verification improvement
        run: |
          git add scripts/verify-popcan-browser.mjs
          git config user.name 'mstrbstrd'
          git config user.email '104603175+mstrbstrd@users.noreply.github.com'
          git commit -m 'test: verify Popular Canvas persistence and touch in Chrome'
          git push origin HEAD:feat/popcan-studio
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: popcan-functional
          path: ${{ runner.temp }}/popcan-functional
          retention-days: 3
