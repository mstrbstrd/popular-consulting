name: Popcan review
on:
  push:
    branches: [feat/popcan-studio]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git archive --format=zip --output=popcan-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: popcan-source
          path: popcan-source.zip
          retention-days: 1
