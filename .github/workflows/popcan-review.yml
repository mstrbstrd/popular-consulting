name: Popcan review
on:
  push:
    branches: [feat/popcan-studio]
permissions:
  contents: write
concurrency:
  group: popcan-review
  cancel-in-progress: true
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Apply validated route integration
        run: |
          echo '5262e9a77550c2acedd6f512ca6b29b9d50546fed6c63421eb8651a5b19ca778  .github/popcan-integration.patch' | sha256sum --check
          git apply --check .github/popcan-integration.patch
          git apply .github/popcan-integration.patch
          git rm .github/popcan-integration.patch
          git add src scripts docs vercel.json
          git config user.name 'mstrbstrd'
          git config user.email '104603175+mstrbstrd@users.noreply.github.com'
          git commit -m 'feat: integrate validated Popular Canvas studio routes and navigation'
          git push origin HEAD:feat/popcan-studio
      - name: Inspect installed browser startup
        run: |
          command -v google-chrome || true
          command -v microsoft-edge || true
          google-chrome --version || true
          microsoft-edge --version || true
          mkdir -p "$RUNNER_TEMP/popcan-diagnostic"
          BROWSER=$(command -v google-chrome || command -v microsoft-edge || true)
          if [ -n "$BROWSER" ]; then
            PROFILE=$(mktemp -d)
            timeout 12 "$BROWSER" --headless=new --no-sandbox --no-first-run --remote-debugging-port=0 --user-data-dir="$PROFILE" about:blank > "$RUNNER_TEMP/popcan-diagnostic/stdout.log" 2> "$RUNNER_TEMP/popcan-diagnostic/stderr.log" || true
            find "$PROFILE" -maxdepth 2 -name '*DevTools*' -print
            cat "$RUNNER_TEMP/popcan-diagnostic/stdout.log" "$RUNNER_TEMP/popcan-diagnostic/stderr.log"
            rm -rf "$PROFILE"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: popcan-diagnostic
          path: ${{ runner.temp }}/popcan-diagnostic
          retention-days: 1
