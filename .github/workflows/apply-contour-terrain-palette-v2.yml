name: Apply Contour Drift terrain palette v2

on:
  push:
    branches:
      - agent/contour-drift-terrain-palette
    paths:
      - .github/workflows/apply-contour-terrain-palette-v2.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/contour-drift-terrain-palette
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply palette patches
        run: |
          python scripts/patch_contour_page.py
          python scripts/patch_contour_canvas.py
          python scripts/patch_contour_shader.py
          python scripts/patch_contour_page_style_aliases.py
          python scripts/patch_contour_page_style_active.py
          python scripts/patch_contour_field_surface.py
          python scripts/patch_contour_field_fallback.py
          python scripts/patch_contour_page_tests.py
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test -- --watchAll=false --runInBand
        env:
          CI: true
      - run: npm run build
        env:
          CI: true
      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components
          git commit -m "Add Contour Drift terrain palette"
          git push origin HEAD:agent/contour-drift-terrain-palette
