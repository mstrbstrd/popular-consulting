name: Verify Metabloom avatar Orb redesign

on:
  push:
    branches:
      - feature/metabloom-avatar-orb-20260902

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/metabloom-avatar-orb-20260902
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply guarded integration patch
        run: python scripts/apply_metabloom_avatar_orb.py
      - name: Check whitespace
        run: git diff --check
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test -- --watchAll=false --runInBand
        env:
          CI: true
      - name: Build
        run: npm run build
        env:
          CI: true
      - name: Commit verified integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/apply_metabloom_avatar_orb.py
          git rm .github/workflows/apply-metabloom-avatar-orb.yml
          git add \
            CLAUDE.md \
            src/NavigationCohesionStyle.test.js \
            src/navigation-cohesion.css \
            src/components/MetabloomAvatar.js \
            src/components/MetabloomAvatar.css \
            src/components/MetabloomAvatar.test.js \
            src/components/OrbSection.js \
            src/components/StandaloneExperiencePage.js \
            src/components/StandaloneExperiencePage.test.js \
            src/content/routeMetadata.json \
            src/testHelpers/a11ySetup.js
          git diff --cached --check
          git commit -m "Integrate lightweight Metabloom avatar Orb"
          git push origin "HEAD:${GITHUB_REF_NAME}"
