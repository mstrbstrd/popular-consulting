name: Integrate reviewed Navier advection
on:
  push:
    branches: [feat/navier-advection]
permissions:
  contents: read
jobs:
  integrate:
    if: github.repository == 'mstrbstrd/popular-consulting'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Apply bounded integration and remove this workbench
        run: |
          node scripts/apply-navier-advection.cjs
          git add src/components/CreatorOSFieldCanvas.js src/components/DitherCanvasPage.js src/components/NavierStokes.test.js CLAUDE.md
          git rm scripts/apply-navier-advection.cjs .github/workflows/navier-advection-workbench.yml
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat: wire retained dye into the existing field renderer'
          git push origin HEAD:feat/navier-advection
      - name: Export exact integrated source for review
        run: |
          git ls-files -z src public scripts docs package.json package-lock.json CLAUDE.md CONTRIBUTING.md .github/workflows | tar --null -T - -czf /tmp/navier-advection-source.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: navier-advection-source
          path: /tmp/navier-advection-source.tar.gz
          retention-days: 2
