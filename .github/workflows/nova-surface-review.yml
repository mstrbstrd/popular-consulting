name: Nova flame surface review
on:
  push:
    branches: [work/nova-flame-correction]
permissions:
  contents: write
concurrency:
  group: nova-flame-correction-review
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 8
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply the checked surface correction
        run: python scripts/apply-nova-surface.py
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Full regression suite and unchanged-base comparison
        env:
          CI: true
        run: |
          npm test -- --watchAll=false --runInBand --json --outputFile=/tmp/nova-tests.json || test -s /tmp/nova-tests.json
          git worktree add --detach /tmp/nova-baseline a4db1f2b79c075ae97819bdb6adef84733022964
          ln -s "$PWD/node_modules" /tmp/nova-baseline/node_modules
          (cd /tmp/nova-baseline && npm test -- --watchAll=false --runInBand --runTestsByPath src/components/InvoiceGeneratorNavigation.test.js --json --outputFile=/tmp/nova-baseline-tests.json) || test -s /tmp/nova-baseline-tests.json
          node - <<'NODE'
          const fs=require('fs'),assert=require('node:assert/strict');
          const current=JSON.parse(fs.readFileSync('/tmp/nova-tests.json')),base=JSON.parse(fs.readFileSync('/tmp/nova-baseline-tests.json'));
          const failures=r=>r.testResults.flatMap(s=>s.assertionResults.filter(t=>t.status==='failed').map(t=>t.fullName)).sort();
          assert.equal(current.numRuntimeErrorTestSuites,0);assert.equal(current.numPendingTests,0);
          assert(current.numPassedTests>=1021);assert(current.numFailedTests<=1);
          if(current.numFailedTests){assert.deepEqual(failures(current),failures(base));assert(failures(current)[0].includes('mobile menu isolates the invoice'));}
          const result={passed:current.numPassedTests,failed:current.numFailedTests,newFailures:0,baselineFailures:failures(base)};
          fs.mkdirSync('nova-review',{recursive:true});fs.writeFileSync('nova-review/test-summary.json',JSON.stringify(result,null,2));console.log(result);
          NODE
      - name: Production build
        run: npm run build
        env:
          CI: true
      - name: Browser prerequisites
        run: |
          npm install --prefix /tmp/nova-browser --no-audit --no-fund --ignore-scripts playwright@1.56.1
          /tmp/nova-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Native fire lifecycle, topology, surface and selector checks
        env:
          NODE_PATH: /tmp/nova-browser/node_modules
        run: |
          node scripts/verify-nova-fire.mjs > /tmp/nova-lifecycle.log 2>&1 || { tail -c 6000 /tmp/nova-lifecycle.log; exit 1; }
          grep '^{' /tmp/nova-lifecycle.log
          node scripts/verify-nova-floating.mjs
          node scripts/verify-nova-balance.mjs
          node scripts/verify-metalnova.mjs
      - name: Commit tested source to work branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/MetabloomNovaShader.js src/components/CreatorOSFieldShader.js src/components/MetabloomAvatar.css src/components/MetalNovaFinish.test.js src/components/NovaFlameSurface.test.js scripts/verify-nova-floating.mjs scripts/verify-nova-balance.mjs scripts/verify-metalnova.mjs scripts/verify-nova-surface.mjs
          git commit -m 'Lower Nova finishes and correct flame gradients and prismatic wisps'
          git push origin HEAD:work/nova-flame-correction
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nova-surface-review
          path: nova-review
          if-no-files-found: ignore
