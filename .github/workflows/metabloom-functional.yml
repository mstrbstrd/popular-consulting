name: Metabloom functional verification
on:
  pull_request:
  push:
    branches: [main, feat/orb-visual-responses, feat/orb-visual-harness, feat/orb-tool-aware-runtime, fix/orb-visual-routing-fallback, test/orb-auth-browser-verification]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: metabloom-functional-${{ github.ref }}
  cancel-in-progress: true
jobs:
  redis-quota-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify visual quotas, artifacts, and research retention against real Redis
        run: node --test scripts/metabloom-visual-quota-redis.test.cjs scripts/metabloom-research-store-redis.test.cjs
        env:
          METABLOOM_QUOTA_TEST_REDIS_PORT: 6379
  emote-contract-and-browser:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Verify Metabloom API, research, and provider contracts
        run: >-
          node --test scripts/metabloom-api.test.cjs scripts/metabloom-research.test.cjs
          scripts/metabloom-research-brief.test.cjs scripts/metabloom-research-brief-api.test.cjs
          scripts/metabloom-research-output.test.cjs scripts/metabloom-stream.test.cjs
          scripts/jev-reaction.test.cjs scripts/metabloom-visual.test.cjs scripts/metabloom-ui-tools.test.cjs
          scripts/metabloom-source-media.test.cjs scripts/metabloom-visual-quota.test.cjs
          scripts/metabloom-visual-store-diagnostics.test.cjs scripts/metabloom-artifact-reference.test.cjs
          scripts/metabloom-research-reuse.test.cjs scripts/metabloom-research-reuse-api.test.cjs
      - run: npm ci --no-audit --no-fund
      - name: Verify the visual improvement loop without model calls
        run: |
          npm run metabloom:improve -- check
          npm run test:metabloom-improvement
      - run: npm test -- --watch=false --runInBand --runTestsByPath src/components/MetabloomVisuals.test.js
        env:
          CI: true
      - run: npm run lint
      - run: npm test -- --watchAll=false --runInBand
        env:
          CI: true
      - run: npm run build
        id: build
        env:
          CI: true
      - name: Verify authenticated local demos in a real browser
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node scripts/verify-metabloom-browser.mjs
      - name: Verify native UI interactions with local HTTP fixtures
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node scripts/verify-metabloom-ui-browser.mjs
      - name: Verify the mobile current component through the built Orb
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.51.1
          node scripts/verify-metabloom-mobile-workspace.mjs
      - name: Verify research reuse through the built Orb and local API
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node scripts/verify-metabloom-research-reuse.mjs
      - name: Verify saved chat threads and responsive history through the built Orb
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node scripts/verify-metabloom-threads.mjs
      - name: Preserve functional evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metabloom-functional-${{ github.sha }}
          path: |
            metabloom-functional/*
            metabloom-ui-functional/*
            metabloom-mobile-workspace/*
            metabloom-research-reuse/*
            metabloom-threads/*
          retention-days: 7
      - name: Verify production denies anonymous Orb and paid API access
        if: ${{ !cancelled() && steps.build.outcome == 'success' && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/test/orb-auth-browser-verification') }}
        run: node scripts/verify-metabloom-browser.mjs
        env:
          METABLOOM_VERIFY_ORIGIN: https://popular-consulting.com
      - name: Preserve production guest-access evidence
        if: ${{ always() && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/test/orb-auth-browser-verification') }}
        uses: actions/upload-artifact@v4
        with:
          name: metabloom-production-${{ github.sha }}
          path: metabloom-production/*
          retention-days: 7
