name: Metabloom functional verification
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: metabloom-functional-${{ github.ref }}
  cancel-in-progress: true
jobs:
  emote-contract-and-browser:
    # Use the same sandboxed Edge runtime as the existing route smoke suite.
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: node --test scripts/metabloom-api.test.cjs
      - run: npm ci --no-audit --no-fund
      - run: npm run build
        env:
          CI: true
      - name: Verify built demos in a real browser
        run: node --experimental-websocket scripts/verify-metabloom-browser.mjs
      - name: Preserve functional evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metabloom-functional-${{ github.sha }}
          path: metabloom-functional/*
          retention-days: 7
      - name: Verify deployed demos on the production domain
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: node --experimental-websocket scripts/verify-metabloom-browser.mjs
        env:
          METABLOOM_VERIFY_ORIGIN: https://popular-consulting.com
      - name: Preserve production evidence
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: metabloom-production-${{ github.sha }}
          path: metabloom-functional/*
          retention-days: 7
