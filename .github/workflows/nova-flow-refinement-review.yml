name: Nova flame flow refinement review
on:
  push:
    branches: [work/nova-flow-refinement]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply flame-only refinement
        run: |
          python scripts/apply-nova-flow-refinement.py
          python scripts/validate-nova-flow-probe.py
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - name: Unit regressions and baseline
        env:
          CI: true
        run: |
          mkdir -p nova-flow-review
          npm test -- --watchAll=false --runInBand --json --outputFile=/tmp/current.json > nova-flow-review/unit.log 2>&1 || test -s /tmp/current.json
          git worktree add --detach /tmp/baseline 6cc4aad09c06450b15c43a042b24274cc203edfb
          ln -s "$PWD/node_modules" /tmp/baseline/node_modules
          (cd /tmp/baseline && npm test -- --watchAll=false --runInBand --runTestsByPath src/components/InvoiceGeneratorNavigation.test.js --json --outputFile=/tmp/base.json > /tmp/base.log 2>&1) || test -s /tmp/base.json
          node - <<'NODE'
          const fs=require('fs'),assert=require('node:assert/strict');
          const now=JSON.parse(fs.readFileSync('/tmp/current.json')),base=JSON.parse(fs.readFileSync('/tmp/base.json'));
          const failures=r=>r.testResults.flatMap(s=>s.assertionResults.filter(t=>t.status==='failed').map(t=>t.fullName)).sort();
          const report={passed:now.numPassedTests,failed:now.numFailedTests,failures:failures(now),baselineFailures:failures(base)};
          fs.writeFileSync('nova-flow-review/unit-report.json',JSON.stringify(report,null,2));console.log(report);
          assert.equal(now.numRuntimeErrorTestSuites,0);assert.equal(now.numPendingTests,0);
          assert(now.numPassedTests>=1041);assert(now.numFailedTests<=1);
          if(now.numFailedTests)assert.deepEqual(failures(now),failures(base));
          NODE
      - name: Production build
        env:
          CI: true
        run: npm run build > nova-flow-review/build.log 2>&1
      - name: Browser prerequisites
        run: |
          npm install --prefix /tmp/browser --no-audit --no-fund --ignore-scripts playwright@1.56.1
          /tmp/browser/node_modules/.bin/playwright install chromium
      - name: Native renderer and lifecycle
        env:
          NODE_PATH: /tmp/browser/node_modules
        run: node scripts/verify-nova-fire.mjs > nova-flow-review/lifecycle.log 2>&1
      - name: Compare flame flow and retained artwork
        env:
          NODE_PATH: /tmp/browser/node_modules
        run: node scripts/verify-nova-flow.mjs
      - name: Commit reviewed source on work branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/MetabloomNovaShader.js scripts/verify-nova-flow.mjs
          git commit -m 'Refine shared Nova flame flow with gentler turbulence and broader flares'
          git push origin HEAD:work/nova-flow-refinement
      - name: Collect evidence
        if: always()
        run: |
          mkdir -p nova-flow-review
          git diff -- src/components/MetabloomNovaShader.js > nova-flow-review/source.diff
          cp src/components/MetabloomNovaShader.js nova-flow-review/
          cp scripts/verify-nova-flow.mjs nova-flow-review/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nova-flow-refinement-review
          path: nova-flow-review
          retention-days: 7
