name: Address work page review

on:
  push:
    branches:
      - agent/work-page-visual-refresh
    paths:
      - ".github/workflows/address-work-page-review.yml"

permissions:
  contents: write

jobs:
  apply:
    name: Apply accessibility and print fixes
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/work-page-visual-refresh
          fetch-depth: 0

      - name: Patch reviewed stylesheet concerns
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/components/WorkPage.css")
          source = path.read_text(encoding="utf-8")

          light_mode_accents = """
          html[data-theme="light"] .work-project:nth-child(1) {
            --project-accent: #7a4d00 !important;
            --project-rgb: 122, 77, 0 !important;
            --project-secondary: #8a3f00 !important;
          }

          html[data-theme="light"] .work-project:nth-child(2) {
            --project-accent: #076547 !important;
            --project-rgb: 7, 101, 71 !important;
            --project-secondary: #00617d !important;
          }

          html[data-theme="light"] .work-project:nth-child(3) {
            --project-accent: #005f80 !important;
            --project-rgb: 0, 95, 128 !important;
            --project-secondary: #5b2aa5 !important;
          }

          html[data-theme="light"] .work-project:nth-child(4) {
            --project-accent: #6524ad !important;
            --project-rgb: 101, 36, 173 !important;
            --project-secondary: #4f2aa5 !important;
          }

          """

          marker = "@media print {\n"
          if source.count(marker) != 1:
              raise SystemExit("Expected exactly one print-media marker")
          source = source.replace(marker, light_mode_accents + marker, 1)

          old_print = """  .work-page__system-card {
            margin-top: 2rem;
          }
          """
          new_print = """  .work-page__system-card {
            min-height: 0;
            grid-template-rows: auto;
            margin-top: 2rem;
          }
          """
          if source.count(old_print) != 1:
              raise SystemExit("Expected exactly one system-card print rule")
          source = source.replace(old_print, new_print, 1)

          path.write_text(source, encoding="utf-8")

      - name: Commit reviewed fixes
        run: |
          git config user.name "openai-agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/WorkPage.css
          git commit -m "Improve light-theme contrast and print layout"
          git push origin HEAD:agent/work-page-visual-refresh
