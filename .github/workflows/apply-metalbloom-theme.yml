name: Apply Metalbloom theme

on:
  push:
    branches:
      - agent/metalbloom-theme
    paths:
      - .github/workflows/apply-metalbloom-theme.yml

permissions:
  contents: write

jobs:
  implement-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/metalbloom-theme
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Make insertion anchors duplicate-safe
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/apply_metalbloom_theme.py")
          source = path.read_text(encoding="utf-8")
          old = '''    count = source.count(old)
              if count != 1:
                  raise SystemExit(
                      f"{label}: expected exactly one source block, found {count}."
                  )
              return source.replace(old, new)'''
          new = '''    count = source.count(old)
              if count < 1:
                  raise SystemExit(
                      f"{label}: source block was not found."
                  )
              return source.replace(old, new, 1)'''
          if old not in source:
              raise SystemExit("Patch helper source was not found.")
          path.write_text(source.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Apply the Metalbloom material theme
        run: python scripts/apply_metalbloom_theme.py

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test -- --watchAll=false --runInBand
        env:
          CI: true

      - name: Build production bundle
        run: npm run build
        env:
          CI: true

      - name: Commit and push the implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/components/CreatorOSFieldCanvas.js \
            src/components/CreatorOSFieldCanvas.css \
            src/components/CreatorOSFieldShader.js \
            src/components/DitherCanvasPage.js \
            src/components/DitherCanvasPage.css \
            src/components/DitherCanvasPage.test.js \
            src/components/MetalbloomTheme.test.js
          git rm \
            .github/workflows/apply-metalbloom-theme.yml \
            scripts/apply_metalbloom_theme.py
          git commit -m "Add the Metalbloom liquid-metal theme"
          git push origin HEAD:agent/metalbloom-theme
