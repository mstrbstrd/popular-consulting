name: Apply dither hover-through-copy refinement

# Retry after aligning the existing Second Surface input contract with page-level hover.
on:
  push:
    branches:
      - agent/dither-hover-through-copy
    paths:
      - .github/workflows/apply-dither-hover-through-copy.yml

permissions:
  contents: write

jobs:
  refine-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/dither-hover-through-copy
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply pointer coverage refinement
        run: python scripts/apply_dither_hover_through_copy.py

      - name: Verify patch whitespace
        run: git diff --check

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test -- --watchAll=false --runInBand
        env:
          CI: true

      - name: Build production bundle
        run: npm run build
        env:
          CI: true

      - name: Commit and push the refinement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/components/CreatorOSFieldCanvas.js \
            src/components/RuptureCanvas.js \
            src/components/DitherCanvasPointerCoverage.test.js
          git rm -f \
            .github/workflows/apply-dither-hover-through-copy.yml \
            scripts/apply_dither_hover_through_copy.py
          git commit -m "Keep dither hover active beneath page copy"
          git push origin HEAD:agent/dither-hover-through-copy
