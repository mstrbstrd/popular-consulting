name: Validate and publish Orb relay
on:
  push:
    branches: [feat/orb-sms-relay]
    paths: [.github/workflows/orb-sms-apply.yml, .orb-sms-patch/**]
permissions:
  contents: read
concurrency:
  group: orb-relay-bootstrap
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      redis:
        image: redis:7.2-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Restore exact implementation patch
        run: |
          cat .orb-sms-patch/part-*.b64 | base64 --decode | xz --decompress > "$RUNNER_TEMP/implementation.patch"
          echo '676d77cb5b24e642efc80723caf39c83d76f7217ed4d3d51f30213a3e68acb43  '"$RUNNER_TEMP/implementation.patch" | sha256sum --check
          git apply --check "$RUNNER_TEMP/implementation.patch"
          git apply "$RUNNER_TEMP/implementation.patch"
          if [ -f .orb-sms-patch/fixes.patch ]; then git apply .orb-sms-patch/fixes.patch; fi
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Resolve and install pinned dependency
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --no-audit --no-fund
      - name: Redis concurrency and relay security tests
        run: npm run test:orb-sms
        env:
          ORB_TEST_REDIS_PORT: '6379'
      - name: Authentication regression tests
        run: npm run test:auth
      - name: Lint
        run: npm run lint
      - name: Full component regression suite
        run: npm test -- --watchAll=false --runInBand
        env:
          CI: true
      - name: Production build
        run: npm run build
        env:
          CI: true
      - name: Install isolated browser verifier
        run: |
          npm install --prefix "$RUNNER_TEMP/orb-browser" agent-browser@0.38.1 --no-audit --no-fund
          "$RUNNER_TEMP/orb-browser/node_modules/.bin/agent-browser" install
      - name: Browser verification
        run: ORB_AGENT_BROWSER_BIN="$RUNNER_TEMP/orb-browser/node_modules/.bin/agent-browser" node scripts/verify-orb-sms-ui.mjs
      - name: Package validated changes
        run: |
          rm -rf .orb-sms-patch
          rm .github/workflows/orb-sms-apply.yml
          git add .github api docs package.json package-lock.json scripts server src vercel.json
          git add -u
          git diff --cached --check
          git diff --cached --binary > "$RUNNER_TEMP/tested.patch"
      - uses: actions/upload-artifact@v4
        with:
          name: tested-orb-relay-patch
          path: ${{ runner.temp }}/tested.patch
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orb-sms-ui-bootstrap
          path: orb-sms-ui
          retention-days: 7
  publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: tested-orb-relay-patch
          path: ${{ runner.temp }}/validated
      - name: Commit only validated source to feature branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git apply --index "$RUNNER_TEMP/validated/tested.patch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: add private Orb guest SMS relay with explicit reply routing'
          header=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $header" push origin HEAD:refs/heads/feat/orb-sms-relay
