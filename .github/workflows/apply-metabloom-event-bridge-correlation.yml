name: Apply Metabloom event bridge correlation

on:
  push:
    branches:
      - fix/metabloom-event-bridge-correlation-20260903

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out main-based fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/metabloom-event-bridge-correlation-20260903
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Copy the verified correlation fix
        shell: bash
        run: |
          git fetch origin feature/fullscreen-metabloom-chat-20260903 --depth=1
          git checkout FETCH_HEAD -- \
            docs/architecture/metabloom-chat-interface.md \
            src/components/OrbSection.js \
            src/components/OrbSection.test.js
          python - <<'PY'
          import subprocess

          expected = {
              "docs/architecture/metabloom-chat-interface.md",
              "src/components/OrbSection.js",
              "src/components/OrbSection.test.js",
          }
          changed = set(
              subprocess.check_output(
                  ["git", "diff", "--name-only"],
                  text=True,
              ).splitlines()
          )
          if changed != expected:
              raise SystemExit(
                  f"Unexpected copied files: {sorted(changed ^ expected)}"
              )
          PY

      - name: Check whitespace
        run: git diff --check

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --watchAll=false --runInBand
        env:
          CI: true

      - name: Build production bundle
        run: npm run build
        env:
          CI: true

      - name: Commit verified source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-metabloom-event-bridge-correlation.yml
          git add \
            docs/architecture/metabloom-chat-interface.md \
            src/components/OrbSection.js \
            src/components/OrbSection.test.js
          git diff --cached --check
          git commit -m "Correlate Metabloom event responses"
          git push origin "HEAD:${GITHUB_REF_NAME}"
