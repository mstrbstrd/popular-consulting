name: Orb interface visual review

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/orb-review-capture.yml
      - scripts/capture-orb-review.mjs
      - src/SiteRouter.js
      - src/components/ImmersiveRouteNavigationBridge.js
      - src/components/NavMenu.js
      - src/components/OrbPage.js
      - src/components/OrbPage.css
      - src/components/OrbPageExperience.css
      - src/components/OrbSection.js
      - src/components/OrbSection.css
      - src/components/SectionDeepLinkBridge.js
      - src/components/MetabloomAvatar.js
      - src/components/MetabloomAvatar.css
      - src/components/CreatorOSFieldCanvas.js
      - src/components/CreatorOSFieldShader.js
      - src/components/metabloomActions.js
      - src/components/metabloomResponseContract.js
  pull_request:
    paths:
      - .github/workflows/orb-review-capture.yml
      - scripts/capture-orb-review.mjs
      - src/SiteRouter.js
      - src/components/ImmersiveRouteNavigationBridge.js
      - src/components/NavMenu.js
      - src/components/OrbPage.js
      - src/components/OrbPage.css
      - src/components/OrbPageExperience.css
      - src/components/OrbSection.js
      - src/components/OrbSection.css
      - src/components/SectionDeepLinkBridge.js
      - src/components/MetabloomAvatar.js
      - src/components/MetabloomAvatar.css
      - src/components/CreatorOSFieldCanvas.js
      - src/components/CreatorOSFieldShader.js
      - src/components/metabloomActions.js
      - src/components/metabloomResponseContract.js
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build production bundle
        run: npm run build
        env:
          CI: true

      - name: Capture full-screen Metabloom chat
        run: node scripts/capture-orb-review.mjs

      - name: Upload Orb interface review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orb-interface-review-${{ github.sha }}
          path: orb-review/*
          if-no-files-found: warn
          retention-days: 7
