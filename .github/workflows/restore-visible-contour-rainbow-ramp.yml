name: Restore visible Contour Drift rainbow ramp

on:
  push:
    branches:
      - agent/contour-rainbow-visible-ramp
    paths:
      - .github/workflows/restore-visible-contour-rainbow-ramp.yml

permissions:
  contents: write

jobs:
  correct-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/contour-rainbow-visible-ramp
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply rainbow ramp correction
        env:
          PATCH_SCRIPT: 
        run: echo "$PATCH_SCRIPT" | base64 --decode | python
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Run tests
        run: npm test -- --watchAll=false --runInBand
        env:
          CI: true
      - name: Build production bundle
        run: npm run build
        env:
          CI: true
      - name: Commit and push correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/CreatorOSFieldShader.js src/components/ContourDriftFunctionalTopography.test.js
          git rm .github/workflows/restore-visible-contour-rainbow-ramp.yml
          git commit -m "Make Contour Drift rainbow edges visibly spectral"
          git push origin HEAD:agent/contour-rainbow-visible-ramp
