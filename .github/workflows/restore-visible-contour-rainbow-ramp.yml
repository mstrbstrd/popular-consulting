name: Restore visible Contour Drift rainbow ramp

on:
  push:
    branches:
      - agent/contour-rainbow-visible-ramp
    paths:
      - .github/workflows/restore-visible-contour-rainbow-ramp.yml

permissions:
  contents: write

jobs:
  correct-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/contour-rainbow-visible-ramp
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Give the contour edges a visible travelling spectral ramp
        shell: python
        run: |
          from pathlib import Path

          shader_path = Path("src/components/CreatorOSFieldShader.js")
          shader = shader_path.read_text(encoding="utf-8")

          scene_start = shader.index("vec4 sceneContourDrift")
          scene_end = shader.index("vec4 sceneMorphogen", scene_start)

          color_start = shader.index(
              "  vec3 contourSpectrum = spectral(",
              scene_start,
              scene_end,
          )
          color_end = shader.index(
              "\n\n  float terrainPaletteWeight",
              color_start,
              scene_end,
          )

          color_block = '''  // Elevation is constant along a contour, so using terrain as the main
            // hue coordinate made each line read as one nearly neutral pastel. Drive
            // the spectrum across map space and a slow flow field instead, giving the
            // complete contour network a visible travelling rainbow ramp.
            float contourHueFlow = p.x * 0.34
              - p.y * 0.24
              + (
                fbm(
                  rotate2(-0.42) * p * 0.72
                    + drift * 0.48
                    + vec2(7.2, 13.1)
                ) - 0.5
              ) * 0.34
              + terrain * 0.10
              + time * 0.008
              + u_seed * 0.10;
            vec3 contourSpectrum = spectral(contourHueFlow);

            // Keep the edge pale enough to belong to the map while retaining channel
            // separation large enough to survive the Bayer-8 quantization in both
            // themes. This remains confined to the outer rim, not the white core.
            float contourChroma = mix(0.66, 0.58, u_light);
            float contourSpectralFloor = mix(0.56, 0.64, u_light);
            vec3 spectralContourEdge = max(
              mix(vec3(0.95), contourSpectrum, contourChroma),
              vec3(contourSpectralFloor)
            );
            float spectralContourMask = sat(
              max(minorEdge, indexEdge) * 1.22
            );

            terrainTint = mix(
              terrainTint,
              lineCoreTint,
              contourCore
            );
            terrainTint = mix(
              terrainTint,
              spectralContourEdge,
              spectralContourMask * 0.98
            );'''

          shader = shader[:color_start] + color_block + shader[color_end:]

          material_start = shader.index(
              "  // Compose the white center first",
              scene_start,
              scene_end,
          )
          material_end = shader.index(
              "  material.a = max(",
              material_start,
              scene_end,
          )

          material_block = '''  // Compose the white centre first, then directly replace the thin rim
            // with the spectral colour. Using max() here could only raise channels, so
            // the already-bright white line won and collapsed the rim back to grey.
            material.rgb = mix(
              material.rgb,
              max(material.rgb, lineCoreTint * 0.96),
              terrainPaletteWeight * contourCore * 0.88
            );
            vec3 postMaterialSpectralEdge = spectralContourEdge
              * mix(1.04, 1.00, u_light);
            material.rgb = mix(
              material.rgb,
              postMaterialSpectralEdge,
              terrainPaletteWeight * spectralContourMask * 0.96
            );
'''

          shader = (
              shader[:material_start]
              + material_block
              + shader[material_end:]
          )
          shader_path.write_text(shader, encoding="utf-8")

          test_path = Path(
              "src/components/ContourDriftFunctionalTopography.test.js"
          )
          test_source = test_path.read_text(encoding="utf-8")
          test_start = test_source.index(
              '  test("keeps a pale core and persistent spectral edges on every contour", () => {'
          )
          test_end = test_source.index(
              '\n\n  test("preserves motion, interaction, and the original spectral alternate"',
              test_start,
          )

          replacement_test = '''  test("keeps a pale core and a visible travelling spectral rim", () => {
            expect(scene).toContain("float minorEdge");
            expect(scene).toContain("float indexEdge");
            expect(scene).toContain("vec3 contourCoreTint");
            expect(scene).toContain("vec3 lineCoreTint");
            expect(scene).toContain("float contourHueFlow");
            expect(scene).toContain("p.x * 0.34");
            expect(scene).toContain("p.y * 0.24");
            expect(scene).toContain("rotate2(-0.42) * p * 0.72");
            expect(scene).toContain("mix(0.66, 0.58, u_light)");
            expect(scene).toContain("mix(0.56, 0.64, u_light)");
            expect(scene).toContain("float spectralContourMask");
            expect(scene).toContain("max(minorEdge, indexEdge) * 1.22");
            expect(scene).toContain("spectralContourMask * 0.98");
            expect(scene).toContain("vec3 postMaterialSpectralEdge");
            expect(scene).toContain(
              "terrainPaletteWeight * spectralContourMask * 0.96",
            );
            expect(scene).toContain("terrainPaletteWeight * contourCore * 0.88");
            expect(scene).not.toContain(
              "max(material.rgb, spectralContourEdge",
            );

            const preCore = scene.indexOf(
              "terrainTint = mix(\\n    terrainTint,\\n    lineCoreTint",
            );
            const preSpectrum = scene.indexOf(
              "terrainTint = mix(\\n    terrainTint,\\n    spectralContourEdge",
            );
            const postCore = scene.indexOf(
              "max(material.rgb, lineCoreTint * 0.96)",
            );
            const postSpectrum = scene.indexOf(
              "vec3 postMaterialSpectralEdge",
            );
            expect(preCore).toBeGreaterThanOrEqual(0);
            expect(preSpectrum).toBeGreaterThan(preCore);
            expect(postCore).toBeGreaterThanOrEqual(0);
            expect(postSpectrum).toBeGreaterThan(postCore);
          });'''

          test_source = (
              test_source[:test_start]
              + replacement_test
              + test_source[test_end:]
          )
          test_path.write_text(test_source, encoding="utf-8")

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test -- --watchAll=false --runInBand
        env:
          CI: true

      - name: Build production bundle
        run: npm run build
        env:
          CI: true

      - name: Commit and push the correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/components/CreatorOSFieldShader.js \
            src/components/ContourDriftFunctionalTopography.test.js
          git rm .github/workflows/restore-visible-contour-rainbow-ramp.yml
          git commit -m "Make Contour Drift rainbow edges visibly spectral"
          git push origin HEAD:agent/contour-rainbow-visible-ramp
