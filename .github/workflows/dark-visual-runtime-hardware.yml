name: Dark visual runtime hosted diagnostic

on:
  workflow_dispatch:
    inputs:
      viewport:
        description: Hosted diagnostic viewport in WIDTHxHEIGHT form
        required: true
        default: 480x300
        type: string
  pull_request:
    paths:
      - .github/workflows/dark-visual-runtime-hardware.yml
      - .github/workflows/quality.yml
      - package.json
      - scripts/capture-visual-dark-evidence.mjs
      - scripts/dark-evidence-*.mjs
      - scripts/physical-dark-qualification-lib.mjs
      - scripts/run-physical-dark-qualification.mjs
      - scripts/verify-physical-dark-qualification.mjs
      - src/components/BlackHole*.js
      - src/components/blackHole*.js
      - src/contexts/ThemeContext.js
      - src/utils/visualRuntimeDark*.js
      - src/utils/visualRuntimeGpuEvidence*.js
      - src/VisualRuntimeDark*.test.js
  push:
    branches:
      - main
    paths:
      - .github/workflows/dark-visual-runtime-hardware.yml
      - .github/workflows/quality.yml
      - package.json
      - scripts/capture-visual-dark-evidence.mjs
      - scripts/dark-evidence-*.mjs
      - scripts/physical-dark-qualification-lib.mjs
      - scripts/run-physical-dark-qualification.mjs
      - scripts/verify-physical-dark-qualification.mjs
      - src/components/BlackHole*.js
      - src/components/blackHole*.js
      - src/contexts/ThemeContext.js
      - src/utils/visualRuntimeDark*.js
      - src/utils/visualRuntimeGpuEvidence*.js
      - src/VisualRuntimeDark*.test.js

permissions:
  contents: read

concurrency:
  group: dark-hosted-diagnostic-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hosted-dark-diagnostic:
    name: Hosted dark diagnostic, non-qualifying
    runs-on: macos-15
    timeout-minutes: 35
    env:
      VISUAL_CAPTURE_BROWSER: /Applications/Microsoft Edge.app/Contents/MacOS/Microsoft Edge
      EVIDENCE_VIEWPORT: ${{ inputs.viewport || '480x300' }}
      EVIDENCE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      EVIDENCE_SOURCE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
      EVIDENCE_RUNNER_LABEL: macos-15-hosted

    steps:
      - name: Check out exact diagnostic source commit
        uses: actions/checkout@v4
        with:
          repository: ${{ env.EVIDENCE_SOURCE_REPOSITORY }}
          ref: ${{ env.EVIDENCE_SOURCE_SHA }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify evidence scripts
        run: |
          npm run visual:dark-evidence:self-test
          node scripts/dark-evidence-hosted-diagnostic.mjs --self-test
          node scripts/run-physical-dark-qualification.mjs --self-test
          node scripts/verify-physical-dark-qualification.mjs --self-test
          node scripts/aggregate-dark-evidence.mjs --self-test

      - name: Record hosted runner and graphics identity
        shell: bash
        run: |
          set -euo pipefail
          echo "Evidence source repository: ${EVIDENCE_SOURCE_REPOSITORY}"
          echo "Evidence source SHA: ${EVIDENCE_SOURCE_SHA}"
          echo "Hosted runner label: ${EVIDENCE_RUNNER_LABEL}"
          sw_vers
          uname -m
          system_profiler SPDisplaysDataType || true
          test -x "$VISUAL_CAPTURE_BROWSER"
          "$VISUAL_CAPTURE_BROWSER" --version

      - name: Build production bundle
        run: npm run build
        env:
          CI: true

      - name: Run timer-free hosted candidate diagnostic
        run: >-
          node scripts/dark-evidence-hosted-diagnostic.mjs
          --viewport="${EVIDENCE_VIEWPORT}"
          --output=visual-dark-evidence-hosted

      - name: Verify hosted evidence cannot qualify production
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from "fs";

          const summary = JSON.parse(
            fs.readFileSync(
              "visual-dark-evidence-hosted/summary.json",
              "utf8",
            ),
          );

          if (
            summary.diagnosticOnly !== true ||
            summary.qualificationEligible !== false ||
            summary.timerInstrumentation !== false ||
            summary.passed !== true
          ) {
            throw new Error(
              "Hosted evidence must pass only as a timer-free non-qualifying diagnostic.",
            );
          }
          NODE

      - name: Upload hosted diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dark-visual-runtime-hosted-diagnostic-${{ github.run_id }}
          path: visual-dark-evidence-hosted
          if-no-files-found: warn
          retention-days: 30
