name: Apply Dither Canvas Windows Hardening

on:
  push:
    branches:
      - fix/dither-canvas-windows-hardening
    paths:
      - scripts/apply_dither_canvas_windows_hardening.py

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/dither-canvas-windows-hardening

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply deterministic hardening patch
        run: python scripts/apply_dither_canvas_windows_hardening.py

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Run complete test suite
        run: npm test -- --watchAll=false --runInBand
        env:
          CI: true

      - name: Build production bundle
        run: npm run build
        env:
          CI: true

      - name: Commit validated hardening changes
        shell: bash
        run: |
          rm scripts/apply_dither_canvas_windows_hardening.py
          rm .github/workflows/apply-dither-canvas-windows-hardening.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden Dither Field Lab graphics on Windows"
          git push origin HEAD:fix/dither-canvas-windows-hardening
