name: Apply Dither Canvas Windows Hardening

on:
  push:
    branches:
      - fix/dither-canvas-windows-hardening
    paths:
      - scripts/apply_dither_canvas_windows_hardening.py
      - .github/workflows/apply-dither-canvas-windows-hardening.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/dither-canvas-windows-hardening

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply deterministic hardening patch
        run: python scripts/apply_dither_canvas_windows_hardening.py

      - name: Normalize generated contract test
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/components/DitherCanvasRuntimeContract.test.js")
          text = path.read_text(encoding="utf-8")
          invalid = '''    expect(narrative).toContain(
                ".dither-study-scene.is-exiting,
          .dither-study-scene.is-entering",
              );'''
          if invalid not in text:
              invalid = '''    expect(narrative).toContain(
                ".dither-study-scene.is-exiting,
          .dither-study-scene.is-entering",
              );'''.replace("                ", "      ").replace("          ", "")
          replacement = '''    expect(narrative).toContain(
                ".dither-study-scene.is-exiting,",
              );
              expect(narrative).toContain(
                ".dither-study-scene.is-entering",
              );'''
          if invalid not in text:
              raise SystemExit("Generated multiline contract assertion was not found")
          path.write_text(text.replace(invalid, replacement, 1), encoding="utf-8")
          PY

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Run complete test suite
        run: npm test -- --watchAll=false --runInBand
        env:
          CI: true

      - name: Build production bundle
        run: npm run build
        env:
          CI: true

      - name: Commit validated hardening changes
        shell: bash
        run: |
          rm scripts/apply_dither_canvas_windows_hardening.py
          rm .github/workflows/apply-dither-canvas-windows-hardening.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden Dither Field Lab graphics on Windows"
          git push origin HEAD:fix/dither-canvas-windows-hardening
