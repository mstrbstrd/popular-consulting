name: Apply functional Contour Drift topography

on:
  push:
    branches:
      - agent/functional-contour-topography
    paths:
      - .github/workflows/apply-functional-contour-topography.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/functional-contour-topography
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Build functional topographic relief and Tidal-style contour edges
        shell: python
        run: |
          from pathlib import Path

          shader_path = Path("src/components/CreatorOSFieldShader.js")
          shader = shader_path.read_text(encoding="utf-8")
          scene_start = shader.index("vec4 sceneContourDrift(vec2 uv, float time) {")
          scene_end = shader.index("\nvec4 sceneMorphogen(vec2 uv, float time) {", scene_start)

          scene = r'''vec4 sceneContourDrift(vec2 uv, float time) {
            uv = pointerFlow(uv, 0.032);
            vec2 p = viscousWarp(centeredUv(uv), time, 0.24);
            vec2 drift = vec2(time * 0.027, -time * 0.021);
            float terrain = fbm(p * 1.48 + drift + vec2(u_seed * 3.1));
            terrain += fbm(
              rotate2(0.72) * p * 3.25 - drift * 1.7 + vec2(11.0)
            ) * 0.31;
            terrain /= 1.31;

            vec2 pointerDelta = (uv - u_pointer) * aspectScale();
            float pointerLift = exp(-dot(pointerDelta, pointerDelta) * 7.0)
              * (0.12 + u_energy * 0.33);
            float pulse = pulseField(uv);
            terrain = sat(terrain + pointerLift - pulse * 0.14);

            // Preserve the original spectral field exactly for the alternate
            // palette while the default terrain map gains functional contour logic.
            float levels = terrain * 10.5;
            float contourDistance = abs(fract(levels) - 0.5);
            float contour = 1.0 - smoothstep(0.055, 0.19, contourDistance);
            float secondary = 1.0 - smoothstep(
              0.028,
              0.105,
              abs(fract(levels * 0.5 + 0.25) - 0.5)
            );
            float land = smoothstep(0.24, 0.78, terrain);
            float basin = 1.0 - smoothstep(0.34, 0.62, terrain);
            float spectralField = contour * 1.18
              + secondary * 0.34
              + land * 0.38
              + basin * 0.12
              + pulse * 0.58;

            // Eighteen minor intervals with every fifth interval indexed creates
            // the hierarchy expected from a functional elevation map.
            float contourCoordinate = terrain * 18.0;
            float minorDistance = abs(
              fract(contourCoordinate + 0.5) - 0.5
            );
            float indexDistance = abs(
              fract(contourCoordinate / 5.0 + 0.5) - 0.5
            );
            float minorAA = clamp(fwidth(contourCoordinate), 0.012, 0.070);
            float indexAA = clamp(
              fwidth(contourCoordinate / 5.0),
              0.003,
              0.020
            );
            float minorCore = 1.0 - smoothstep(
              minorAA * 0.35,
              minorAA * 0.92,
              minorDistance
            );
            float minorEnvelope = 1.0 - smoothstep(
              minorAA * 0.35,
              minorAA * 1.85,
              minorDistance
            );
            float indexCore = 1.0 - smoothstep(
              indexAA * 0.28,
              indexAA * 1.20,
              indexDistance
            );
            float indexEnvelope = 1.0 - smoothstep(
              indexAA * 0.28,
              indexAA * 2.35,
              indexDistance
            );
            float minorEdge = sat(minorEnvelope - minorCore);
            float indexEdge = sat(indexEnvelope - indexCore);
            float contourCore = max(minorCore * 0.76, indexCore);
            float contourEnvelope = max(minorEnvelope * 0.74, indexEnvelope);
            float contourEdge = max(minorEdge * 0.74, indexEdge);

            float terrainSurface = 0.68 + land * 0.18 + basin * 0.08;
            float terrainField = terrainSurface
              + contourEnvelope * 0.92
              + indexCore * 0.28
              + pulse * 0.58;
            float paletteMix = sat(u_contourPaletteMix);
            float bloom = smoothstep(0.02, 0.88, u_intro);
            float field = mix(terrainField, spectralField, paletteMix) * bloom;

            vec3 spectralTint = spectral(
              0.08
                + terrain * 0.88
                + p.x * 0.035
                + time * 0.010
                + u_seed * 0.14
            );

            // Discrete hypsometric elevation bands make the terrain readable as
            // a map rather than a continuous painterly color field.
            float elevationBand = floor(sat(terrain) * 8.999) / 8.0;
            float mappedElevation = mix(terrain, elevationBand, 0.78);
            vec3 basinTone = mix(
              vec3(0.028, 0.118, 0.145),
              vec3(0.620, 0.790, 0.810),
              u_light
            );
            vec3 lowlandTone = mix(
              vec3(0.105, 0.285, 0.190),
              vec3(0.520, 0.710, 0.480),
              u_light
            );
            vec3 uplandTone = mix(
              vec3(0.300, 0.370, 0.185),
              vec3(0.730, 0.720, 0.420),
              u_light
            );
            vec3 ridgeTone = mix(
              vec3(0.470, 0.350, 0.245),
              vec3(0.780, 0.610, 0.410),
              u_light
            );
            vec3 summitTone = mix(
              vec3(0.830, 0.830, 0.780),
              vec3(0.970, 0.955, 0.900),
              u_light
            );
            vec3 terrainTint = mix(
              basinTone,
              lowlandTone,
              smoothstep(0.16, 0.30, mappedElevation)
            );
            terrainTint = mix(
              terrainTint,
              uplandTone,
              smoothstep(0.34, 0.50, mappedElevation)
            );
            terrainTint = mix(
              terrainTint,
              ridgeTone,
              smoothstep(0.55, 0.72, mappedElevation)
            );
            terrainTint = mix(
              terrainTint,
              summitTone,
              smoothstep(0.76, 0.92, mappedElevation)
            );

            // Screen-space slope supplies a restrained hillshade. Quantizing part
            // of the light response gives the relief a cartographic 3D read.
            vec2 terrainSlope = vec2(dFdx(terrain), dFdy(terrain));
            vec3 terrainNormal = normalize(vec3(
              -terrainSlope.x * 24.0,
              -terrainSlope.y * 24.0,
              1.0
            ));
            vec3 reliefLight = normalize(vec3(-0.58, 0.48, 0.66));
            float hillshade = 0.5 + 0.5 * dot(terrainNormal, reliefLight);
            float reliefValue = smoothstep(0.05, 0.98, hillshade);
            float steppedRelief = floor(reliefValue * 5.999) / 5.0;
            reliefValue = mix(reliefValue, steppedRelief, 0.34);
            float slopeShade = smoothstep(
              0.012,
              0.070,
              length(terrainSlope)
            );
            terrainTint *= mix(0.70, 1.18, reliefValue);
            terrainTint *= mix(1.0, 0.90, slopeShade * 0.46);
            terrainTint += summitTone * pow(reliefValue, 5.0) * 0.045;

            // Match Tidal Weave's successful line language: a bright pale core
            // with a continuous, extremely thin spectral gradient on both edges.
            vec3 contourCoreTint = mix(
              vec3(1.160, 1.180, 1.140),
              vec3(1.240, 1.220, 1.160),
              u_light
            );
            vec3 lineCoreTint = mix(
              contourCoreTint,
              contourCoreTint * 1.06,
              indexCore
            );
            vec3 contourSpectrum = spectral(
              0.60
                + terrain * 0.34
                + p.x * 0.055
                - p.y * 0.035
                + time * 0.006
                + u_seed * 0.10
            );
            float contourChroma = mix(0.22, 0.16, u_light);
            vec3 spectralContourEdge = mix(
              contourCoreTint,
              contourSpectrum,
              contourChroma
            );
            spectralContourEdge = max(
              spectralContourEdge,
              contourCoreTint * 0.74
            );
            terrainTint = mix(
              terrainTint,
              spectralContourEdge,
              contourEdge * 0.92
            );
            terrainTint = mix(
              terrainTint,
              lineCoreTint,
              contourCore
            );

            float terrainPaletteWeight = 1.0 - paletteMix;
            vec3 tint = mix(terrainTint, spectralTint, paletteMix);
            vec4 material = fluidMaterial(field, tint, 0.24, 0.18, 0.84);
            material.rgb = mix(
              material.rgb,
              max(material.rgb, spectralContourEdge * 0.92),
              terrainPaletteWeight * contourEdge * 0.72
            );
            material.rgb = mix(
              material.rgb,
              max(material.rgb, lineCoreTint * 0.96),
              terrainPaletteWeight * contourCore * 0.88
            );
            material.a = max(
              material.a,
              terrainPaletteWeight
                * bloom
                * (0.34 + contourEnvelope * 0.38)
            );
            return material;
          }
          '''

          shader_path.write_text(
              shader[:scene_start] + scene.strip() + shader[scene_end:],
              encoding="utf-8",
          )

          page_path = Path("src/components/DitherCanvasPage.js")
          page = page_path.read_text(encoding="utf-8")
          old_description = (
              '      "A living relief map drifts beneath pale topographic lines: '
              'teal basins, green lowlands, stone ridges, and light summits gain '
              'depth through hillshade while spectral color clings subtly to each '
              'contour edge.",'
          )
          new_description = (
              '      "A functional relief map drifts beneath indexed white contour '
              'lines. Hypsometric elevation bands and hillshade reveal the terrain, '
              'while a hairline spectral gradient traces every contour edge.",'
          )
          if page.count(old_description) != 1:
              raise SystemExit("Contour Drift description anchor changed.")
          page_path.write_text(
              page.replace(old_description, new_description),
              encoding="utf-8",
          )

          test_path = Path(
              "src/components/ContourDriftFunctionalTopography.test.js"
          )
          test_path.write_text(
              '''import { CREATOROS_FIELD_FRAGMENT_SHADER } from "./CreatorOSFieldShader";

          describe("Contour Drift functional topography", () => {
            const start = CREATOROS_FIELD_FRAGMENT_SHADER.indexOf(
              "vec4 sceneContourDrift",
            );
            const end = CREATOROS_FIELD_FRAGMENT_SHADER.indexOf(
              "vec4 sceneMorphogen",
            );
            const scene = CREATOROS_FIELD_FRAGMENT_SHADER.slice(start, end);

            test("builds indexed elevation contours and map-like relief", () => {
              expect(start).toBeGreaterThanOrEqual(0);
              expect(end).toBeGreaterThan(start);
              expect(scene).toContain("float contourCoordinate = terrain * 18.0");
              expect(scene).toContain("float minorDistance");
              expect(scene).toContain("float indexDistance");
              expect(scene).toContain("float minorCore");
              expect(scene).toContain("float indexCore");
              expect(scene).toContain("float elevationBand = floor");
              expect(scene).toContain("float steppedRelief");
              expect(scene).toContain("float hillshade");
              expect(scene).toContain("vec3 terrainNormal");
            });

            test("keeps a pale core and persistent spectral edges on every contour", () => {
              expect(scene).toContain("float minorEdge");
              expect(scene).toContain("float indexEdge");
              expect(scene).toContain("float contourEdge");
              expect(scene).toContain("vec3 contourCoreTint");
              expect(scene).toContain("vec3 lineCoreTint");
              expect(scene).toContain("vec3 spectralContourEdge");
              expect(scene).toContain("contourEdge * 0.92");
              expect(scene).toContain("terrainPaletteWeight * contourCore * 0.88");
              expect(scene).not.toContain("crossing *");
            });

            test("preserves motion, interaction, and the original spectral alternate", () => {
              expect(scene).toContain("uv = pointerFlow(uv, 0.032)");
              expect(scene).toContain(
                "vec2 p = viscousWarp(centeredUv(uv), time, 0.24)",
              );
              expect(scene).toContain("vec2 drift = vec2(time * 0.027, -time * 0.021)");
              expect(scene).toContain("float pointerLift");
              expect(scene).toContain("float pulse = pulseField(uv)");
              expect(scene).toContain("float spectralField = contour * 1.18");
              expect(scene).toContain("float paletteMix = sat(u_contourPaletteMix)");
              expect(scene).toContain(
                "vec4 material = fluidMaterial(field, tint, 0.24, 0.18, 0.84)",
              );
            });
          });
          ''',
              encoding="utf-8",
          )

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test -- --watchAll=false --runInBand
        env:
          CI: true

      - name: Build production bundle
        run: npm run build
        env:
          CI: true

      - name: Commit and push the refinement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/components/CreatorOSFieldShader.js \
            src/components/DitherCanvasPage.js \
            src/components/ContourDriftFunctionalTopography.test.js
          git rm .github/workflows/apply-functional-contour-topography.yml
          git commit -m "Make Contour Drift a functional topographic map"
          git push origin HEAD:agent/functional-contour-topography
