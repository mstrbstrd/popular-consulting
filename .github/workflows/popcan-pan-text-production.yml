name: Popcan zoom and text production verification
on:
  push:
    branches: [feat/popcan-pan-zoom-text]
permissions:
  contents: read
  statuses: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 269e9614a2d2ebf6c5ef47da160c70fad465b33d
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wait for the exact production deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 36); do
            STATUS=$(gh api repos/mstrbstrd/popular-consulting/commits/269e9614a2d2ebf6c5ef47da160c70fad465b33d/status --jq '[.statuses[] | select(.context == "Vercel")][0].state')
            if [ "$STATUS" = success ]; then exit 0; fi
            if [ "$STATUS" = failure ] || [ "$STATUS" = error ]; then exit 1; fi
            sleep 5
          done
          exit 1
      - name: Verify live zoom, pan, text, persistence and mobile gestures
        run: node scripts/verify-popcan-browser.mjs
        env:
          CI: true
          VISUAL_CAPTURE_BROWSER: /usr/bin/google-chrome
          POPCAN_VERIFY_ORIGIN: https://popular-consulting.com
          POPCAN_VERIFY_OUTPUT: ${{ runner.temp }}/popcan-production
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: popcan-zoom-text-production
          path: ${{ runner.temp }}/popcan-production
          retention-days: 3
