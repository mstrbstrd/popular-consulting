name: Nova fire workbench
on:
  push:
    branches: [work/nova-fire-physics]
permissions:
  contents: write
concurrency:
  group: nova-fire-workbench
  cancel-in-progress: true
jobs:
  validate:
    if: github.ref == 'refs/heads/work/nova-fire-physics'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/nova-fire-physics
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Tighten the Nova pause boundary
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/components/CreatorOSFieldCanvas.js')
          source = p.read_text()
          if 'novaWasPaused' not in source:
              changes = [
                  ('    let novaTime = 0;', '    let novaTime = 0;\n    let novaWasPaused = pausedRef.current;'),
                  ('      novaTime = 0;', '      novaTime = 0;\n      novaWasPaused = pausedRef.current;'),
                  ('      novaTime = STATIC_TIME_SECONDS;', '      novaTime = STATIC_TIME_SECONDS;\n      novaWasPaused = pausedRef.current;'),
                  ('        novaTime += presentationDelta;', '        if (!novaWasPaused) novaTime += presentationDelta;\n        novaWasPaused = false;'),
                  ('      } else {\n        currentMode = modeRef.current;\n        incomingMode = currentMode;', '      } else {\n        novaWasPaused = true;\n        currentMode = modeRef.current;\n        incomingMode = currentMode;'),
              ]
              for old, new in changes:
                  assert source.count(old) == 1, old
                  source = source.replace(old, new, 1)
              p.write_text(source)
          p = Path('scripts/verify-nova-fire.mjs')
          source = p.read_text()
          if 'captureNovaResume' not in source:
              old = 'proto.uniform1f=function(l,v){if(names.has(l))novaStats.uniforms[names.get(l)]=v;return uniform.call(this,l,v);};'
              new = "proto.uniform1f=function(l,v){if(names.has(l)){const name=names.get(l);novaStats.uniforms[name]=v;if(name==='u_novaTime'&&window.captureNovaResume){window.novaResumeTime=v;window.captureNovaResume=false;}}return uniform.call(this,l,v);};"
              assert source.count(old) == 1
              source = source.replace(old, new, 1)
              old = "  await page.evaluate(() => setNovaProps({metabloomPalette:'nova',paused:false}));"
              new = """  await page.waitForTimeout(400);
            await page.evaluate(() => {window.captureNovaResume=true;setNovaProps({metabloomPalette:'nova',paused:false});});
            await page.waitForFunction(() => Number.isFinite(window.novaResumeTime));
            assert.equal(await page.evaluate(() => window.novaResumeTime),paused.uniforms.u_novaTime,'resume must not catch up paused wall time');"""
              assert source.count(old) == 1
              source = source.replace(old, new, 1)
              old = "  await page.emulateMedia({reducedMotion:'reduce'});"
              new = """  await page.evaluate(() => {
              window.hiddenNovaTime=novaStats.uniforms.u_novaTime;window.hiddenNovaDraws=novaStats.draws;
              Object.defineProperty(document,'visibilityState',{configurable:true,value:'hidden'});
              document.dispatchEvent(new Event('visibilitychange'));
            });
            await page.waitForTimeout(300);
            assert(await page.evaluate(() => novaStats.draws===window.hiddenNovaDraws),'hidden tabs must not draw');
            await page.evaluate(() => {
              window.captureNovaResume=true;window.novaResumeTime=undefined;
              Object.defineProperty(document,'visibilityState',{configurable:true,value:'visible'});
              document.dispatchEvent(new Event('visibilitychange'));
            });
            await page.waitForFunction(() => Number.isFinite(window.novaResumeTime));
            assert(await page.evaluate(() => window.novaResumeTime===window.hiddenNovaTime),'hidden wall time must not advance the fire');
            await page.emulateMedia({reducedMotion:'reduce'});"""
              assert source.count(old) == 1
              source = source.replace(old, new, 1)
              p.write_text(source)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/CreatorOSFieldCanvas.js scripts/verify-nova-fire.mjs
          if ! git diff --cached --quiet; then
            git commit -m 'Prevent Nova time jumps after pause and test hidden-tab suspension'
            git push origin HEAD:work/nova-fire-physics
          fi
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Full regression suite
        id: regression
        continue-on-error: true
        run: npm test -- --watchAll=false --runInBand --json --outputFile=/tmp/nova-tests.json
        env:
          CI: true
      - name: Verify baseline failures without modifying production tests
        if: steps.regression.outcome == 'failure'
        run: |
          git fetch --depth=1 origin 92d5ec52dc3642daf2f200a2cd0f4ee2672a170e
          git worktree add --detach /tmp/nova-baseline 92d5ec52dc3642daf2f200a2cd0f4ee2672a170e
          ln -s "$PWD/node_modules" /tmp/nova-baseline/node_modules
          (cd /tmp/nova-baseline && npm test -- --watchAll=false --runInBand --runTestsByPath src/components/InvoiceGeneratorNavigation.test.js --json --outputFile=/tmp/nova-baseline-tests.json) || true
          node - <<'NODE'
          const fs = require('fs');
          const assert = require('node:assert/strict');
          const current = JSON.parse(fs.readFileSync('/tmp/nova-tests.json'));
          const baseline = JSON.parse(fs.readFileSync('/tmp/nova-baseline-tests.json'));
          const failures = report => report.testResults.flatMap(suite => suite.assertionResults.filter(test => test.status === 'failed').map(test => test.fullName)).sort();
          assert.equal(current.numFailedTests, 1);
          assert.equal(current.numFailedTestSuites, 1);
          assert.deepEqual(failures(current), failures(baseline));
          assert(failures(current)[0].includes('mobile menu isolates the invoice'));
          console.log('BASELINE_CONFIRMED: the sole failing invoice focus test also fails before Nova changes.');
          console.log('NOVA_REGRESSIONS: '+current.numPassedTests+' tests passed; no new failures.');
          NODE
        env:
          CI: true
      - name: Production build
        run: npm run build
        env:
          CI: true
      - name: Browser prerequisites
        run: |
          npm install --prefix /tmp/nova-browser --no-audit --no-fund playwright@1.56.1
          /tmp/nova-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Native fire browser regressions
        run: node scripts/verify-nova-fire.mjs
        env:
          NODE_PATH: /tmp/nova-browser/node_modules
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nova-fire-review
          path: nova-review
          if-no-files-found: ignore
