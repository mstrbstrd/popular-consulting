name: Nova fire workbench
on:
  push:
    branches: [work/nova-fire-physics]
permissions:
  contents: read
concurrency:
  group: nova-fire-workbench
  cancel-in-progress: true
jobs:
  validate:
    if: github.ref == 'refs/heads/work/nova-fire-physics'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Full regression suite
        id: regression
        continue-on-error: true
        run: npm test -- --watchAll=false --runInBand --json --outputFile=/tmp/nova-tests.json
        env:
          CI: true
      - name: Verify baseline failures without modifying production tests
        if: steps.regression.outcome == 'failure'
        run: |
          git fetch --depth=1 origin 92d5ec52dc3642daf2f200a2cd0f4ee2672a170e
          git worktree add --detach /tmp/nova-baseline 92d5ec52dc3642daf2f200a2cd0f4ee2672a170e
          ln -s "$PWD/node_modules" /tmp/nova-baseline/node_modules
          (cd /tmp/nova-baseline && npm test -- --watchAll=false --runInBand --runTestsByPath src/components/InvoiceGeneratorNavigation.test.js --json --outputFile=/tmp/nova-baseline-tests.json) || true
          node - <<'NODE'
          const fs = require('fs');
          const assert = require('node:assert/strict');
          const current = JSON.parse(fs.readFileSync('/tmp/nova-tests.json'));
          const baseline = JSON.parse(fs.readFileSync('/tmp/nova-baseline-tests.json'));
          const failures = report => report.testResults.flatMap(suite => suite.assertionResults.filter(test => test.status === 'failed').map(test => test.fullName)).sort();
          assert.equal(current.numFailedTests, 1);
          assert.equal(current.numFailedTestSuites, 1);
          assert.deepEqual(failures(current), failures(baseline));
          assert(failures(current)[0].includes('mobile menu isolates the invoice'));
          console.log('BASELINE_CONFIRMED: the sole failing invoice focus test also fails before Nova changes.');
          console.log('NOVA_REGRESSIONS: '+current.numPassedTests+' tests passed; no new failures.');
          NODE
        env:
          CI: true
      - name: Production build
        run: npm run build
        env:
          CI: true
      - name: Browser prerequisites
        run: |
          npm install --prefix /tmp/nova-browser --no-audit --no-fund playwright@1.56.1
          /tmp/nova-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Native fire browser regressions
        run: node scripts/verify-nova-fire.mjs
        env:
          NODE_PATH: /tmp/nova-browser/node_modules
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nova-fire-review
          path: nova-review
          if-no-files-found: ignore
