name: Export Metabloom refinement worktree

on:
  push:
    branches:
      - codex/metabloom-emotive-runtime

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out refinement branch
        uses: actions/checkout@v4

      - name: Package worktree
        shell: bash
        run: |
          tar \
            --exclude=.git \
            --exclude=node_modules \
            --exclude=build \
            -czf "$RUNNER_TEMP/popular-consulting-worktree.tar.gz" .

      - name: Upload worktree
        uses: actions/upload-artifact@v4
        with:
          name: popular-consulting-worktree-${{ github.sha }}
          path: ${{ runner.temp }}/popular-consulting-worktree.tar.gz
          if-no-files-found: error
          retention-days: 1
