name: Apply and verify Metabloom emotive runtime

on:
  push:
    branches:
      - codex/metabloom-emotive-runtime

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out refinement branch
        uses: actions/checkout@v4
        with:
          ref: codex/metabloom-emotive-runtime

      - name: Reconstruct and apply refinement patch
        shell: bash
        run: |
          cat scripts/metabloom-emotive-runtime.final-* \
            | base64 --decode \
            | gzip --decompress \
            > "$RUNNER_TEMP/metabloom-emotive-runtime.patch"
          echo "60b1c93d92a1895f5176892c9f65fd1b3f378a6c774008972e02c474268f8133  $RUNNER_TEMP/metabloom-emotive-runtime.patch" \
            | sha256sum --check
          git apply --index "$RUNNER_TEMP/metabloom-emotive-runtime.patch"
          git diff --cached --check

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Run complete test suite
        run: npm test -- --watchAll=false --runInBand
        env:
          CI: true

      - name: Build production bundle
        run: npm run build
        env:
          CI: true

      - name: Commit verified source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f --ignore-unmatch .emotive-runtime-note
          git rm -f --ignore-unmatch scripts/metabloom-emotive-runtime.patch
          git rm -f --ignore-unmatch scripts/metabloom-emotive-runtime.patch.gz.b64.part-*
          git rm -f --ignore-unmatch scripts/metabloom-emotive-runtime.final-*
          git rm -f --ignore-unmatch .github/workflows/export-metabloom-worktree.yml
          git add -A
          git diff --cached --check
          git commit -m "Refine Metabloom emotive transitions"
          git push origin "HEAD:${GITHUB_REF_NAME}"
