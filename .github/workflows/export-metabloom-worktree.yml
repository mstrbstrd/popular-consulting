name: Apply and verify Metabloom emotive runtime

on:
  push:
    branches:
      - codex/metabloom-emotive-runtime

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out refinement branch
        uses: actions/checkout@v4
        with:
          ref: codex/metabloom-emotive-runtime

      - name: Reconstruct and apply refinement patch
        shell: bash
        run: |
          {
            head -c 6000 scripts/metabloom-emotive-runtime.patch.gz.b64.part-00
            cat scripts/metabloom-emotive-runtime.patch.gz.b64.part-01
            cat scripts/metabloom-emotive-runtime.patch.gz.b64.part-02
          } \
            | base64 --decode \
            | gzip --decompress \
            > "$RUNNER_TEMP/metabloom-emotive-runtime.patch"
          echo "f548d011aa5630efbb27b32677838cb0dcad0ab38ba666e1d5769859e2d9e54a  $RUNNER_TEMP/metabloom-emotive-runtime.patch" \
            | sha256sum --check
          git apply --index "$RUNNER_TEMP/metabloom-emotive-runtime.patch"
          git diff --cached --check

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Run complete test suite
        run: npm test -- --watchAll=false --runInBand
        env:
          CI: true

      - name: Build production bundle
        run: npm run build
        env:
          CI: true

      - name: Commit verified source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/metabloom-emotive-runtime.patch
          git rm scripts/metabloom-emotive-runtime.patch.gz.b64.part-00
          git rm scripts/metabloom-emotive-runtime.patch.gz.b64.part-01
          git rm scripts/metabloom-emotive-runtime.patch.gz.b64.part-02
          git rm .github/workflows/export-metabloom-worktree.yml
          git add -A
          git diff --cached --check
          git commit -m "Refine Metabloom emotive transitions"
          git push origin "HEAD:${GITHUB_REF_NAME}"
