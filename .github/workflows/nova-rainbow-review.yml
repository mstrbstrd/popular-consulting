name: Nova rainbow and silver review
on:
  push:
    branches: [work/nova-rainbow-silver]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 8
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply checked palette-only changes
        run: python3 scripts/refine-nova-rainbow.py
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Full test suite and unchanged baseline comparison
        env:
          CI: true
        run: |
          npm test -- --watchAll=false --runInBand --json --outputFile=/tmp/nova-tests.json || test -s /tmp/nova-tests.json
          git worktree add --detach /tmp/nova-baseline feaf02478234de961f9ab9d2c30171ca3190218d
          ln -s "$PWD/node_modules" /tmp/nova-baseline/node_modules
          (cd /tmp/nova-baseline && npm test -- --watchAll=false --runInBand --runTestsByPath src/components/InvoiceGeneratorNavigation.test.js --json --outputFile=/tmp/nova-baseline-tests.json) || test -s /tmp/nova-baseline-tests.json
          node - <<'NODE'
          const fs = require('fs'), assert = require('node:assert/strict');
          const current = JSON.parse(fs.readFileSync('/tmp/nova-tests.json'));
          const baseline = JSON.parse(fs.readFileSync('/tmp/nova-baseline-tests.json'));
          const failures = report => report.testResults.flatMap(s => s.assertionResults.filter(t => t.status === 'failed').map(t => t.fullName)).sort();
          assert.equal(current.numRuntimeErrorTestSuites, 0);
          assert.equal(current.numPendingTests, 0);
          assert(current.numPassedTests >= 1023);
          assert(current.numFailedTests <= 1);
          if (current.numFailedTests) {
            assert.deepEqual(failures(current), failures(baseline));
            assert(failures(current)[0].includes('mobile menu isolates the invoice'));
          }
          const result = {passed:current.numPassedTests,failed:current.numFailedTests,newFailures:0,baselineFailures:failures(baseline)};
          fs.mkdirSync('nova-review',{recursive:true});
          fs.writeFileSync('nova-review/test-summary.json',JSON.stringify(result,null,2));
          console.log(JSON.stringify(result));
          NODE
      - name: Production build
        run: npm run build
        env:
          CI: true
      - name: Browser prerequisites
        run: |
          npm install --prefix /tmp/nova-browser --no-audit --no-fund --ignore-scripts playwright@1.56.1
          /tmp/nova-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Rendering, RGB-only palette, topology and lifecycle checks
        env:
          NODE_PATH: /tmp/nova-browser/node_modules
        run: |
          node scripts/verify-nova-fire.mjs > /tmp/nova-lifecycle.log 2>&1 || { tail -c 4000 /tmp/nova-lifecycle.log; exit 1; }
          grep '^{' /tmp/nova-lifecycle.log
          node scripts/verify-nova-floating.mjs
          node scripts/verify-nova-balance.mjs
          node scripts/verify-metalnova.mjs
          node scripts/verify-nova-rainbow.mjs
      - name: Commit tested source to work branch only
        run: |
          test "$(git branch --show-current)" = "work/nova-rainbow-silver"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/MetabloomNovaShader.js src/components/MetalNovaFinish.test.js scripts/verify-nova-fire.mjs scripts/verify-nova-floating.mjs scripts/verify-nova-balance.mjs
          git commit -m "Give Nova a rainbow flame crest and restore bright MetalNova silver"
          git push origin HEAD:refs/heads/work/nova-rainbow-silver
          git ls-tree -r HEAD src/components/MetabloomNovaShader.js src/components/MetalNovaFinish.test.js scripts/verify-nova-fire.mjs scripts/verify-nova-floating.mjs scripts/verify-nova-balance.mjs scripts/verify-nova-rainbow.mjs > nova-review/source-blobs.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nova-rainbow-silver-review
          path: nova-review
          if-no-files-found: ignore
