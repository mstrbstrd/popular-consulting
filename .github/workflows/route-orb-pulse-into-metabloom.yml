name: Verify Orb pulse reaches Metabloom material

on:
  push:
    branches:
      - feature/metabloom-avatar-orb-20260902

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/metabloom-avatar-orb-20260902
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Route pulse into Metabloom field
        run: python scripts/route_orb_pulse_into_metabloom.py
      - name: Check whitespace
        run: git diff --check
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test -- --watchAll=false --runInBand
        env:
          CI: true
      - name: Build
        run: npm run build
        env:
          CI: true
      - name: Commit verified pulse integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/route_orb_pulse_into_metabloom.py
          git rm .github/workflows/route-orb-pulse-into-metabloom.yml
          git add \
            src/components/CreatorOSFieldCanvas.js \
            src/components/CreatorOSFieldCanvas.test.js \
            src/components/MetabloomAvatar.js \
            src/components/MetabloomAvatar.test.js \
            src/components/OrbAvatarRuntimeContract.test.js
          git diff --cached --check
          git commit -m "Route Orb pulses into the Metabloom field"
          git push origin "HEAD:${GITHUB_REF_NAME}"
