name: Apply and verify Metabloom emote protocol

on:
  push:
    branches:
      - codex/metabloom-emotive-runtime

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out refinement branch
        uses: actions/checkout@v4
        with:
          ref: codex/metabloom-emotive-runtime

      - name: Apply semantic emote protocol
        run: python scripts/apply_metabloom_emote_protocol.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Run complete test suite
        run: npm test -- --watchAll=false --runInBand
        env:
          CI: true

      - name: Build production bundle
        run: npm run build
        env:
          CI: true

      - name: Commit verified implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f --ignore-unmatch scripts/apply_metabloom_emote_protocol.py
          git rm -f --ignore-unmatch .github/workflows/apply-metabloom-emote-protocol.yml
          git rm -f --ignore-unmatch .github/workflows/export-metabloom-source.yml
          git rm -f --ignore-unmatch .github/workflows/dispatch-metabloom-state-fix.yml
          git rm -f --ignore-unmatch .github/workflows/fix-metabloom-imperative-state.yml
          git rm -f --ignore-unmatch scripts/metabloom-imperative-state.patch.gz.b64
          git add -A
          git diff --cached --check
          git commit -m "Implement Metabloom emote response protocol"
          git push origin "HEAD:${GITHUB_REF_NAME}"
