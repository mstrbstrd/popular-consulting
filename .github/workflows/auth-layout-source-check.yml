name: Authentication layout baseline
on:
  push:
    branches: [verify/auth-layout-source-20260917]
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1132d393e1c10b606dd318b22d29393b3bdae284
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 8fd16aedd8b9fdf9638703ae14cd01ef557ab599
          path: layout-check
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
        env:
          CI: true
      - name: Run the same layout probes on baseline and require reproduction
        run: node layout-check/scripts/verify-auth-layout.mjs --baseline
        env:
          VISUAL_CAPTURE_BROWSER: /usr/bin/google-chrome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: auth-layout-baseline
          path: auth-layout-evidence/
          retention-days: 7
