name: Apply persistent Tidal Weave edge gradients

on:
  push:
    branches:
      - agent/persistent-tidal-gradient-edges
    paths:
      - .github/workflows/apply-persistent-tidal-gradient-edges.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/persistent-tidal-gradient-edges
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Keep the spectral gradient on every Tidal Weave edge
        shell: python
        run: |
          from pathlib import Path

          shader_path = Path("src/components/CreatorOSFieldShader.js")
          shader = shader_path.read_text(encoding="utf-8")

          start_marker = "// Isolate the site palette to a very thin iso-line around each caustic."
          end_marker = "\nvec3 tint = mix("
          if shader.count(start_marker) != 1:
              raise SystemExit("Expected one existing Tidal Weave outline block.")
          start = shader.index(start_marker)
          end = shader.index(end_marker, start)

          replacement = '''// Keep a continuous spectral gradient on both edges of every caustic.
          // The previous 0.30 iso-line lived mostly in the transparent glow, so it
          // became visible chiefly where two bands crossed. This contour sits just
          // inside the visible line body and is calculated independently per band.
          float outlineLevel = 0.72;
          float outlineWidthA = max(fwidth(bandA) * 0.72, 0.010);
          float outlineWidthB = max(fwidth(bandB) * 0.72, 0.010);
          float outlineA = 1.0 - smoothstep(
            outlineWidthA,
            outlineWidthA * 1.90,
            abs(bandA - outlineLevel)
          );
          float outlineB = 1.0 - smoothstep(
            outlineWidthB,
            outlineWidthB * 1.90,
            abs(bandB - outlineLevel)
          );

          // Give each ribbon its own travelling hue so the border remains a true
          // gradient along the full line instead of borrowing color from crossings.
          vec3 outlineSpectralA = spectral(
            0.47
              + phaseA * 0.18
              + p.x * 0.120
              + time * 0.012
          );
          vec3 outlineSpectralB = spectral(
            0.84
              + phaseB * 0.17
              - p.x * 0.120
              - time * 0.010
          );
          float outlineChroma = mix(0.48, 0.42, u_light);
          float outlineFloor = mix(0.70, 0.78, u_light);
          vec3 outlineTintA = max(
            mix(vec3(0.96), outlineSpectralA, outlineChroma),
            vec3(outlineFloor)
          );
          vec3 outlineTintB = max(
            mix(vec3(0.96), outlineSpectralB, outlineChroma),
            vec3(outlineFloor)
          );
          float outlineWeight = outlineA + outlineB;
          vec3 spectralOutlineTint = (
            outlineTintA * outlineA
              + outlineTintB * outlineB
          ) / max(outlineWeight, 0.0001);
          float spectralOutline = sat(max(outlineA, outlineB));
          float spectralOutlineStrength = mix(0.92, 0.90, u_light);
          waterTint = mix(
            waterTint,
            spectralOutlineTint,
            spectralOutline * spectralOutlineStrength
          );
          '''

          shader_path.write_text(
              shader[:start] + replacement + shader[end:],
              encoding="utf-8",
          )

          test_path = Path("src/components/CreatorOSFieldCanvas.test.js")
          test_source = test_path.read_text(encoding="utf-8")

          setup_anchor = "const tidalScene = CREATOROS_FIELD_FRAGMENT_SHADER.slice("
          setup_start = test_source.index(setup_anchor)
          setup_end = test_source.index(");", setup_start) + 2
          setup_insertion = '''
            const outlineStart = tidalScene.indexOf(
              "// Keep a continuous spectral gradient",
            );
            const outlineEnd = tidalScene.indexOf(
              "\\nvec3 tint = mix(",
              outlineStart,
            );
            const tidalOutline = tidalScene.slice(outlineStart, outlineEnd);'''
          test_source = (
              test_source[:setup_end]
              + setup_insertion
              + test_source[setup_end:]
          )

          assertion_anchor = 'expect(tidalScene).toContain("fwidth(bandB)");'
          assertion_end = test_source.index(assertion_anchor) + len(assertion_anchor)
          assertion_insertion = '''
            expect(tidalScene).toContain("float outlineLevel = 0.72");
            expect(tidalScene).not.toContain("abs(bandA - 0.30)");
            expect(tidalScene).toContain("vec3 outlineSpectralA");
            expect(tidalScene).toContain("vec3 outlineSpectralB");
            expect(tidalScene).toContain("p.x * 0.120");
            expect(tidalScene).toContain("outlineTintA * outlineA");
            expect(tidalScene).toContain("outlineTintB * outlineB");
            expect(outlineStart).toBeGreaterThanOrEqual(0);
            expect(outlineEnd).toBeGreaterThan(outlineStart);
            expect(tidalOutline).not.toContain("crossing");'''
          test_source = (
              test_source[:assertion_end]
              + assertion_insertion
              + test_source[assertion_end:]
          )
          test_path.write_text(test_source, encoding="utf-8")

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test -- --watchAll=false --runInBand
        env:
          CI: true

      - name: Build production bundle
        run: npm run build
        env:
          CI: true

      - name: Commit and push the refinement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/components/CreatorOSFieldShader.js \
            src/components/CreatorOSFieldCanvas.test.js
          git rm .github/workflows/apply-persistent-tidal-gradient-edges.yml
          git commit -m "Keep Tidal Weave gradients on every edge"
          git push origin HEAD:agent/persistent-tidal-gradient-edges
