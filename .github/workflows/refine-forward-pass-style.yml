name: Refine Forward Pass site style

on:
  push:
    branches:
      - agent/forward-pass-field
    paths:
      - .github/workflows/refine-forward-pass-style.yml

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/forward-pass-field
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Refine the field into the CreatorOS material language
        shell: python
        run: |
          from pathlib import Path

          shader_path = Path("src/components/CreatorOSFieldShader.js")
          shader = shader_path.read_text(encoding="utf-8")
          scene_start = shader.index("vec4 sceneForwardPass(vec2 uv, float time) {")
          scene_end = shader.index("\nvec4 sampleScene(int mode, vec2 uv, float time) {", scene_start)

          refined_scene = r'''vec4 sceneForwardPass(vec2 uv, float time) {
            float aspect = u_res.x / max(u_res.y, 1.0);
            vec2 scale = aspectScale();
            vec2 responsiveUv = pointerFlow(uv, 0.038);
            vec2 warpedPosition = viscousWarp(
              centeredUv(responsiveUv),
              time,
              0.12
            );
            vec2 fieldUv = warpedPosition / scale * 0.5 + 0.5;
            float intro = smoothstep(0.0, 0.88, u_intro);
            float pulse = pulseField(uv);
            float gateBias = (u_pointer.y - 0.5) * 1.8
              + (u_pointer.x - 0.5) * 0.6;
            float field = 0.0;
            float tintWeight = 0.0;
            float activationEcho = 0.0;
            vec3 tintAccumulator = vec3(0.0);

            // The architecture stays legible, but every stage is expressed as
            // translucent spectral material rather than a literal diagram.
            for (int token = 0; token < 5; token++) {
              float tokenIndex = float(token);
              float laneY = 0.18 + tokenIndex * 0.16;
              laneY += sin(
                fieldUv.x * TAU * 0.72
                  + time * 0.11
                  + tokenIndex * 1.33
              ) * 0.008;
              float tokenHue = 0.69 + tokenIndex * 0.074 + time * 0.008;
              float packet = pow(
                0.5 + 0.5 * cos(
                  (fieldUv.x * 5.8 - time * 0.16 - tokenIndex * 0.17) * TAU
                ),
                14.0
              );
              float streamDistance = abs(fieldUv.y - laneY);
              float streamCore = exp(-streamDistance * 145.0);
              float streamGlow = exp(-streamDistance * 30.0) * 0.13;
              float residualStream = streamCore * (0.20 + packet * 0.68)
                + streamGlow;
              vec3 streamTint = spectral(tokenHue);
              field += residualStream;
              tintAccumulator += streamTint * residualStream;
              tintWeight += residualStream;

              for (int layer = 0; layer < 4; layer++) {
                float layerIndex = float(layer);
                float blockStart = 0.055 + layerIndex * 0.235;
                float blockWidth = 0.205;
                float local = (fieldUv.x - blockStart) / blockWidth;
                float blockMask = smoothstep(0.0, 0.045, local)
                  * (1.0 - smoothstep(0.955, 1.0, local));
                float layerReveal = smoothstep(
                  layerIndex * 0.16,
                  layerIndex * 0.16 + 0.36,
                  u_intro
                );
                float direction = mod(tokenIndex + layerIndex, 2.0) < 1.0
                  ? 1.0
                  : -1.0;

                float residualCurve = laneY
                  + direction
                    * sin(PI * sat(local))
                    * (0.030 + 0.008 * sin(time * 0.11 + tokenIndex))
                  + sin(
                    local * TAU * 1.35
                      + time * 0.15
                      + tokenIndex * 0.9
                  ) * 0.004;
                float residualDistance = abs(fieldUv.y - residualCurve);
                float residualCore = exp(-residualDistance * 180.0);
                float residualGlow = exp(-residualDistance * 36.0) * 0.12;
                float residualBypass = (
                  residualCore * (0.26 + packet * 0.38)
                    + residualGlow
                ) * blockMask * layerReveal;
                vec3 residualTint = spectral(
                  tokenHue + layerIndex * 0.045 + 0.10
                );
                field += residualBypass;
                tintAccumulator += residualTint * residualBypass;
                tintWeight += residualBypass;

                float causalLookback = 1.0 + mod(layerIndex, 2.0);
                float sourceIndex = max(tokenIndex - causalLookback, 0.0);
                float sourceY = 0.18 + sourceIndex * 0.16;
                sourceY += sin(
                  fieldUv.x * TAU * 0.72
                    + time * 0.11
                    + sourceIndex * 1.33
                ) * 0.008;
                float attentionProgress = sat((local - 0.045) / 0.26);
                float attentionWindow = smoothstep(0.02, 0.075, local)
                  * (1.0 - smoothstep(0.285, 0.34, local))
                  * layerReveal;
                float attentionY = mix(sourceY, laneY, attentionProgress)
                  + direction * sin(attentionProgress * PI) * 0.022;
                float contextPulse = pow(
                  0.5 + 0.5 * cos(
                    (local * 2.4
                      - time * 0.20
                      - tokenIndex * 0.17
                      - layerIndex * 0.09) * TAU
                  ),
                  10.0
                );
                float attentionDistance = abs(fieldUv.y - attentionY);
                float attentionCore = exp(-attentionDistance * 150.0);
                float attentionGlow = exp(-attentionDistance * 34.0) * 0.15;
                float attentionMix = (
                  attentionCore * (0.24 + contextPulse * 0.86)
                    + attentionGlow
                ) * attentionWindow;
                vec3 attentionTint = spectral(
                  tokenHue + sourceIndex * 0.035 + layerIndex * 0.03 + 0.05
                );
                field += attentionMix;
                tintAccumulator += attentionTint * attentionMix;
                tintWeight += attentionMix;

                float ffnProgress = sat((local - 0.34) / 0.52);
                float ffnWindow = smoothstep(0.31, 0.37, local)
                  * (1.0 - smoothstep(0.86, 0.92, local))
                  * layerReveal;
                float hiddenExpansion = sin(ffnProgress * PI)
                  * (0.064
                    + 0.012 * sin(
                      time * 0.13 + tokenIndex * 1.7 + layerIndex
                    ));
                float projectionFunnel = smoothstep(0.62, 1.0, ffnProgress);
                float laneBias = exp(-abs(u_pointer.y - laneY) * 8.0)
                  * u_energy;

                for (int hidden = 0; hidden < 4; hidden++) {
                  float hiddenIndex = float(hidden);
                  float hiddenOffset = (hiddenIndex - 1.5) / 1.5;
                  float hiddenY = laneY + hiddenOffset * hiddenExpansion;
                  hiddenY += sin(
                    local * TAU
                      + time * 0.17
                      + hiddenIndex * 1.6
                      + tokenIndex
                  ) * 0.003;
                  float valueProjection = 0.5 + 0.5 * sin(
                    time * 0.33
                      + tokenIndex * 1.31
                      + layerIndex * 0.77
                      + hiddenIndex * 1.91
                      + local * 8.0
                  );
                  float gateProjection = sat(
                    (0.5 + 0.5 * cos(
                      time * 0.29
                        - tokenIndex * 0.83
                        + layerIndex * 1.17
                        + hiddenIndex * 2.23
                        + gateBias
                    )) * 0.84
                      + laneBias * 0.52
                  );
                  float swigluGate = gateProjection
                    / (1.0 + exp(-(gateProjection * 7.0 - 3.5)));
                  float gatedActivation = sat(
                    valueProjection * swigluGate * 2.15
                  );
                  float hiddenDistance = abs(fieldUv.y - hiddenY);
                  float hiddenCore = exp(-hiddenDistance * 165.0);
                  float hiddenGlow = exp(-hiddenDistance * 34.0) * 0.12;
                  float hiddenLine = (
                    hiddenCore * (0.16 + gatedActivation * 1.16)
                      + hiddenGlow
                  ) * ffnWindow * (0.78 + projectionFunnel * 0.28);

                  float activationX = blockStart
                    + blockWidth * (0.59 + hiddenOffset * 0.015);
                  vec2 activationDelta = vec2(
                    (fieldUv.x - activationX) * aspect,
                    fieldUv.y - hiddenY
                  );
                  float activationBloom = exp(
                    -dot(activationDelta, activationDelta)
                      * (620.0 + hiddenIndex * 70.0)
                  ) * ffnWindow * (0.16 + gatedActivation * 1.25);
                  float hiddenMaterial = hiddenLine + activationBloom;
                  vec3 hiddenTint = spectral(
                    tokenHue
                      + 0.10
                      + layerIndex * 0.035
                      + hiddenIndex * 0.045
                      + gatedActivation * 0.07
                  );
                  vec3 activationTint = mix(
                    hiddenTint,
                    spectral(
                      0.34
                        + layerIndex * 0.025
                        + gatedActivation * 0.08
                    ),
                    gatedActivation * 0.32
                  );
                  field += hiddenMaterial;
                  tintAccumulator += hiddenTint * hiddenLine
                    + activationTint * activationBloom;
                  tintWeight += hiddenMaterial;
                  activationEcho += activationBloom * gatedActivation;
                }

                float chamberRadius = hiddenExpansion * 0.88 + 0.015;
                float chamberMembrane = exp(
                  -abs(abs(fieldUv.y - laneY) - chamberRadius) * 95.0
                ) * ffnWindow * 0.10;
                vec3 chamberTint = spectral(
                  tokenHue + layerIndex * 0.04 + 0.17
                );
                field += chamberMembrane;
                tintAccumulator += chamberTint * chamberMembrane;
                tintWeight += chamberMembrane;

                vec2 entryDelta = vec2(
                  (fieldUv.x - blockStart) * aspect,
                  fieldUv.y - laneY
                );
                vec2 ffnDelta = vec2(
                  (fieldUv.x - (blockStart + blockWidth * 0.33)) * aspect,
                  fieldUv.y - laneY
                );
                vec2 mergeDelta = vec2(
                  (fieldUv.x - (blockStart + blockWidth * 0.92)) * aspect,
                  fieldUv.y - laneY
                );
                float entryNode = exp(-dot(entryDelta, entryDelta) * 1450.0)
                  + exp(-dot(entryDelta, entryDelta) * 180.0) * 0.12;
                float ffnNode = exp(-dot(ffnDelta, ffnDelta) * 1550.0)
                  + exp(-dot(ffnDelta, ffnDelta) * 190.0) * 0.13;
                float mergeNode = exp(-dot(mergeDelta, mergeDelta) * 1350.0)
                  + exp(-dot(mergeDelta, mergeDelta) * 165.0) * 0.16;
                float structure = (
                  entryNode * 0.32
                    + ffnNode * 0.38
                    + mergeNode * (0.44 + projectionFunnel * 0.42)
                ) * layerReveal;
                vec3 structureTint = spectral(
                  tokenHue + layerIndex * 0.06 + 0.18
                );
                field += structure;
                tintAccumulator += structureTint * structure;
                tintWeight += structure;
              }
            }

            float promptEnvelope = 1.0 - smoothstep(2.8, 5.6, u_pulseAge);
            float promptX = u_pulseOrigin.x + u_pulseAge * 0.13;
            float promptFront = exp(
              -abs(fieldUv.x - promptX) * aspect * 76.0
            ) * exp(
              -abs(fieldUv.y - u_pulseOrigin.y) * 9.0
            ) * promptEnvelope;
            float promptHalo = exp(
              -abs(fieldUv.x - promptX) * aspect * 22.0
            ) * exp(
              -abs(fieldUv.y - u_pulseOrigin.y) * 4.0
            ) * promptEnvelope * 0.16;
            float promptSignal = promptFront * 1.36
              + promptHalo
              + pulse * 0.28;
            vec3 promptTint = spectral(
              0.30 + u_pulseOrigin.y * 0.20 + time * 0.015
            );
            field += promptSignal;
            tintAccumulator += promptTint * promptSignal;
            tintWeight += promptSignal;

            field *= intro;
            activationEcho *= intro;
            vec3 tint = tintAccumulator / max(tintWeight, 0.0001);
            tint = mix(
              tint,
              promptTint,
              sat(promptFront * 0.72 + pulse * 0.20)
            );
            vec4 material = fluidMaterial(field, tint, 0.30, 0.24, 0.88);
            material.rgb += spectral(0.34 + time * 0.012)
              * sat(activationEcho)
              * 0.09;
            material.a = max(material.a, sat((field - 0.10) * 0.24));
            return material;
          }
          '''

          shader_path.write_text(
              shader[:scene_start]
              + refined_scene.strip()
              + shader[scene_end:],
              encoding="utf-8",
          )

          page_path = Path("src/components/DitherCanvasPage.js")
          page = page_path.read_text(encoding="utf-8")
          old_description = (
              '      "Token states traverse repeating transformer blocks: causal context mixes, '
              'hidden channels expand through a SwiGLU gate, and each result rejoins its residual stream.",'
          )
          new_description = (
              '      "Five spectral token currents cross four fluid transformer chambers: causal context '
              'folds between lanes, gated hidden blooms expand and collapse, and every result rejoins its residual current.",'
          )
          old_instruction = (
              '      "Move to bias the gates · tap to inject a token pulse and follow it through the layers",'
          )
          new_instruction = (
              '      "Move to bias the gates · tap to inject a token pulse and watch it propagate through the chambers",'
          )
          if page.count(old_description) != 1 or page.count(old_instruction) != 1:
              raise SystemExit("Forward Pass copy no longer matches the refinement patch.")
          page_path.write_text(
              page.replace(old_description, new_description).replace(
                  old_instruction,
                  new_instruction,
              ),
              encoding="utf-8",
          )

          css_path = Path("src/components/CreatorOSFieldCanvas.css")
          css = css_path.read_text(encoding="utf-8")
          css_start = css.index(
              ".creatoros-field-mode-7 .creatoros-field-fallback {"
          )
          css_end = css.index(
              '[data-theme="dark"] .creatoros-field-fallback {',
              css_start,
          )
          refined_fallback = '''.creatoros-field-mode-7 .creatoros-field-fallback {
            background:
              radial-gradient(ellipse at 18% 26%, rgba(0, 238, 255, 0.38), transparent 20%),
              radial-gradient(ellipse at 42% 64%, rgba(157, 0, 255, 0.38), transparent 24%),
              radial-gradient(ellipse at 68% 34%, rgba(255, 0, 255, 0.32), transparent 22%),
              radial-gradient(ellipse at 88% 72%, rgba(0, 238, 255, 0.30), transparent 20%),
              repeating-linear-gradient(0deg, transparent 0 4.3rem, rgba(0, 238, 255, 0.12) 4.42rem 4.7rem, transparent 4.82rem 8.6rem),
              #fff8f7;
          }

          .rupture-propagating .rupture-state span {
            background: #00eeff;
            box-shadow:
              0 0 1.4rem rgba(0, 238, 255, 0.92),
              0 0 2.8rem rgba(255, 0, 255, 0.42);
          }

          '''
          css_path.write_text(
              css[:css_start] + refined_fallback + css[css_end:],
              encoding="utf-8",
          )

          test_path = Path("src/components/ForwardPassField.test.js")
          test_source = test_path.read_text(encoding="utf-8")
          marker = '  test("keeps the new field inside the existing renderer and performance budget", () => {'
          if test_source.count(marker) != 1:
              raise SystemExit("Forward Pass performance test marker changed.")
          style_test = '''  test("expresses the architecture through the CreatorOS material language", () => {
            expect(scene).toContain("vec2 responsiveUv = pointerFlow");
            expect(scene).toContain("viscousWarp(");
            expect(scene).toContain("float streamGlow");
            expect(scene).toContain("float attentionGlow");
            expect(scene).toContain("float activationBloom");
            expect(scene).toContain("float chamberMembrane");
            expect(scene).toContain("float activationEcho");
            expect(scene).toContain(
              "fluidMaterial(field, tint, 0.30, 0.24, 0.88)",
            );
          });

          '''
          test_path.write_text(
              test_source.replace(marker, style_test + marker),
              encoding="utf-8",
          )

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test -- --watchAll=false --runInBand
        env:
          CI: true

      - name: Build production bundle
        run: npm run build
        env:
          CI: true

      - name: Commit style refinement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/components/CreatorOSFieldShader.js \
            src/components/CreatorOSFieldCanvas.css \
            src/components/DitherCanvasPage.js \
            src/components/ForwardPassField.test.js
          git commit -m "Refine Forward Pass into the Spectral Display style"
          git push origin HEAD:agent/forward-pass-field
