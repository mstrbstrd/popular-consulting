name: Chiral weave workbench
on:
  push:
    branches: [feat/chiral-weave]
    paths: [.github/workflows/chiral-weave-workbench.yml]
permissions:
  contents: read
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Apply reviewed feature patch
        env:
          PATCH: 
        run: |
          python - <<'PY'
          import os,base64,gzip,hashlib,pathlib,subprocess
          patch=gzip.decompress(base64.b64decode(os.environ['PATCH'],validate=True))
          assert hashlib.sha256(patch).hexdigest()=='2710783e82d3acb61f150903fb324498dde1242323641131e44460476d9cdb73'
          p=pathlib.Path('/tmp/chiral.patch');p.write_bytes(patch)
          allowed={'CLAUDE.md','public/dither-typography.css','scripts/verify-chiral-weave.mjs','scripts/verify-dither-readability.mjs','src/components/ChiralWeave.test.js','src/components/ChiralWeaveShader.js','src/components/CreatorOSFieldCanvas.css','src/components/CreatorOSFieldCanvas.js','src/components/CreatorOSFieldCanvas.test.js','src/components/CreatorOSFieldShader.js','src/components/DitherCanvasPage.css','src/components/DitherCanvasPage.js','src/components/DitherCanvasPage.test.js','src/components/DitherScrollNarrative.css','src/components/ForwardPassField.test.js'}
          stats=subprocess.check_output(['git','apply','--numstat',str(p)],text=True)
          assert {line.split('\t')[2] for line in stats.splitlines()}==allowed
          subprocess.run(['git','apply','--check',str(p)],check=True)
          subprocess.run(['git','apply',str(p)],check=True)
          subprocess.run(['git','add','--',*sorted(allowed)],check=True)
          PY
          git rm .github/workflows/chiral-weave-workbench.yml
      - name: Commit to feature branch only
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/feat/chiral-weave
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'add chiral weave field with spatial reflection and regression checks'
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git push origin HEAD:refs/heads/feat/chiral-weave
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  validate:
    needs: apply
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.apply.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Compile and verify shader geometry
        run: node scripts/verify-chiral-weave.mjs
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test -- --watchAll=false --runInBand
        env:
          CI: true
      - name: Production build
        run: npm run build
        env:
          CI: true
      - name: Preserve shader evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chiral-weave-evidence
          path: chiral-weave-evidence
          if-no-files-found: ignore
          retention-days: 7
