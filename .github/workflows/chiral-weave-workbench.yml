name: Chiral weave workbench
on:
  push:
    branches: [feat/chiral-weave]
    paths:
      - .github/workflows/chiral-weave-workbench.yml
      - .github/chiral-weave.patch
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Package public source for isolated validation
        run: git archive --format=tar.gz --output=chiral-source.tar.gz HEAD src public scripts package.json package-lock.json config-overrides.js vercel.json CONTRIBUTING.md CLAUDE.md .github/workflows
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chiral-source
          path: chiral-source.tar.gz
          retention-days: 1
