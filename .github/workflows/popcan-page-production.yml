name: Popcan page production verification
on:
  push:
    branches: [fix/popcan-page-canvas]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f20d7009b774cce1314991a6ebf77322710dff05
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wait for this exact Vercel deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 24); do
            STATUS=$(curl --fail --silent --show-error --max-time 10 -H "Authorization: Bearer $GH_TOKEN" 'https://api.github.com/repos/mstrbstrd/popular-consulting/commits/f20d7009b774cce1314991a6ebf77322710dff05/status' | jq -r '.statuses[] | select(.context=="Vercel") | .state' | head -1)
            if [ "$STATUS" = 'success' ]; then exit 0; fi
            if [ "$STATUS" = 'failure' ] || [ "$STATUS" = 'error' ]; then exit 1; fi
            sleep 5
          done
          exit 1
      - name: Verify live drawing, full-page layout, storage, zoom, touch and contrast
        run: node scripts/verify-popcan-browser.mjs
        env:
          CI: true
          VISUAL_CAPTURE_BROWSER: /usr/bin/google-chrome
          POPCAN_VERIFY_ORIGIN: https://popular-consulting.com
          POPCAN_VERIFY_OUTPUT: ${{ runner.temp }}/popcan-page-production
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: popcan-page-production
          path: ${{ runner.temp }}/popcan-page-production
          retention-days: 3
