name: Verify cutesy dithered Bloom refinement

on:
  push:
    branches:
      - feature/living-metabloom-creature-20260902

permissions:
  contents: write

concurrency:
  group: cutesy-dither-bloom-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/living-metabloom-creature-20260902

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply organism refinement
        run: python scripts/apply_cutesy_dither_bloom.py

      - name: Check source invariants
        run: |
          git diff --check
          grep -q 'float ocularDome' src/components/LivingMetabloomShader.js
          grep -q 'float orderedDither=bayer8' src/components/LivingMetabloomShader.js
          grep -q 'image-rendering: pixelated' src/components/LivingMetabloomPolish.css
          ! grep -q 'image-rendering: auto' src/components/LivingMetabloomPolish.css

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --watchAll=false --runInBand
        env:
          CI: true

      - name: Build
        run: npm run build
        env:
          CI: true

      - name: Commit verified source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/apply_cutesy_dither_bloom.py
          git rm .github/workflows/apply-cutesy-dither-bloom.yml
          git add src/components/LivingMetabloomShader.js
          git add src/components/LivingMetabloomPolish.css
          git add src/components/LivingMetabloomCanvas.test.js
          git add src/components/OrbAvatarRuntimeContract.test.js
          git diff --cached --check
          git commit -m "Make Bloom cuter and restore persistent dither"
          git push origin "HEAD:${GITHUB_REF_NAME}"
