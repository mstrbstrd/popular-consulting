name: Popcan pan and text review
on:
  push:
    branches: [feat/popcan-pan-zoom-text]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - run: git archive --format=zip --output=popcan-current.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: popcan-current
          path: popcan-current.zip
          retention-days: 1
