name: Orb state visual review

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  capture-states:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build production bundle
        run: npm run build
        env:
          CI: true

      - name: Capture Bloom moods and forms
        run: node scripts/capture-orb-state-review.mjs

      - name: Upload Bloom state review
        uses: actions/upload-artifact@v4
        with:
          name: orb-state-review-${{ github.sha }}
          path: orb-state-review/*
          if-no-files-found: error
          retention-days: 3
