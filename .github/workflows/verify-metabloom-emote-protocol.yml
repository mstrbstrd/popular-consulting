name: Verify final Metabloom emote protocol

on:
  push:
    branches:
      - codex/metabloom-emote-protocol

permissions:
  contents: write

concurrency:
  group: verify-metabloom-emote-protocol
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out protocol branch
        uses: actions/checkout@v4
        with:
          ref: codex/metabloom-emote-protocol

      - name: Verify repository invariants
        shell: bash
        run: |
          set -euo pipefail
          test -f src/components/metabloomProtocol.json
          test -f src/components/metabloomEmoteLibrary.js
          test -f src/components/metabloomEmoteProtocol.js
          test -f src/components/metabloomDemoResponses.js
          test -f src/components/metabloomApiClient.js
          test -f api/metabloom.js
          test -f docs/examples/metabloom.env.example
          test -f scripts/test-metabloom-api.mjs
          ! grep -R "REACT_APP_OPENAI" -n src public api scripts docs
          grep -q 'allowMultiple: false' src/components/OrbSection.js
          grep -q 'parseMetabloomEmoteEnvelope' src/components/OrbSection.js
          grep -q 'playEmoteSegments' src/components/OrbSection.js
          grep -q 'actionId === "reform"' src/components/CreatorOSFieldCanvas.js
          node --check api/metabloom.js
          node --check scripts/test-metabloom-api.mjs

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Run complete test suite
        run: npm test -- --watchAll=false --runInBand
        env:
          CI: true

      - name: Build production bundle
        run: npm run build
        env:
          CI: true

      - name: Record successful verification
        shell: bash
        run: |
          cat > docs/architecture/metabloom-emote-protocol-validation.md <<EOF
          # Metabloom emote protocol validation

          Verified source commit: \`${GITHUB_SHA}\`

          - Repository invariants: passed
          - JavaScript syntax checks: passed
          - ESLint: passed
          - Complete Jest suite: passed
          - Production build: passed
          - Browser API key exposure guard: passed
          - Reduced-motion neutral-pose guard: passed
          - One-emote ordinary response guard: passed
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/verify-metabloom-emote-protocol.yml
          git add docs/architecture/metabloom-emote-protocol-validation.md
          git diff --cached --check
          git commit -m "Record Metabloom emote protocol validation"
          git push origin "HEAD:${GITHUB_REF_NAME}"
