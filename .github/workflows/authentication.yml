name: Site authentication
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: site-authentication-${{ github.ref }}
  cancel-in-progress: true
jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: [20, 24]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run test:auth
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
        env:
          CI: true
          AUTH0_CLIENT_SECRET: server-only-build-canary-not-a-credential
      - name: Verify server configuration is not emitted into browser files
        run: |
          if grep -R -l 'server-only-build-canary-not-a-credential' build/; then exit 1; fi
          test -f middleware.js
          test -f build/invoice-generator/index.html
      - name: Check login, logout, expiry lock, draft recovery and responsive account UI
        run: node scripts/verify-auth-ui.mjs
        env:
          VISUAL_CAPTURE_BROWSER: /usr/bin/google-chrome
      - name: Check desktop account errors, scrolling, resizing and navigation clearance
        run: node scripts/verify-auth-layout.mjs
        env:
          VISUAL_CAPTURE_BROWSER: /usr/bin/google-chrome
      - name: Check embedded login navigation and both shader paths with software WebGL
        run: node scripts/verify-login-section.mjs
        env:
          VISUAL_CAPTURE_BROWSER: /usr/bin/google-chrome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: auth-ui-evidence
          path: |
            auth-ui-evidence/
            auth-layout-evidence/
            login-section-evidence/
          if-no-files-found: ignore
          retention-days: 7
