name: Contact layout
on:
  pull_request:
    paths:
      - 'src/components/ContactSection*'
      - 'src/App.js'
      - 'src/index.css'
      - 'src/aetheris-site.css'
      - 'scripts/verify-contact-layout.mjs'
      - '.github/workflows/contact-layout.yml'
  push:
    branches: [main]
    paths:
      - 'src/components/ContactSection*'
      - 'src/App.js'
      - 'src/index.css'
      - 'src/aetheris-site.css'
      - 'scripts/verify-contact-layout.mjs'
      - '.github/workflows/contact-layout.yml'
permissions:
  contents: read
concurrency:
  group: contact-layout-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser-layout:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
        env:
          CI: true
      - name: Verify complete form in the built application
        run: node --experimental-websocket scripts/verify-contact-layout.mjs
      - name: Preserve layout measurements and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contact-layout-${{ github.sha }}
          path: contact-layout-evidence/*
          retention-days: 7
