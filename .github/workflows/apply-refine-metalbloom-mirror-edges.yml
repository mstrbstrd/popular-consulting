name: Apply Metalbloom mirror and edge refinement

on:
  push:
    branches:
      - agent/refine-metalbloom-mirror-edges
    paths:
      - .github/workflows/apply-refine-metalbloom-mirror-edges.yml

permissions:
  contents: write

jobs:
  refine-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/refine-metalbloom-mirror-edges
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply focused Metalbloom refinement
        run: python scripts/apply_refine_metalbloom_mirror_edges.py

      - name: Verify patch whitespace
        run: git diff --check

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test -- --watchAll=false --runInBand
        env:
          CI: true

      - name: Build production bundle
        run: npm run build
        env:
          CI: true

      - name: Commit and push the refinement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/components/CreatorOSFieldShader.js \
            src/components/CreatorOSFieldCanvas.css \
            src/components/MetalbloomTheme.test.js
          git rm -f \
            .github/workflows/apply-refine-metalbloom-mirror-edges.yml \
            scripts/apply_refine_metalbloom_mirror_edges.py
          git commit -m "Refine Metalbloom mirror reflections and spectral edges"
          git push origin HEAD:agent/refine-metalbloom-mirror-edges
