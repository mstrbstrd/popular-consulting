name: Finalize and verify Metabloom emote protocol

on:
  push:
    branches:
      - codex/metabloom-emote-protocol

permissions:
  contents: write

concurrency:
  group: metabloom-emote-protocol
  cancel-in-progress: false

jobs:
  finalize-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out emote protocol branch
        uses: actions/checkout@v4
        with:
          ref: codex/metabloom-emote-protocol

      - name: Apply staged implementation when needed
        shell: bash
        run: |
          if [ ! -f src/components/metabloomEmoteProtocol.js ]; then
            test -f scripts/apply_metabloom_emote_protocol.py
            python scripts/apply_metabloom_emote_protocol.py
          fi

      - name: Finalize protocol invariants
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          root = Path.cwd()
          required = [
              "api/metabloom.js",
              "docs/architecture/metabloom-emote-protocol.md",
              "src/components/metabloomApiClient.js",
              "src/components/metabloomDemoResponses.js",
              "src/components/metabloomEmoteLibrary.js",
              "src/components/metabloomEmoteProtocol.js",
              "src/components/metabloomProtocol.json",
          ]
          missing = [path for path in required if not (root / path).is_file()]
          if missing:
              raise SystemExit(f"Missing Metabloom protocol files: {missing}")

          protocol = json.loads(
              (root / "src/components/metabloomProtocol.json").read_text()
          )
          expected_emotes = [
              "neutral",
              "warm",
              "whimsy",
              "reflective",
              "curious",
              "reassuring",
              "concerned",
              "celebratory",
              "resolute",
          ]
          actual_emotes = [entry["id"] for entry in protocol["emotes"]]
          if actual_emotes != expected_emotes:
              raise SystemExit(
                  f"Unexpected emote enum: {actual_emotes}"
              )
          if protocol["maxSegments"] != 4:
              raise SystemExit("Metabloom segment bound changed unexpectedly.")

          orb_path = root / "src/components/OrbSection.js"
          orb = orb_path.read_text()
          send_marker = '''  const sendMessage = React.useCallback(
            (value) => {
              if (pending) return false;
          '''
          send_replacement = '''  const sendMessage = React.useCallback(
            (value) => {
              if (pending) return false;
              cancelResponseSegmentTimer();
          '''
          if send_marker in orb and "cancelResponseSegmentTimer();" not in orb[
              orb.index(send_marker):orb.index(send_marker) + 260
          ]:
              orb = orb.replace(send_marker, send_replacement, 1)

          dependency_candidates = [
              "    [appendMessage, pending, performAction, performEmote, receiveModelResponse],",
              "    [appendMessage, pending, performAction, receiveModelResponse],",
          ]
          for candidate in dependency_candidates:
              if candidate in orb:
                  replacement = candidate.replace(
                      "[appendMessage, ",
                      "[appendMessage, cancelResponseSegmentTimer, ",
                  )
                  orb = orb.replace(candidate, replacement, 1)
                  break

          required_orb_fragments = [
              "parseMetabloomEmoteEnvelope",
              "playEmoteSegments",
              "requestMetabloomResponse",
              "createMetabloomDemoEnvelope",
              "cancelResponseSegmentTimer",
          ]
          for fragment in required_orb_fragments:
              if fragment not in orb:
                  raise SystemExit(f"OrbSection is missing {fragment}")
          if 'playSequence(parsed.value.actionChain, "model-response")' in orb:
              raise SystemExit("Current model responses still use animation chains.")
          orb_path.write_text(orb)

          canvas_path = root / "src/components/CreatorOSFieldCanvas.js"
          canvas = canvas_path.read_text()
          action_phase = re.search(
              r"const\s+actionPhase\s*=\s*(.*?);",
              canvas,
              flags=re.S,
          )
          if action_phase:
              expression = action_phase.group(1)
              if "actionVersion" in expression and "0.5" in expression:
                  if 'actionId === "reform"' not in expression:
                      expression = re.sub(
                          r"(\?\s*)actionVersion\s*>\s*0\s*\?\s*0\.5\s*:\s*1",
                          r'\1actionId === "reform" ? 1 : actionVersion > 0 ? 0.5 : 1',
                          expression,
                          count=1,
                      )
                      canvas = (
                          canvas[:action_phase.start(1)]
                          + expression
                          + canvas[action_phase.end(1):]
                      )
                      canvas_path.write_text(canvas)

          integration_test = root / "src/components/MetabloomEmoteIntegration.test.js"
          if integration_test.is_file():
              source = integration_test.read_text()
              assertion = 'expect(source).toContain("cancelResponseSegmentTimer");'
              if assertion not in source:
                  source = source.replace(
                      'expect(source).toContain("requestMetabloomResponse");',
                      'expect(source).toContain("requestMetabloomResponse");\n'
                      '        expect(source).toContain("cancelResponseSegmentTimer");',
                      1,
                  )
                  integration_test.write_text(source)

          vercel_path = root / "vercel.json"
          vercel = json.loads(vercel_path.read_text())
          function_config = vercel.setdefault("functions", {}).setdefault(
              "api/metabloom.js", {}
          )
          function_config["maxDuration"] = 30
          vercel_path.write_text(json.dumps(vercel, indent=2) + "\n")
          PY

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Run complete test suite
        run: npm test -- --watchAll=false --runInBand
        env:
          CI: true

      - name: Build production bundle
        run: npm run build
        env:
          CI: true

      - name: Commit verified implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f --ignore-unmatch scripts/apply_metabloom_emote_protocol.py
          git rm -f --ignore-unmatch scripts/metabloom-imperative-state.patch.gz.b64
          git rm -f --ignore-unmatch .github/workflows/finalize-metabloom-emote-protocol.yml
          git rm -f --ignore-unmatch .github/workflows/apply-metabloom-emote-protocol.yml
          git rm -f --ignore-unmatch .github/workflows/export-metabloom-source.yml
          git rm -f --ignore-unmatch .github/workflows/dispatch-metabloom-state-fix.yml
          git rm -f --ignore-unmatch .github/workflows/fix-metabloom-imperative-state.yml
          git add -A
          git diff --cached --check
          git commit -m "Implement Metabloom emote response protocol"
          git push origin "HEAD:${GITHUB_REF_NAME}"
