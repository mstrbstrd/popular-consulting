name: Authentication preparation
on:
  push:
    branches: [feat/site-authentication]
    paths: [.github/workflows/auth-preparation.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve maintained authentication and build dependencies
        run: |
          npm install --save-exact openid-client@6 @vercel/functions@3 --no-audit --no-fund
          npm install --save-dev --save-exact esbuild@0.28 --no-audit --no-fund
          npm ls openid-client @vercel/functions esbuild
      - name: Package source and local test dependencies, never environment secrets
        run: |
          tar -czf auth-development.tar.gz src public server api scripts docs package.json package-lock.json node_modules vercel.json CLAUDE.md .github/workflows .gitattributes .gitignore
      - uses: actions/upload-artifact@v4
        with:
          name: auth-development
          path: auth-development.tar.gz
          retention-days: 1
