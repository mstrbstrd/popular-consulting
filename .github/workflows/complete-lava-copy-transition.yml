name: Complete Lava Lamp copy transition

on:
  push:
    branches:
      - agent/scroll-driven-dither-narrative
    paths:
      - .github/workflows/complete-lava-copy-transition.yml

permissions:
  contents: write

jobs:
  complete:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/scroll-driven-dither-narrative
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Animate copy while preserving the native wax entrance
        shell: python
        run: |
          from pathlib import Path

          page_path = Path("src/components/DitherCanvasPage.js")
          page = page_path.read_text(encoding="utf-8")
          start = page.index('      if (entranceStyle === "native") {')
          end_marker = '      setTransitionPhase("entering");'
          end = page.index(end_marker, start) + len(end_marker)
          replacement = '''      setTransitionStyle(
            entranceStyle === "native" ? nextStudy.id : entranceStyle,
          );
          setTransitionPhase("entering");'''
          page_path.write_text(
              page[:start] + replacement + page[end:],
              encoding="utf-8",
          )

          css_path = Path("src/components/DitherScrollNarrative.css")
          css = css_path.read_text(encoding="utf-8")
          selector_anchor = '''.dither-copy.is-exiting[data-transition="lava-lamp"] {
            animation-name: dither-copy-lava-exit;
          }
          '''
          selector_addition = selector_anchor + '''
          .dither-copy.is-entering[data-transition="lava-lamp"] {
            animation-name: dither-copy-lava-enter;
          }
          '''
          if css.count(selector_anchor) != 1:
              raise SystemExit("Expected one Lava Lamp copy exit selector.")
          css = css.replace(selector_anchor, selector_addition)

          keyframe_anchor = '''@keyframes dither-copy-lava-exit {
            to { opacity: 0; transform: translateY(5rem) scale(0.94); filter: blur(0.7rem); }
          }
          '''
          keyframe_addition = '''@keyframes dither-copy-lava-enter {
            from {
              opacity: 0;
              transform: translateY(3.8rem) scale(0.96);
              filter: blur(0.8rem) saturate(1.25);
            }
            to {
              opacity: 1;
              transform: translateY(var(--dither-copy-drift, 0px)) scale(1);
              filter: blur(0) saturate(1);
            }
          }

          ''' + keyframe_anchor
          if css.count(keyframe_anchor) != 1:
              raise SystemExit("Expected one Lava Lamp copy exit keyframe.")
          css_path.write_text(
              css.replace(keyframe_anchor, keyframe_addition),
              encoding="utf-8",
          )

          test_path = Path("src/components/DitherScrollNarrative.test.js")
          tests = test_path.read_text(encoding="utf-8")
          old_assertion = '''    expect(narrativeStyles).not.toContain(
              'is-entering[data-transition="lava-lamp"]',
            );'''
          new_assertion = '''    expect(narrativeStyles).not.toContain(
              '.dither-study-scene.is-entering[data-transition="lava-lamp"]',
            );
            expect(narrativeStyles).toContain(
              '.dither-copy.is-entering[data-transition="lava-lamp"]',
            );'''
          if tests.count(old_assertion) != 1:
              raise SystemExit("Expected one Lava Lamp native entrance assertion.")
          test_path.write_text(
              tests.replace(old_assertion, new_assertion),
              encoding="utf-8",
          )

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test -- --watchAll=false --runInBand
        env:
          CI: true

      - name: Build production bundle
        run: npm run build
        env:
          CI: true

      - name: Commit the completed transition
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/components/DitherCanvasPage.js \
            src/components/DitherScrollNarrative.css \
            src/components/DitherScrollNarrative.test.js
          git rm \
            .github/workflows/complete-lava-copy-transition.yml \
            .github/workflows/refine-lava-copy-transition.yml
          git commit -m "Animate Lava Lamp copy without replacing its native entrance"
          git push origin HEAD:agent/scroll-driven-dither-narrative
