name: Apply Metalbloom inner reflection polish

on:
  push:
    branches:
      - agent/smooth-metalbloom-inner-reflection
    paths:
      - .github/workflows/apply-metalbloom-inner-reflection-polish.yml

permissions:
  contents: write

jobs:
  refine-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/smooth-metalbloom-inner-reflection
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply Metalbloom reflection polish
        run: python scripts/apply_metalbloom_inner_reflection_polish.py

      - name: Verify patch whitespace
        run: git diff --check

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test -- --watchAll=false --runInBand
        env:
          CI: true

      - name: Build production bundle
        run: npm run build
        env:
          CI: true

      - name: Commit and push the refinement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/components/CreatorOSFieldShader.js \
            src/components/MetalbloomTheme.test.js
          git rm -f \
            .github/workflows/apply-metalbloom-inner-reflection-polish.yml \
            scripts/apply_metalbloom_inner_reflection_polish.py
          git commit -m "Soften Metalbloom inner reflection"
          git push origin HEAD:agent/smooth-metalbloom-inner-reflection
