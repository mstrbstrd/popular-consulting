name: Apply Metalbloom inner reflection polish

on:
  push:
    branches:
      - agent/smooth-metalbloom-inner-reflection
    paths:
      - .github/workflows/apply-metalbloom-inner-reflection-polish.yml

permissions:
  contents: write

jobs:
  refine-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/smooth-metalbloom-inner-reflection
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply Metalbloom reflection polish
        run: python scripts/apply_metalbloom_inner_reflection_polish.py

      - name: Update existing Metalbloom regression expectations
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/components/MetalbloomTheme.test.js")
          source = path.read_text(encoding="utf-8")

          old_slope = '"vec2 metalSlope = vec2(dFdx(materialField)"'
          new_slope = '"vec2 metalSlope = vec2("'
          if source.count(old_slope) != 1:
              raise SystemExit("Expected one legacy metal slope assertion.")
          source = source.replace(old_slope, new_slope, 1)

          old_edge = "fwidth(materialField) * 0.68"
          new_edge = "fwidth(metalSurfaceField) * 0.68"
          if source.count(old_edge) != 1:
              raise SystemExit("Expected one legacy Metalbloom edge assertion.")
          source = source.replace(old_edge, new_edge, 1)

          path.write_text(source, encoding="utf-8")
          PY

      - name: Verify patch whitespace
        run: git diff --check

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test -- --watchAll=false --runInBand
        env:
          CI: true

      - name: Build production bundle
        run: npm run build
        env:
          CI: true

      - name: Commit and push the refinement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/components/CreatorOSFieldShader.js \
            src/components/MetalbloomTheme.test.js
          git rm -f \
            .github/workflows/apply-metalbloom-inner-reflection-polish.yml \
            scripts/apply_metalbloom_inner_reflection_polish.py
          git commit -m "Soften Metalbloom inner reflection"
          git push origin HEAD:agent/smooth-metalbloom-inner-reflection
