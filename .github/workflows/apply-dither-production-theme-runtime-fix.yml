name: Apply dither production theme runtime fix

on:
  push:
    branches:
      - fix/dither-production-theme-runtime-20260901

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dither-production-theme-runtime-20260901
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply guarded fix
        run: python scripts/fix_dither_production_theme_runtime.py
      - name: Check whitespace
        run: git diff --check
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test -- --watchAll=false --runInBand
        env:
          CI: true
      - name: Build
        run: npm run build
        env:
          CI: true
      - name: Commit verified source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/fix_dither_production_theme_runtime.py
          git rm .github/workflows/apply-dither-production-theme-runtime-fix.yml
          git add src/components/DitherCanvasPage.js src/components/DitherCanvasPage.test.js
          git diff --cached --check
          git commit -m "Fix dither production themes and rename studies"
          git push origin "HEAD:${GITHUB_REF_NAME}"
