name: Nova fluid refinement review
on:
  push:
    branches: [work/nova-fluid-refinement]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Run all tests and record results
        run: npm test -- --watchAll=false --runInBand --json --outputFile=/tmp/nova-tests.json || test -s /tmp/nova-tests.json
        env:
          CI: true
      - name: Check for new failures against the unchanged baseline
        run: |
          git fetch --depth=1 origin 828f9c3f0303826016f00b414bb9c7e576e12b7e
          git worktree add --detach /tmp/nova-baseline 828f9c3f0303826016f00b414bb9c7e576e12b7e
          ln -s "$PWD/node_modules" /tmp/nova-baseline/node_modules
          (cd /tmp/nova-baseline && npm test -- --watchAll=false --runInBand --runTestsByPath src/components/InvoiceGeneratorNavigation.test.js --json --outputFile=/tmp/nova-baseline-tests.json) || test -s /tmp/nova-baseline-tests.json
          node - <<'NODE'
          const fs = require('fs');
          const assert = require('node:assert/strict');
          const current = JSON.parse(fs.readFileSync('/tmp/nova-tests.json'));
          const baseline = JSON.parse(fs.readFileSync('/tmp/nova-baseline-tests.json'));
          const failures = report => report.testResults.flatMap(suite => suite.assertionResults.filter(test => test.status === 'failed').map(test => test.fullName)).sort();
          assert.equal(current.numRuntimeErrorTestSuites, 0);
          assert.equal(current.numPendingTests, 0);
          assert(current.numPassedTests >= 1010);
          assert(current.numFailedTests <= 1);
          if (current.numFailedTests) {
            assert.deepEqual(failures(current), failures(baseline));
            assert(failures(current)[0].includes('mobile menu isolates the invoice'));
          }
          console.log(JSON.stringify({passed:current.numPassedTests,failed:current.numFailedTests,newFailures:0,baselineFailures:failures(baseline)}));
          NODE
        env:
          CI: true
      - name: Production build
        run: npm run build
        env:
          CI: true
      - name: Browser prerequisites
        run: |
          npm install --prefix /tmp/nova-browser --no-audit --no-fund --ignore-scripts playwright@1.56.1
          /tmp/nova-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Native fire browser regressions
        run: node scripts/verify-nova-fire.mjs
        env:
          NODE_PATH: /tmp/nova-browser/node_modules
      - name: Upload rendered evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nova-fluid-review
          path: nova-review
          if-no-files-found: ignore
