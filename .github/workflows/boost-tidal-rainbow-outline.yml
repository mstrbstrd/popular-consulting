name: Boost Tidal Weave rainbow outline

on:
  push:
    branches:
      - agent/light-tidal-caustics
    paths:
      - .github/workflows/boost-tidal-rainbow-outline.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/light-tidal-caustics
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Increase the thin spectral outline without darkening caustics
        shell: python
        run: |
          from pathlib import Path

          shader_path = Path("src/components/CreatorOSFieldShader.js")
          shader = shader_path.read_text(encoding="utf-8")

          old_shader = '''vec3 spectralOutlineTint = causticGray * 0.70
            + spectralTint * 0.58;
          waterTint = mix(
            waterTint,
            spectralOutlineTint,
            spectralOutline * 0.78
          );'''

          new_shader = '''// Increase the outline by roughly fifteen percent while keeping every
          // channel above a pale-gray floor. Dark mode receives a slightly
          // stronger chroma and blend so the rainbow remains visible there.
          float outlineChroma = mix(0.48, 0.42, u_light);
          float outlineFloor = mix(0.70, 0.78, u_light);
          vec3 spectralOutlineTint = mix(
            vec3(0.96),
            spectralTint,
            outlineChroma
          );
          spectralOutlineTint = max(
            spectralOutlineTint,
            vec3(outlineFloor)
          );
          float spectralOutlineStrength = mix(0.92, 0.90, u_light);
          waterTint = mix(
            waterTint,
            spectralOutlineTint,
            spectralOutline * spectralOutlineStrength
          );'''

          if shader.count(old_shader) != 1:
              raise SystemExit("Expected exactly one Tidal Weave spectral outline block.")

          shader_path.write_text(
              shader.replace(old_shader, new_shader),
              encoding="utf-8",
          )

          test_path = Path("src/components/CreatorOSFieldCanvas.test.js")
          test_source = test_path.read_text(encoding="utf-8")

          old_test = '''    expect(tidalScene).toContain("vec3 spectralOutlineTint");
              expect(tidalScene).toContain(
                "waterTint = mix(causticGray, refractedLight, causticLift)",
              );
              expect(tidalScene).toContain("spectralOutline * 0.78");'''

          new_test = '''    expect(tidalScene).toContain("vec3 spectralOutlineTint");
              expect(tidalScene).toContain("float outlineChroma");
              expect(tidalScene).toContain("mix(0.48, 0.42, u_light)");
              expect(tidalScene).toContain("float outlineFloor");
              expect(tidalScene).toContain("mix(0.70, 0.78, u_light)");
              expect(tidalScene).toContain("float spectralOutlineStrength");
              expect(tidalScene).toContain("mix(0.92, 0.90, u_light)");
              expect(tidalScene).toContain(
                "spectralOutline * spectralOutlineStrength",
              );
              expect(tidalScene).toContain(
                "waterTint = mix(causticGray, refractedLight, causticLift)",
              );'''

          if test_source.count(old_test) != 1:
              raise SystemExit("Expected exactly one Tidal Weave outline test block.")

          test_path.write_text(
              test_source.replace(old_test, new_test),
              encoding="utf-8",
          )

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test -- --watchAll=false --runInBand
        env:
          CI: true

      - name: Build production bundle
        run: npm run build
        env:
          CI: true

      - name: Commit and push the refinement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/components/CreatorOSFieldShader.js \
            src/components/CreatorOSFieldCanvas.test.js
          git rm .github/workflows/boost-tidal-rainbow-outline.yml
          git commit -m "Boost Tidal Weave rainbow outline"
          git push origin HEAD:agent/light-tidal-caustics
