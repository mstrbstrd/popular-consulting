name: Validate embedded login section
on:
  push:
    branches: [work/login-section-20260922]
    paths:
      - src/**
      - scripts/verify-auth-*.mjs
      - .github/workflows/integrate-login-section.yml
permissions:
  contents: read
concurrency:
  group: embedded-login-validation
  cancel-in-progress: true
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
      VISUAL_CAPTURE_BROWSER: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: git diff --check
      - run: npm ci --no-audit --no-fund
      - id: lint
        continue-on-error: true
        run: npm run lint
      - id: tests
        continue-on-error: true
        run: |
          set +e
          npm test -- --watchAll=false --runInBand > login-unit-tests.log 2>&1
          result=$?
          grep -A 45 '^FAIL ' login-unit-tests.log || true
          tail -30 login-unit-tests.log
          exit $result
      - id: auth
        continue-on-error: true
        run: npm run test:auth
      - id: build
        continue-on-error: true
        run: npm run build
      - id: browser
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: node scripts/verify-auth-ui.mjs
      - id: layout
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          set +e
          node scripts/verify-auth-layout.mjs > login-layout.log 2>&1
          result=$?
          node -e "const r=require('./auth-layout-evidence/report.json');console.log(JSON.stringify({reports:r.reports.map(({width,height,theme,failures,checks})=>({width,height,theme,failures,checks})),errors:r.errors}))"
          if [ "$result" -ne 0 ]; then tail -25 login-layout.log; fi
          exit $result
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: embedded-login-validation
          path: |
            auth-ui-evidence/
            auth-layout-evidence/
            login-unit-tests.log
            login-layout.log
          if-no-files-found: ignore
          retention-days: 3
      - name: Require all validation gates
        if: always()
        env:
          LINT: ${{ steps.lint.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          AUTH: ${{ steps.auth.outcome }}
          BUILD: ${{ steps.build.outcome }}
          BROWSER: ${{ steps.browser.outcome }}
          LAYOUT: ${{ steps.layout.outcome }}
        run: |
          printf 'lint=%s tests=%s auth=%s build=%s browser=%s layout=%s\n' "$LINT" "$TESTS" "$AUTH" "$BUILD" "$BROWSER" "$LAYOUT"
          test "$LINT" = success && test "$TESTS" = success && test "$AUTH" = success && test "$BUILD" = success && test "$BROWSER" = success && test "$LAYOUT" = success
