name: Nova balance review
on:
  push:
    branches: [work/nova-balanced-fire]
permissions:
  contents: read
concurrency:
  group: nova-balance-review
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 4
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Record complete regression results
        run: npm test -- --watchAll=false --runInBand --json --outputFile=/tmp/nova-tests.json || test -s /tmp/nova-tests.json
        env:
          CI: true
      - name: Reject all new failures against the unchanged baseline
        run: |
          git worktree add --detach /tmp/nova-baseline 3dac97bc1aab97091b31c191005090fa89518bdd
          ln -s "$PWD/node_modules" /tmp/nova-baseline/node_modules
          (cd /tmp/nova-baseline && npm test -- --watchAll=false --runInBand --runTestsByPath src/components/InvoiceGeneratorNavigation.test.js --json --outputFile=/tmp/nova-baseline-tests.json) || test -s /tmp/nova-baseline-tests.json
          node - <<'NODE'
          const fs = require('fs');
          const assert = require('node:assert/strict');
          const current = JSON.parse(fs.readFileSync('/tmp/nova-tests.json'));
          const baseline = JSON.parse(fs.readFileSync('/tmp/nova-baseline-tests.json'));
          const failures = report => report.testResults.flatMap(suite => suite.assertionResults.filter(test => test.status === 'failed').map(test => test.fullName)).sort();
          assert.equal(current.numRuntimeErrorTestSuites, 0);
          assert.equal(current.numPendingTests, 0);
          assert(current.numPassedTests >= 1015);
          assert(current.numFailedTests <= 1);
          if(current.numFailedTests) {
            assert.deepEqual(failures(current),failures(baseline));
            assert(failures(current)[0].includes('mobile menu isolates the invoice'));
          }
          const result = {passed:current.numPassedTests,failed:current.numFailedTests,newFailures:0,baselineFailures:failures(baseline)};
          fs.mkdirSync('nova-review',{recursive:true});
          fs.writeFileSync('nova-review/test-summary.json',JSON.stringify(result,null,2));
          console.log(JSON.stringify(result));
          NODE
        env:
          CI: true
      - name: Production build
        run: npm run build
        env:
          CI: true
      - name: Browser prerequisites
        run: |
          npm install --prefix /tmp/nova-browser --no-audit --no-fund --ignore-scripts playwright@1.56.1
          /tmp/nova-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Native fire lifecycle and floating-body checks
        run: |
          node scripts/verify-nova-fire.mjs > /tmp/nova-lifecycle.log 2>&1 || { tail -c 6000 /tmp/nova-lifecycle.log; exit 1; }
          grep '^{' /tmp/nova-lifecycle.log
          node scripts/verify-nova-floating.mjs
          node scripts/verify-nova-balance.mjs
        env:
          NODE_PATH: /tmp/nova-browser/node_modules
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nova-balanced-review
          path: nova-review
          if-no-files-found: ignore
