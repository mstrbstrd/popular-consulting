name: Refine Lava Lamp copy entrance

on:
  push:
    branches:
      - agent/scroll-driven-dither-narrative
    paths:
      - .github/workflows/refine-lava-copy-transition.yml

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/scroll-driven-dither-narrative
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Preserve the native wax entrance while animating its copy
        shell: python
        run: |
          from pathlib import Path

          page_path = Path("src/components/DitherCanvasPage.js")
          page = page_path.read_text(encoding="utf-8")
          old_logic = '''      if (entranceStyle === "native") {
            setTransitionStyle("native");
            setTransitionPhase("idle");
            setTransitionTargetIndex(null);
            return;
          }

          setTransitionStyle(entranceStyle);
          setTransitionPhase("entering");'''
          new_logic = '''      setTransitionStyle(
            entranceStyle === "native" ? nextStudy.id : entranceStyle,
          );
          setTransitionPhase("entering");'''
          if page.count(old_logic) != 1:
              raise SystemExit("Lava Lamp native entrance logic changed unexpectedly.")
          page_path.write_text(
              page.replace(old_logic, new_logic),
              encoding="utf-8",
          )

          css_path = Path("src/components/DitherScrollNarrative.css")
          css = css_path.read_text(encoding="utf-8")
          old_selector = '''.dither-copy.is-exiting[data-transition="lava-lamp"] {
            animation-name: dither-copy-lava-exit;
          }

          /* Morphogen Divide separates like a living membrane. */'''
          new_selector = '''.dither-copy.is-exiting[data-transition="lava-lamp"] {
            animation-name: dither-copy-lava-exit;
          }

          .dither-copy.is-entering[data-transition="lava-lamp"] {
            animation-name: dither-copy-lava-enter;
          }

          /* Morphogen Divide separates like a living membrane. */'''
          if css.count(old_selector) != 1:
              raise SystemExit("Lava Lamp copy selector changed unexpectedly.")
          css = css.replace(old_selector, new_selector)

          old_keyframe = '''@keyframes dither-copy-lava-exit {
            to { opacity: 0; transform: translateY(5rem) scale(0.94); filter: blur(0.7rem); }
          }

          @keyframes dither-copy-morphogen-exit {'''
          new_keyframe = '''@keyframes dither-copy-lava-enter {
            from {
              opacity: 0;
              transform: translateY(3.8rem) scale(0.96);
              filter: blur(0.8rem) saturate(1.25);
            }
            to {
              opacity: 1;
              transform: translateY(var(--dither-copy-drift, 0px)) scale(1);
              filter: blur(0) saturate(1);
            }
          }

          @keyframes dither-copy-lava-exit {
            to { opacity: 0; transform: translateY(5rem) scale(0.94); filter: blur(0.7rem); }
          }

          @keyframes dither-copy-morphogen-exit {'''
          if css.count(old_keyframe) != 1:
              raise SystemExit("Lava Lamp copy keyframe changed unexpectedly.")
          css_path.write_text(
              css.replace(old_keyframe, new_keyframe),
              encoding="utf-8",
          )

          test_path = Path("src/components/DitherScrollNarrative.test.js")
          tests = test_path.read_text(encoding="utf-8")
          old_assertion = '''    expect(narrativeStyles).not.toContain(
              'is-entering[data-transition="lava-lamp"]',
            );'''
          new_assertion = '''    expect(narrativeStyles).not.toContain(
              '.dither-study-scene.is-entering[data-transition="lava-lamp"]',
            );
            expect(narrativeStyles).toContain(
              '.dither-copy.is-entering[data-transition="lava-lamp"]',
            );'''
          if tests.count(old_assertion) != 1:
              raise SystemExit("Lava Lamp transition assertion changed unexpectedly.")
          test_path.write_text(
              tests.replace(old_assertion, new_assertion),
              encoding="utf-8",
          )

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test -- --watchAll=false --runInBand
        env:
          CI: true

      - name: Build production bundle
        run: npm run build
        env:
          CI: true

      - name: Commit the copy transition refinement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/components/DitherCanvasPage.js \
            src/components/DitherScrollNarrative.css \
            src/components/DitherScrollNarrative.test.js
          git rm .github/workflows/refine-lava-copy-transition.yml
          git commit -m "Animate Lava Lamp copy without replacing its native entrance"
          git push origin HEAD:agent/scroll-driven-dither-narrative
