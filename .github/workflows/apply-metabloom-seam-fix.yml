name: Apply Metabloom color seam fix

on:
  push:
    branches:
      - agent/fix-metabloom-color-seam
    paths:
      - .github/workflows/apply-metabloom-seam-fix.yml

permissions:
  contents: write

jobs:
  patch-shader:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-metabloom-color-seam
          fetch-depth: 0

      - name: Replace the polar hue seam with continuous flow
        shell: python
        run: |
          from pathlib import Path

          shader_path = Path("src/components/CreatorOSFieldShader.js")
          shader = shader_path.read_text(encoding="utf-8")

          scene_start = shader.index("vec4 sceneMetabloom")
          scene_end = shader.index("vec4 sceneTidalWeave", scene_start)
          hue_start = shader.index("  float baseHue = 0.70", scene_start, scene_end)
          material_start = shader.index(
              "  float materialField",
              hue_start,
              scene_end,
          )

          replacement = """  // A polar angle introduces a branch ray that Bayer quantization makes visible.
          // Build hue from continuous Cartesian and noise fields instead.
          float colorFlow = fbm(
            rotate2(0.48) * p * 1.42
              + vec2(time * 0.022, -time * 0.017)
              + vec2(u_seed * 4.1, -u_seed * 3.7)
          );
          float secondaryFlow = fbm(
            rotate2(-0.71) * p * 2.18
              + vec2(-time * 0.014, time * 0.019)
              + vec2(13.4, 7.9)
          );
          float baseHue = 0.70
            + p.x * 0.080
            + p.y * 0.135
            + (colorFlow - 0.5) * 0.26
            + (secondaryFlow - 0.5) * 0.10
            + potential * 0.040
            + membrane * 0.035
            + time * 0.018
            + u_seed * 0.13;

          vec3 tint = tintAccumulator / max(potential, 0.0001);
          vec3 flowTint = spectral(baseHue);
          float flowDominance = 0.76 + membrane * 0.10;
          tint = mix(tint, flowTint, sat(flowDominance));
          """

          shader_path.write_text(
              shader[:hue_start] + replacement + shader[material_start:],
              encoding="utf-8",
          )

      - name: Commit shader correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/CreatorOSFieldShader.js
          git commit -m "Remove Metabloom polar color seam"
          git push origin HEAD:agent/fix-metabloom-color-seam
