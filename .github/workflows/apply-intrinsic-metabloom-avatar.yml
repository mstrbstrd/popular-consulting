name: Apply intrinsic Metabloom avatar

on:
  push:
    branches:
      - feature/intrinsic-metabloom-avatar-20260903

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/intrinsic-metabloom-avatar-20260903

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Decode guarded patch
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import gzip
          from pathlib import Path

          payload = Path("scripts/apply_intrinsic_metabloom_avatar.py.gz.b64")
          target = Path("scripts/apply_intrinsic_metabloom_avatar.py")
          target.write_bytes(
              gzip.decompress(base64.b64decode(payload.read_text().strip()))
          )

          content = target.read_text()
          start_marker = "shader = replace_once(\n    shader,\n    '''    tintAccumulator += spectral("
          end_marker = "    'shader chameleon lobe color',\n)"
          start = content.find(start_marker)
          end = content.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit(
                  "Decoded patch did not contain the chameleon replacement boundary"
              )
          end += len(end_marker)
          replacement = '''chameleon_old = \'\'\'    tintAccumulator += spectral(\\n      0.62 + layer * 0.137 + time * 0.012 + u_seed * 0.09\\n    ) * weight;\\n\'\'\'
chameleon_new = \'\'\'    vec3 nativeLayerTint = spectral(\\n      0.62 + layer * 0.137 + time * 0.012 + u_seed * 0.09\\n    );\\n    float avatarLayerPhase = fract(\\n      layer * 0.183\\n        + time * 0.017\\n        + avatarPhase * 0.31\\n    );\\n    vec3 avatarLayerTint = avatarLayerPhase < 0.5\\n      ? mix(u_avatarColorA, u_avatarColorB, avatarLayerPhase * 2.0)\\n      : mix(\\n          u_avatarColorB,\\n          u_avatarColorC,\\n          (avatarLayerPhase - 0.5) * 2.0\\n        );\\n    float layerColorMix = avatarColorMix\\n      * (0.72 + 0.20 * sin(layer * 1.7 + time * 0.9));\\n    tintAccumulator += mix(\\n      nativeLayerTint,\\n      avatarLayerTint,\\n      sat(layerColorMix)\\n    ) * weight;\\n\'\'\'
if shader.count(chameleon_old) < 1:
    fail(\'shader chameleon lobe color: expected at least one match\')
shader = shader.replace(chameleon_old, chameleon_new, 1)'''
          target.write_text(content[:start] + replacement + content[end:])
          PY

      - name: Apply intrinsic shader architecture
        run: python scripts/apply_intrinsic_metabloom_avatar.py

      - name: Check whitespace
        run: git diff --check

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --watchAll=false --runInBand
        env:
          CI: true

      - name: Build production bundle
        run: npm run build
        env:
          CI: true

      - name: Commit verified source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f scripts/apply_intrinsic_metabloom_avatar.py
          git rm scripts/apply_intrinsic_metabloom_avatar.py.gz.b64
          git rm .github/workflows/apply-intrinsic-metabloom-avatar.yml
          git add -A
          git diff --cached --check
          git commit -m "Implement intrinsic Metabloom avatar physics"
          git push origin "HEAD:${GITHUB_REF_NAME}"
