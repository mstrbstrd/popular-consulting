name: Apply intrinsic Metabloom avatar

on:
  push:
    branches:
      - feature/intrinsic-metabloom-avatar-20260903

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/intrinsic-metabloom-avatar-20260903

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Decode migration
        shell: bash
        run: |
          base64 --decode scripts/apply_intrinsic_metabloom_avatar.py.gz.b64 \
            | gzip --decompress > scripts/apply_intrinsic_metabloom_avatar.py

      - name: Apply migration
        run: python scripts/apply_intrinsic_metabloom_avatar.py

      - name: Update intentional regression contracts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              file_path = Path(path)
              content = file_path.read_text()
              count = content.count(old)
              if count != 1:
                  raise SystemExit(
                      f"{label}: expected exactly one source match, found {count}"
                  )
              file_path.write_text(content.replace(old, new, 1))

          replace_once(
              "src/components/MorphogenPaintMode.test.js",
              'const ORIGINAL_FIELD_SHADER_SHA256 = "b6a9a6c403ac5d544e7209b56619ce4258aede17a44ffa7c0dae98037ebd1619";',
              'const ORGANISM_FIELD_SHADER_SHA256 = "87cda76012f099dfe8225d1aadb48ead5a68cf5eac07f7b98c839488f097640d";',
              "intrinsic field shader hash",
          )
          replace_once(
              "src/components/MorphogenPaintMode.test.js",
              'test("runs the byte-identical pre-paint renderer for Organism and keeps Sand Paint opt-in", () => {',
              'test("runs the pinned Organism renderer and keeps Sand Paint opt-in", () => {',
              "Organism renderer contract title",
          )
          replace_once(
              "src/components/MorphogenPaintMode.test.js",
              "ORIGINAL_FIELD_SHADER_SHA256,",
              "ORGANISM_FIELD_SHADER_SHA256,",
              "Organism renderer hash reference",
          )
          replace_once(
              "src/components/OrbSection.test.js",
              "/original Metabloom field remains visually intact/i",
              "/original Metabloom field is the avatar/i",
              "Orb explanatory copy contract",
          )
          PY

      - name: Check whitespace
        run: git diff --check

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --watchAll=false --runInBand
        env:
          CI: true

      - name: Build
        run: npm run build
        env:
          CI: true

      - name: Commit verified implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/apply_intrinsic_metabloom_avatar.py.gz.b64
          rm scripts/apply_intrinsic_metabloom_avatar.py
          git rm .github/workflows/apply-intrinsic-metabloom-avatar.yml
          git add .
          git diff --cached --check
          git commit -m "Move Metabloom avatar expression into the shader"
          git push origin "HEAD:${GITHUB_REF_NAME}"
