name: Apply intrinsic Metabloom avatar

on:
  push:
    branches:
      - feature/intrinsic-metabloom-avatar-20260903

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/intrinsic-metabloom-avatar-20260903

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Decode guarded patch
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import gzip
          from pathlib import Path

          payload = Path("scripts/apply_intrinsic_metabloom_avatar.py.gz.b64")
          target = Path("scripts/apply_intrinsic_metabloom_avatar.py")
          target.write_bytes(
              gzip.decompress(base64.b64decode(payload.read_text().strip()))
          )
          PY

      - name: Apply intrinsic shader architecture
        run: python scripts/apply_intrinsic_metabloom_avatar.py

      - name: Check whitespace
        run: git diff --check

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --watchAll=false --runInBand
        env:
          CI: true

      - name: Build production bundle
        run: npm run build
        env:
          CI: true

      - name: Commit verified source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f scripts/apply_intrinsic_metabloom_avatar.py
          git rm scripts/apply_intrinsic_metabloom_avatar.py.gz.b64
          git rm .github/workflows/apply-intrinsic-metabloom-avatar.yml
          git add -A
          git diff --cached --check
          git commit -m "Implement intrinsic Metabloom avatar physics"
          git push origin "HEAD:${GITHUB_REF_NAME}"
