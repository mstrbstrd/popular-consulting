name: Apply scroll-driven dither narrative

on:
  push:
    branches:
      - agent/scroll-driven-dither-narrative
    paths:
      - .github/workflows/apply-scroll-driven-dither.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/scroll-driven-dither-narrative
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Make Second Surface page-scroll controlled
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/components/RuptureCanvas.js")
          source = path.read_text(encoding="utf-8")

          def replace_once(label, old, new):
              global source
              count = source.count(old)
              if count != 1:
                  raise SystemExit(
                      f"{label}: expected exactly one patch target, found {count}."
                  )
              source = source.replace(old, new)

          replace_once(
              "controlled progress prop",
              "  paused = false,\n  resetVersion = 0,",
              "  paused = false,\n  progress: controlledProgress = null,\n  resetVersion = 0,",
          )

          replace_once(
              "controlled progress refs",
              "  const resetSimulationRef = useRef(() => {});\n"
              "  const animationFrameRef = useRef(0);",
              "  const resetSimulationRef = useRef(() => {});\n"
              "  const controlledProgressRef = useRef(\n"
              "    Number.isFinite(controlledProgress)\n"
              "      ? clamp(controlledProgress)\n"
              "      : null,\n"
              "  );\n"
              "  const syncControlledProgressRef = useRef(() => {});\n"
              "  const animationFrameRef = useRef(0);",
          )

          replace_once(
              "controlled progress effect",
              "  useEffect(() => {\n"
              "    resetSimulationRef.current();\n"
              "    forceRenderRef.current = true;\n"
              "  }, [resetVersion]);\n\n"
              "  useEffect(() => {\n"
              "    const root = rootRef.current;",
              "  useEffect(() => {\n"
              "    resetSimulationRef.current();\n"
              "    forceRenderRef.current = true;\n"
              "  }, [resetVersion]);\n\n"
              "  useEffect(() => {\n"
              "    controlledProgressRef.current = Number.isFinite(controlledProgress)\n"
              "      ? clamp(controlledProgress)\n"
              "      : null;\n"
              "    syncControlledProgressRef.current();\n"
              "    forceRenderRef.current = true;\n"
              "  }, [controlledProgress]);\n\n"
              "  useEffect(() => {\n"
              "    const root = rootRef.current;",
          )

          replace_once(
              "controlled progress synchronizer",
              "    const setTargetProgress = (nextProgress) => {\n"
              "      const next = clamp(nextProgress);\n"
              "      if (Math.abs(next - targetProgress) < 0.00001) return;\n"
              "      targetProgress = next;\n"
              "      forceRenderRef.current = true;\n"
              "    };\n\n"
              "    const updateOpening = (delta) => {",
              "    const setTargetProgress = (nextProgress) => {\n"
              "      const next = clamp(nextProgress);\n"
              "      if (Math.abs(next - targetProgress) < 0.00001) return;\n"
              "      targetProgress = next;\n"
              "      forceRenderRef.current = true;\n"
              "    };\n\n"
              "    const syncControlledProgress = () => {\n"
              "      if (controlledProgressRef.current === null) return;\n"
              "      setTargetProgress(controlledProgressRef.current);\n"
              "    };\n"
              "    syncControlledProgressRef.current = syncControlledProgress;\n"
              "    syncControlledProgress();\n\n"
              "    const updateOpening = (delta) => {",
          )

          replace_once(
              "controlled reset progress",
              "      progress = 0;\n"
              "      targetProgress = 0;\n"
              "      currentEnergy = 0;",
              "      const resetProgress = controlledProgressRef.current ?? 0;\n"
              "      progress = resetProgress;\n"
              "      targetProgress = resetProgress;\n"
              "      currentEnergy = smoothStep(resetProgress);",
          )

          replace_once(
              "controlled reset state",
              "      stateWasReported = false;\n"
              "      reportState(\"sealed\");",
              "      stateWasReported = false;\n"
              "      reportState(stateForProgress(resetProgress));",
          )

          replace_once(
              "wheel guard",
              "    const handleWheel = (event) => {\n"
              "      const deltaPixels = normalizeWheelDelta(event, height);",
              "    const handleWheel = (event) => {\n"
              "      if (controlledProgressRef.current !== null) return;\n"
              "      const deltaPixels = normalizeWheelDelta(event, height);",
          )

          replace_once(
              "pointer down guard",
              "    const handlePointerDown = (event) => {\n"
              "      syncPointer(event);\n"
              "      if (event.pointerType === \"mouse\") return;",
              "    const handlePointerDown = (event) => {\n"
              "      syncPointer(event);\n"
              "      if (controlledProgressRef.current !== null) return;\n"
              "      if (event.pointerType === \"mouse\") return;",
          )

          replace_once(
              "pointer move guard",
              "    const handlePointerMove = (event) => {\n"
              "      syncPointer(event);\n"
              "      if (!drag.active || event.pointerId !== drag.pointerId) return;",
              "    const handlePointerMove = (event) => {\n"
              "      syncPointer(event);\n"
              "      if (controlledProgressRef.current !== null) return;\n"
              "      if (!drag.active || event.pointerId !== drag.pointerId) return;",
          )

          replace_once(
              "keyboard guard",
              "    const handleKeyDown = (event) => {\n"
              "      const target = event.target;",
              "    const handleKeyDown = (event) => {\n"
              "      if (controlledProgressRef.current !== null) return;\n"
              "      const target = event.target;",
          )

          replace_once(
              "controlled cleanup",
              "      cancelAnimationFrame(animationFrameRef.current);\n"
              "      resetSimulationRef.current = () => {};\n"
              "      window.removeEventListener(\"wheel\", handleWheel);",
              "      cancelAnimationFrame(animationFrameRef.current);\n"
              "      resetSimulationRef.current = () => {};\n"
              "      syncControlledProgressRef.current = () => {};\n"
              "      window.removeEventListener(\"wheel\", handleWheel);",
          )

          path.write_text(source, encoding="utf-8")

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test -- --watchAll=false --runInBand
        env:
          CI: true

      - name: Build production bundle
        run: npm run build
        env:
          CI: true

      - name: Commit the integrated narrative
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/RuptureCanvas.js
          git rm .github/workflows/apply-scroll-driven-dither.yml
          git commit -m "Integrate scroll-driven dither narrative"
          git push origin HEAD:agent/scroll-driven-dither-narrative
