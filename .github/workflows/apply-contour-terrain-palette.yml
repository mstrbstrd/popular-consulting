name: Apply Contour Drift terrain palette

on:
  push:
    branches:
      - agent/contour-drift-terrain-palette
    paths:
      - .github/workflows/apply-contour-terrain-palette.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/contour-drift-terrain-palette
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Add the terrain-map palette without changing field geometry
        shell: python
        run: |
          from pathlib import Path

          def replace_expected(text, old, new, expected, label):
              count = text.count(old)
              if count != expected:
                  raise SystemExit(
                      f"{label}: expected {expected} target(s), found {count}."
                  )
              return text.replace(old, new)

          page_path = Path("src/components/DitherCanvasPage.js")
          page = page_path.read_text(encoding="utf-8")

          page = replace_expected(
              page,
              '''    description:
                "Procedural terrain flows like suspended pigment, with elevation expressed through viscous spectral contour bands and crisp Bayer cells.",''',
              '''    description:
                "A living relief map drifts beneath pale topographic lines: teal basins, green lowlands, stone ridges, and light summits gain depth through hillshade while spectral color clings subtly to each contour edge.",''',
              1,
              "Contour Drift description",
          )

          page = replace_expected(
              page,
              '''const TIDAL_PALETTE_WATER = "water";
          const TIDAL_PALETTE_SPECTRAL = "spectral";
          const EXIT_DURATION_MS = 420;''',
              '''const TIDAL_PALETTE_WATER = "water";
          const TIDAL_PALETTE_SPECTRAL = "spectral";
          const CONTOUR_PALETTE_TERRAIN = "terrain";
          const CONTOUR_PALETTE_SPECTRAL = "spectral";
          const EXIT_DURATION_MS = 420;''',
              1,
              "palette constants",
          )

          page = replace_expected(
              page,
              '''  const [fieldState, setFieldState] = useState(STUDIES[0].initialState);
            const [tidalPalette, setTidalPalette] = useState(TIDAL_PALETTE_WATER);
            const activeStudy = STUDIES[displayStudyIndex];''',
              '''  const [fieldState, setFieldState] = useState(STUDIES[0].initialState);
            const [tidalPalette, setTidalPalette] = useState(TIDAL_PALETTE_WATER);
            const [contourPalette, setContourPalette] = useState(
              CONTOUR_PALETTE_TERRAIN,
            );
            const activeStudy = STUDIES[displayStudyIndex];''',
              1,
              "Contour palette state",
          )

          page = replace_expected(
              page,
              '''        mode={activeStudy.mode}
                  tidalPalette={tidalPalette}
                  onFieldStateChange={setFieldState}''',
              '''        mode={activeStudy.mode}
                  contourPalette={contourPalette}
                  tidalPalette={tidalPalette}
                  onFieldStateChange={setFieldState}''',
              1,
              "Contour palette renderer prop",
          )

          contour_selector = '''          {activeStudy.id === "contour-drift" && (
            <div
              className="contour-palette-selector"
              role="group"
              aria-label="Contour Drift color scheme"
            >
              <span className="contour-palette-selector-label">Color</span>
              <button
                type="button"
                className={`contour-palette-option${
                  contourPalette === CONTOUR_PALETTE_TERRAIN ? " is-active" : ""
                }`}
                data-palette="terrain"
                onClick={() => setContourPalette(CONTOUR_PALETTE_TERRAIN)}
                aria-pressed={contourPalette === CONTOUR_PALETTE_TERRAIN}
                aria-label="Use terrain colors for Contour Drift"
              >
                Terrain
              </button>
              <button
                type="button"
                className={`contour-palette-option${
                  contourPalette === CONTOUR_PALETTE_SPECTRAL ? " is-active" : ""
                }`}
                data-palette="spectral"
                onClick={() => setContourPalette(CONTOUR_PALETTE_SPECTRAL)}
                aria-pressed={contourPalette === CONTOUR_PALETTE_SPECTRAL}
                aria-label="Use spectral colors for Contour Drift"
              >
                Spectral
              </button>
            </div>
          )}
          <div className="dither-study-options">'''

          page = replace_expected(
              page,
              '''          )}
                    <div className="dither-study-options">''',
              '''          )}
          ''' + contour_selector,
              1,
              "Contour palette selector",
          )
          page_path.write_text(page, encoding="utf-8")

          canvas_path = Path("src/components/CreatorOSFieldCanvas.js")
          canvas = canvas_path.read_text(encoding="utf-8")

          canvas = replace_expected(
              canvas,
              '''const resolveTidalPaletteMix = (palette) =>
            normalizeTidalPalette(palette) === "spectral" ? 1 : 0;

          const createRandom = (seed) => {''',
              '''const resolveTidalPaletteMix = (palette) =>
            normalizeTidalPalette(palette) === "spectral" ? 1 : 0;

          const normalizeContourPalette = (palette) =>
            palette === "spectral" ? "spectral" : "terrain";

          const resolveContourPaletteMix = (palette) =>
            normalizeContourPalette(palette) === "spectral" ? 1 : 0;

          const createRandom = (seed) => {''',
              1,
              "Contour palette helpers",
          )

          canvas = replace_expected(
              canvas,
              '''const CreatorOSFieldCanvas = ({
            isDark = false,
            mode = 0,
            onFieldStateChange,
            paused = false,
            resetVersion = 0,
            tidalPalette = "water",
          }) => {''',
              '''const CreatorOSFieldCanvas = ({
            contourPalette = "terrain",
            isDark = false,
            mode = 0,
            onFieldStateChange,
            paused = false,
            resetVersion = 0,
            tidalPalette = "water",
          }) => {''',
              1,
              "Contour palette prop",
          )

          canvas = replace_expected(
              canvas,
              '''  const lightRef = useRef(isDark ? 0 : 1);
            const modeRef = useRef(clampMode(mode));
            const tidalPaletteRef = useRef(resolveTidalPaletteMix(tidalPalette));''',
              '''  const lightRef = useRef(isDark ? 0 : 1);
            const modeRef = useRef(clampMode(mode));
            const contourPaletteRef = useRef(
              resolveContourPaletteMix(contourPalette),
            );
            const tidalPaletteRef = useRef(resolveTidalPaletteMix(tidalPalette));''',
              1,
              "Contour palette ref",
          )

          canvas = replace_expected(
              canvas,
              '''  useEffect(() => {
            tidalPaletteRef.current = resolveTidalPaletteMix(tidalPalette);
            redrawRef.current();
          }, [tidalPalette]);''',
              '''  useEffect(() => {
            contourPaletteRef.current = resolveContourPaletteMix(contourPalette);
            redrawRef.current();
          }, [contourPalette]);

          useEffect(() => {
            tidalPaletteRef.current = resolveTidalPaletteMix(tidalPalette);
            redrawRef.current();
          }, [tidalPalette]);''',
              1,
              "Contour palette redraw effect",
          )

          canvas = replace_expected(
              canvas,
              '''      "u_modeB",
                "u_modeMix",
                "u_tidalPaletteMix",''',
              '''      "u_modeB",
                "u_modeMix",
                "u_contourPaletteMix",
                "u_tidalPaletteMix",''',
              1,
              "Contour palette uniform collection",
          )

          canvas = replace_expected(
              canvas,
              '''      gl.uniform1f(displayUniforms.u_modeMix, modeMix);
                gl.uniform1f(
                  displayUniforms.u_tidalPaletteMix,
                  tidalPaletteRef.current,
                );''',
              '''      gl.uniform1f(displayUniforms.u_modeMix, modeMix);
                gl.uniform1f(
                  displayUniforms.u_contourPaletteMix,
                  contourPaletteRef.current,
                );
                gl.uniform1f(
                  displayUniforms.u_tidalPaletteMix,
                  tidalPaletteRef.current,
                );''',
              1,
              "Contour palette uniform draw",
          )

          canvas = replace_expected(
              canvas,
              '''      className={`creatoros-field-shell creatoros-field-mode-${clampMode(mode)} creatoros-field-palette-${normalizeTidalPalette(tidalPalette)}${
                fallback ? " is-fallback" : ""
              }`}''',
              '''      className={`creatoros-field-shell creatoros-field-mode-${clampMode(mode)} creatoros-field-palette-${normalizeTidalPalette(tidalPalette)} creatoros-field-contour-palette-${normalizeContourPalette(contourPalette)}${
                fallback ? " is-fallback" : ""
              }`}''',
              1,
              "Contour palette class",
          )
          canvas_path.write_text(canvas, encoding="utf-8")

          shader_path = Path("src/components/CreatorOSFieldShader.js")
          shader = shader_path.read_text(encoding="utf-8")

          shader = replace_expected(
              shader,
              '''uniform float u_modeMix;
          uniform float u_tidalPaletteMix;''',
              '''uniform float u_modeMix;
          uniform float u_contourPaletteMix;
          uniform float u_tidalPaletteMix;''',
              1,
              "Contour palette shader uniform",
          )

          old_contour_color = '''  vec3 tint = spectral(
            0.08 + terrain * 0.88 + p.x * 0.035 + time * 0.010 + u_seed * 0.14
          );

          return fluidMaterial(field, tint, 0.24, 0.18, 0.84);'''

          new_contour_color = '''  vec3 spectralTint = spectral(
            0.08 + terrain * 0.88 + p.x * 0.035 + time * 0.010 + u_seed * 0.14
          );

          // A hypsometric terrain palette supplies the familiar visual hierarchy
          // of water, lowland, upland, stone, and pale summit relief.
          vec3 basinTone = mix(
            vec3(0.035, 0.155, 0.170),
            vec3(0.480, 0.720, 0.690),
            u_light
          );
          vec3 lowlandTone = mix(
            vec3(0.095, 0.285, 0.190),
            vec3(0.430, 0.660, 0.430),
            u_light
          );
          vec3 uplandTone = mix(
            vec3(0.290, 0.360, 0.190),
            vec3(0.650, 0.690, 0.410),
            u_light
          );
          vec3 ridgeTone = mix(
            vec3(0.460, 0.360, 0.260),
            vec3(0.730, 0.610, 0.440),
            u_light
          );
          vec3 summitTone = mix(
            vec3(0.820, 0.825, 0.770),
            vec3(0.960, 0.945, 0.890),
            u_light
          );
          vec3 terrainTint = mix(
            basinTone,
            lowlandTone,
            smoothstep(0.16, 0.35, terrain)
          );
          terrainTint = mix(
            terrainTint,
            uplandTone,
            smoothstep(0.34, 0.57, terrain)
          );
          terrainTint = mix(
            terrainTint,
            ridgeTone,
            smoothstep(0.56, 0.76, terrain)
          );
          terrainTint = mix(
            terrainTint,
            summitTone,
            smoothstep(0.75, 0.94, terrain)
          );

          // Screen-space slope becomes a pseudo normal, creating hillshade without
          // changing the terrain field, contour geometry, timing, or interaction.
          vec2 terrainSlope = vec2(dFdx(terrain), dFdy(terrain));
          vec3 terrainNormal = normalize(vec3(
            -terrainSlope.x * 18.0,
            -terrainSlope.y * 18.0,
            1.0
          ));
          vec3 reliefLight = normalize(vec3(-0.48, 0.58, 0.66));
          float hillshade = 0.5 + 0.5 * dot(terrainNormal, reliefLight);
          float reliefValue = smoothstep(0.08, 0.96, hillshade);
          terrainTint *= mix(0.72, 1.16, reliefValue);
          terrainTint += summitTone * pow(reliefValue, 5.0) * 0.055;

          vec3 contourInk = mix(
            vec3(0.960, 0.985, 0.940),
            vec3(1.080, 1.065, 1.000),
            u_light
          );
          float contourLine = sat(contour * 0.72 + secondary * 0.24);
          terrainTint = mix(terrainTint, contourInk, contourLine);

          // The site spectrum appears only as a very low-chroma film on both
          // edges of each topographic line, keeping the map earthy at a glance.
          float contourEdgeWidth = max(fwidth(contour) * 0.70, 0.009);
          float contourEdge = 1.0 - smoothstep(
            contourEdgeWidth,
            contourEdgeWidth * 1.95,
            abs(contour - 0.58)
          );
          float secondaryEdgeWidth = max(fwidth(secondary) * 0.58, 0.008);
          float secondaryEdge = 1.0 - smoothstep(
            secondaryEdgeWidth,
            secondaryEdgeWidth * 1.90,
            abs(secondary - 0.56)
          );
          float spectralEdge = sat(contourEdge + secondaryEdge * 0.20);
          vec3 contourSpectrum = spectral(
            0.62
              + terrain * 0.38
              + p.x * 0.050
              - p.y * 0.030
              + time * 0.006
              + u_seed * 0.10
          );
          float contourChroma = mix(0.14, 0.10, u_light);
          vec3 spectralContourEdge = mix(
            contourInk,
            contourSpectrum,
            contourChroma
          );
          spectralContourEdge = max(
            spectralContourEdge,
            contourInk * 0.82
          );
          terrainTint = mix(
            terrainTint,
            spectralContourEdge,
            spectralEdge * 0.64
          );

          float terrainPaletteWeight = 1.0 - sat(u_contourPaletteMix);
          vec3 tint = mix(
            terrainTint,
            spectralTint,
            sat(u_contourPaletteMix)
          );
          vec4 material = fluidMaterial(field, tint, 0.24, 0.18, 0.84);
          material.rgb = mix(
            material.rgb,
            max(material.rgb, contourInk * 0.72),
            terrainPaletteWeight * contourLine * 0.34
          );
          return material;'''

          shader = replace_expected(
              shader,
              old_contour_color,
              new_contour_color,
              1,
              "Contour Drift color block",
          )
          shader_path.write_text(shader, encoding="utf-8")

          page_css_path = Path("src/components/DitherCanvasPage.css")
          page_css = page_css_path.read_text(encoding="utf-8")

          page_css = replace_expected(
              page_css,
              '''.rupture-brand:focus-visible,
          .rupture-nav button:focus-visible,
          .tidal-palette-option:focus-visible,
          .dither-study-option:focus-visible {''',
              '''.rupture-brand:focus-visible,
          .rupture-nav button:focus-visible,
          .tidal-palette-option:focus-visible,
          .contour-palette-option:focus-visible,
          .dither-study-option:focus-visible {''',
              1,
              "palette focus selector",
          )

          page_css = replace_expected(
              page_css,
              ".tidal-palette-selector {",
              ".tidal-palette-selector,\n.contour-palette-selector {",
              2,
              "palette selector layout",
          )
          page_css = replace_expected(
              page_css,
              ".tidal-palette-selector-label {",
              ".tidal-palette-selector-label,\n.contour-palette-selector-label {",
              2,
              "palette selector label",
          )
          page_css = replace_expected(
              page_css,
              ".tidal-palette-option {",
              ".tidal-palette-option,\n.contour-palette-option {",
              2,
              "palette option",
          )
          page_css = replace_expected(
              page_css,
              ".tidal-palette-option:hover {",
              ".tidal-palette-option:hover,\n.contour-palette-option:hover {",
              1,
              "palette option hover",
          )
          page_css = replace_expected(
              page_css,
              '''.tidal-palette-option.is-active[data-palette="spectral"] {''',
              '''.tidal-palette-option.is-active[data-palette="spectral"],
          .contour-palette-option.is-active[data-palette="spectral"] {''',
              1,
              "spectral palette option",
          )

          terrain_option = '''.contour-palette-option.is-active[data-palette="terrain"] {
            border-color: rgba(187, 215, 156, 0.64);
            background: linear-gradient(
              135deg,
              rgba(30, 79, 59, 0.94),
              rgba(105, 132, 76, 0.88) 52%,
              rgba(179, 156, 104, 0.86)
            );
            color: rgba(249, 252, 239, 0.99);
            box-shadow:
              inset 0 1px 0 rgba(244, 250, 226, 0.40),
              0 0 1.8rem rgba(145, 177, 109, 0.22);
          }

          '''
          spectral_selector_marker = '''.tidal-palette-option.is-active[data-palette="spectral"],
          .contour-palette-option.is-active[data-palette="spectral"] {'''
          page_css = replace_expected(
              page_css,
              spectral_selector_marker,
              terrain_option + spectral_selector_marker,
              1,
              "terrain palette option style",
          )
          page_css_path.write_text(page_css, encoding="utf-8")

          field_css_path = Path("src/components/CreatorOSFieldCanvas.css")
          field_css = field_css_path.read_text(encoding="utf-8")

          contour_surface = '''.creatoros-field-mode-3.creatoros-field-contour-palette-terrain {
            background:
              radial-gradient(ellipse at 72% 20%, rgba(246, 244, 224, 0.42), transparent 29%),
              radial-gradient(ellipse at 24% 76%, rgba(75, 138, 102, 0.24), transparent 39%),
              linear-gradient(145deg, #b8d4c7 0%, #8fb47d 40%, #8b7659 72%, #d9d5c8 100%);
          }

          [data-theme="dark"] .creatoros-field-mode-3.creatoros-field-contour-palette-terrain {
            background:
              radial-gradient(ellipse at 72% 20%, rgba(221, 223, 190, 0.12), transparent 30%),
              radial-gradient(ellipse at 24% 76%, rgba(73, 133, 96, 0.16), transparent 40%),
              linear-gradient(145deg, #071719 0%, #173425 42%, #493b2c 74%, #77776d 100%);
          }

          '''
          field_css = replace_expected(
              field_css,
              ".creatoros-field-canvas {",
              contour_surface + ".creatoros-field-canvas {",
              1,
              "Contour terrain surface",
          )

          old_fallback = '''.creatoros-field-mode-3 .creatoros-field-fallback {
            background:
              repeating-radial-gradient(ellipse at 58% 44%, transparent 0 2.8rem, rgba(157, 0, 255, 0.24) 2.95rem 3.2rem, transparent 3.35rem 6.1rem),
              radial-gradient(circle at 32% 65%, rgba(0, 238, 255, 0.28), transparent 30%),
              #fff8f7;
          }'''

          new_fallback = '''.creatoros-field-mode-3.creatoros-field-contour-palette-terrain .creatoros-field-fallback {
            background:
              repeating-radial-gradient(ellipse at 58% 44%, transparent 0 2.8rem, rgba(243, 244, 226, 0.52) 2.95rem 3.18rem, transparent 3.34rem 6.1rem),
              radial-gradient(circle at 32% 65%, rgba(73, 139, 99, 0.30), transparent 30%),
              linear-gradient(145deg, #a9cbbd 0%, #84aa74 45%, #8a7557 76%, #d8d3c5 100%);
          }

          [data-theme="dark"] .creatoros-field-mode-3.creatoros-field-contour-palette-terrain .creatoros-field-fallback {
            background:
              repeating-radial-gradient(ellipse at 58% 44%, transparent 0 2.8rem, rgba(221, 225, 201, 0.34) 2.95rem 3.18rem, transparent 3.34rem 6.1rem),
              radial-gradient(circle at 32% 65%, rgba(64, 126, 89, 0.24), transparent 30%),
              linear-gradient(145deg, #071719 0%, #173425 45%, #493b2c 76%, #737369 100%);
          }

          .creatoros-field-mode-3.creatoros-field-contour-palette-spectral .creatoros-field-fallback {
            background:
              repeating-radial-gradient(ellipse at 58% 44%, transparent 0 2.8rem, rgba(157, 0, 255, 0.24) 2.95rem 3.2rem, transparent 3.35rem 6.1rem),
              radial-gradient(circle at 32% 65%, rgba(0, 238, 255, 0.28), transparent 30%),
              #fff8f7;
          }'''

          field_css = replace_expected(
              field_css,
              old_fallback,
              new_fallback,
              1,
              "Contour fallback palettes",
          )
          field_css_path.write_text(field_css, encoding="utf-8")

          page_test_path = Path("src/components/DitherCanvasPage.test.js")
          page_test = page_test_path.read_text(encoding="utf-8")

          page_test = replace_expected(
              page_test,
              '''  return ({
                isDark,
                mode,
                onFieldStateChange,
                paused,
                resetVersion,
                tidalPalette = "water",
              }) => ReactModule.createElement(''',
              '''  return ({
                contourPalette = "terrain",
                isDark,
                mode,
                onFieldStateChange,
                paused,
                resetVersion,
                tidalPalette = "water",
              }) => ReactModule.createElement(''',
              1,
              "renderer test mock props",
          )

          page_test = replace_expected(
              page_test,
              '''        "data-mode": String(mode),
                    "data-tidal-palette": tidalPalette,''',
              '''        "data-mode": String(mode),
                    "data-contour-palette": contourPalette,
                    "data-tidal-palette": tidalPalette,''',
              1,
              "renderer test contour attribute",
          )

          contour_page_test = '''  test("defaults Contour Drift to terrain and keeps spectral as a color-only option", () => {
            render(<DitherCanvasPage />);

            fireEvent.click(screen.getByRole("button", { name: /Contour Drift/ }));
            flushScrollFrame();
            finishStudyTransition();

            expect(
              screen.getByRole("heading", { name: "Contour Drift" }),
            ).toBeInTheDocument();
            const renderer = screen.getByTestId("creatoros-field-renderer");
            expect(renderer).toHaveAttribute("data-mode", "3");
            expect(renderer).toHaveAttribute("data-contour-palette", "terrain");

            const paletteGroup = screen.getByRole("group", {
              name: "Contour Drift color scheme",
            });
            const terrainOption = within(paletteGroup).getByRole("button", {
              name: "Use terrain colors for Contour Drift",
            });
            const spectralOption = within(paletteGroup).getByRole("button", {
              name: "Use spectral colors for Contour Drift",
            });
            expect(terrainOption).toHaveAttribute("aria-pressed", "true");
            expect(spectralOption).toHaveAttribute("aria-pressed", "false");

            fireEvent.click(spectralOption);
            expect(screen.getByTestId("creatoros-field-renderer")).toHaveAttribute(
              "data-mode",
              "3",
            );
            expect(screen.getByTestId("creatoros-field-renderer")).toHaveAttribute(
              "data-contour-palette",
              "spectral",
            );
            expect(terrainOption).toHaveAttribute("aria-pressed", "false");
            expect(spectralOption).toHaveAttribute("aria-pressed", "true");
          });

          '''
          page_test = replace_expected(
              page_test,
              '''  test("keeps theme, pause, state, and Forward Pass behavior across scroll changes", () => {''',
              contour_page_test
              + '''  test("keeps theme, pause, state, and Forward Pass behavior across scroll changes", () => {''',
              1,
              "Contour palette page test",
          )
          page_test_path.write_text(page_test, encoding="utf-8")

          terrain_test_path = Path(
              "src/components/ContourDriftTerrainPalette.test.js"
          )
          terrain_test_path.write_text(
              '''import { CREATOROS_FIELD_FRAGMENT_SHADER } from "./CreatorOSFieldShader";

          describe("Contour Drift terrain palette", () => {
            const contourStart = CREATOROS_FIELD_FRAGMENT_SHADER.indexOf(
              "vec4 sceneContourDrift",
            );
            const contourEnd = CREATOROS_FIELD_FRAGMENT_SHADER.indexOf(
              "vec4 sceneMorphogen",
            );
            const contourScene = CREATOROS_FIELD_FRAGMENT_SHADER.slice(
              contourStart,
              contourEnd,
            );

            test("renders hypsometric relief with subtle spectral contour edges", () => {
              expect(contourStart).toBeGreaterThanOrEqual(0);
              expect(contourEnd).toBeGreaterThan(contourStart);
              expect(CREATOROS_FIELD_FRAGMENT_SHADER).toContain(
                "uniform float u_contourPaletteMix",
              );
              expect(contourScene).toContain("vec3 basinTone");
              expect(contourScene).toContain("vec3 lowlandTone");
              expect(contourScene).toContain("vec3 uplandTone");
              expect(contourScene).toContain("vec3 ridgeTone");
              expect(contourScene).toContain("vec3 summitTone");
              expect(contourScene).toContain("dFdx(terrain)");
              expect(contourScene).toContain("dFdy(terrain)");
              expect(contourScene).toContain("vec3 terrainNormal");
              expect(contourScene).toContain("float hillshade");
              expect(contourScene).toContain("float contourEdge");
              expect(contourScene).toContain("float secondaryEdge");
              expect(contourScene).toContain("vec3 contourSpectrum");
              expect(contourScene).toContain("mix(0.14, 0.10, u_light)");
              expect(contourScene).toContain("spectralEdge * 0.64");
              expect(contourScene).toContain(
                "float terrainPaletteWeight = 1.0 - sat(u_contourPaletteMix)",
              );
              expect(contourScene).toContain("terrainTint,");
              expect(contourScene).toContain("spectralTint,");
              expect(contourScene).toContain("sat(u_contourPaletteMix)");
            });

            test("preserves the existing field, motion, and material geometry", () => {
              expect(contourScene).toContain(
                "uv = pointerFlow(uv, 0.032)",
              );
              expect(contourScene).toContain(
                "vec2 p = viscousWarp(centeredUv(uv), time, 0.24)",
              );
              expect(contourScene).toContain("float levels = terrain * 10.5");
              expect(contourScene).toContain("contour * 1.18");
              expect(contourScene).toContain("secondary * 0.34");
              expect(contourScene).toContain("land * 0.38");
              expect(contourScene).toContain("basin * 0.12");
              expect(contourScene).toContain("pulse * 0.58");
              expect(contourScene).toContain(
                "vec4 material = fluidMaterial(field, tint, 0.24, 0.18, 0.84)",
              );
            });
          });
          ''',
              encoding="utf-8",
          )

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test -- --watchAll=false --runInBand
        env:
          CI: true

      - name: Build production bundle
        run: npm run build
        env:
          CI: true

