name: Verify original Second Surface default and pre-run

on:
  push:
    branches:
      - fix/second-surface-original-default-prerun-20260901

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/second-surface-original-default-prerun-20260901
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply guarded Second Surface patch
        run: python scripts/fix_second_surface_default_and_prerun.py
      - name: Check whitespace
        run: git diff --check
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test -- --watchAll=false --runInBand
        env:
          CI: true
      - name: Build
        run: npm run build
        env:
          CI: true
      - name: Commit verified source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/fix_second_surface_default_and_prerun.py
          git rm .github/workflows/fix-second-surface-default-and-prerun.yml
          git add src/components/DitherCanvasPage.js src/components/DitherCanvasPage.test.js src/components/DitherCanvasRuntimeContract.test.js
          git diff --cached --check
          git commit -m "Restore original Second Surface default"
          git push origin "HEAD:${GITHUB_REF_NAME}"
