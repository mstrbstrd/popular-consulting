name: Apply Morphogen organism default restoration

on:
  push:
    branches:
      - agent/restore-morphogen-organism-default
    paths:
      - .github/workflows/apply-morphogen-organism-default.yml

permissions:
  contents: write

jobs:
  restore-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/restore-morphogen-organism-default
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Correct legacy test expectation in patch helper
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/restore_morphogen_organism_default.py")
          source = path.read_text(encoding="utf-8")
          old = '      "fragColor = vec4(sat(u), sat(v), activity, 1.0)",'
          new = '      "fragColor = vec4(sat(u), sat(v), activity, sat(paint))",'
          count = source.count(old)
          if count != 1:
              raise SystemExit(
                  f"legacy test expectation: expected one match, found {count}."
              )
          path.write_text(source.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Restore original Morphogen default
        run: python scripts/restore_morphogen_organism_default.py

      - name: Verify patch whitespace
        run: git diff --check

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test -- --watchAll=false --runInBand
        env:
          CI: true

      - name: Build production bundle
        run: npm run build
        env:
          CI: true

      - name: Commit and push restoration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/components/DitherCanvasPage.js \
            src/components/CreatorOSFieldCanvas.js \
            src/components/CreatorOSFieldShader.js \
            src/components/MorphogenPaintMode.test.js \
            src/components/CreatorOSFieldCanvas.test.js
          git rm -f \
            .github/workflows/apply-morphogen-organism-default.yml \
            scripts/restore_morphogen_organism_default.py
          git commit -m "Restore Morphogen organism default"
          git push origin HEAD:agent/restore-morphogen-organism-default
