name: Apply light Tidal Weave caustics

on:
  push:
    branches:
      - agent/light-tidal-caustics
    paths:
      - .github/workflows/apply-light-tidal-caustics.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/light-tidal-caustics
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Refine Tidal Weave line colors
        shell: python
        run: |
          from pathlib import Path

          shader_path = Path("src/components/CreatorOSFieldShader.js")
          shader = shader_path.read_text(encoding="utf-8")

          scene_start = shader.find("vec4 sceneTidalWeave(vec2 uv, float time) {")
          color_start = shader.find(
              "  vec3 waterTintA = tidalWaterPalette(",
              scene_start,
          )
          scene_end = shader.find(
              "\n}\n\nvec4 sceneMoireHalo",
              color_start,
          )
          if scene_start < 0 or color_start < 0 or scene_end < 0:
              raise SystemExit("Tidal Weave color block boundaries changed.")

          new_color_block = r'''  // Keep every visible caustic pale, even over the dark water surface.
          // The tropical depth now lives beneath the transparent field rather than
          // darkening the reflected-light lines themselves.
          float causticSignal = sat(max(bandA, bandB));
          float crossingCrystal = pow(sat(crossing), 0.72);
          vec3 causticGray = mix(
            vec3(1.280, 1.320, 1.300),
            vec3(1.340, 1.370, 1.350),
            u_light
          );
          vec3 refractedLight = mix(
            vec3(1.480, 1.540, 1.510),
            vec3(1.550, 1.590, 1.570),
            u_light
          );
          float causticLift = sat(
            0.10
              + causticSignal * 0.38
              + crossingCrystal * 0.34
              + pointerWake * 0.08
              + pulse * 0.10
          );
          vec3 waterTint = mix(causticGray, refractedLight, causticLift);

          // Isolate the site palette to a very thin iso-line around each caustic.
          // Mixing it over the bright gray floor preserves hue without allowing
          // violet or blue channels to create dark sections in dark mode.
          float outlineWidthA = max(fwidth(bandA) * 0.55, 0.008);
          float outlineWidthB = max(fwidth(bandB) * 0.55, 0.008);
          float outlineA = 1.0 - smoothstep(
            outlineWidthA,
            outlineWidthA * 2.15,
            abs(bandA - 0.30)
          );
          float outlineB = 1.0 - smoothstep(
            outlineWidthB,
            outlineWidthB * 2.15,
            abs(bandB - 0.30)
          );
          float spectralOutline = sat(max(outlineA, outlineB));
          vec3 spectralOutlineTint = causticGray * 0.70
            + spectralTint * 0.58;
          waterTint = mix(
            waterTint,
            spectralOutlineTint,
            spectralOutline * 0.78
          );

          vec3 tint = mix(
            waterTint,
            spectralTint,
            sat(u_tidalPaletteMix)
          );
          return fluidMaterial(field, tint, 0.34, 0.22, 0.94);'''

          shader_path.write_text(
              shader[:color_start] + new_color_block + shader[scene_end:],
              encoding="utf-8",
          )

          test_path = Path("src/components/CreatorOSFieldCanvas.test.js")
          test_source = test_path.read_text(encoding="utf-8")
          old_expectations = '''    expect(tidalScene).toContain("float causticLines");
              expect(tidalScene).toContain("vec3 refractedLight");
              expect(tidalScene).toContain(
                "waterTint = mix(waterTint, refractedLight, causticAmount)",
              );'''
          new_expectations = '''    expect(tidalScene).not.toContain("vec3 waterTintA");
              expect(tidalScene).toContain("float causticSignal");
              expect(tidalScene).toContain("vec3 causticGray");
              expect(tidalScene).toContain("vec3(1.280, 1.320, 1.300)");
              expect(tidalScene).toContain("vec3(1.340, 1.370, 1.350)");
              expect(tidalScene).toContain("fwidth(bandA)");
              expect(tidalScene).toContain("fwidth(bandB)");
              expect(tidalScene).toContain("float spectralOutline");
              expect(tidalScene).toContain("vec3 spectralOutlineTint");
              expect(tidalScene).toContain(
                "waterTint = mix(causticGray, refractedLight, causticLift)",
              );
              expect(tidalScene).toContain("spectralOutline * 0.78");'''
          if test_source.count(old_expectations) != 1:
              raise SystemExit("Tidal Weave color expectations changed.")
          test_path.write_text(
              test_source.replace(old_expectations, new_expectations),
              encoding="utf-8",
          )

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test -- --watchAll=false --runInBand
        env:
          CI: true

      - name: Build production bundle
        run: npm run build
        env:
          CI: true

      - name: Commit the line color refinement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/components/CreatorOSFieldShader.js \
            src/components/CreatorOSFieldCanvas.test.js
          git rm .github/workflows/apply-light-tidal-caustics.yml
          git commit -m "Keep Tidal Weave caustics light"
          git push origin HEAD:agent/light-tidal-caustics
