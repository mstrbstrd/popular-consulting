name: Intrinsic Orb visual review capture

on:
  push:
    branches:
      - feature/intrinsic-metabloom-avatar-20260903

permissions:
  contents: read

jobs:
  capture:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build production bundle
        run: npm run build
        env:
          CI: true

      - name: Capture intrinsic Metabloom avatar
        run: node scripts/capture-orb-review.mjs

      - name: Upload Orb review images
        uses: actions/upload-artifact@v4
        with:
          name: intrinsic-orb-review-${{ github.sha }}
          path: orb-review/*.png
          if-no-files-found: error
          retention-days: 3
